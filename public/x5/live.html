<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>X5诊断 · 真首页·在线检测（关键）</title>
<style>*{box-sizing:border-box;margin:0;padding:0}
body{background:#030303;color:#EFEFEF;font-family:monospace}
.note{max-width:640px;margin:24px auto;padding:16px 20px;line-height:1.9;font-size:14px;background:rgba(0,0,0,.6);border:1px solid #444;border-radius:8px;position:relative;z-index:50}
.note b{color:#d4af37}

</style>

<script>
(function(){
  var frames=0,last=0,el=null;
  function loop(t){
    frames++;
    if(!last)last=t;
    if(t-last>=800){
      var fps=Math.round(frames*1000/(t-last));
      if(el){el.textContent=fps+' FPS';el.style.color=fps>=50?'#4f4':(fps>=25?'#fd4':'#f44');}
      frames=0;last=t;
    }
    requestAnimationFrame(loop);
  }
  function boot(){
    el=document.createElement('div');
    el.style.cssText='position:fixed;top:10px;right:10px;z-index:2147483647;font:700 24px/1 monospace;color:#4f4;background:rgba(0,0,0,.85);padding:10px 14px;border:2px solid #666;border-radius:8px;pointer-events:none';
    document.body.appendChild(el);
    requestAnimationFrame(loop);
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
})();
</script>
</head><body>
<div class="note"><b>【真首页·在线检测（关键）】</b><br>本页做两件事：<br>1. <b>检测你实际加载的首页是新是旧</b>（X5 缓存经常坑人）<br>2. 把真实首页装进 iframe，用外层 FPS 探针测它的<b>真实帧率</b>。<br>如果显示「新版」且 FPS 依然 &lt;20 → 说明降级没起效或另有元凶，把 FPS 数字告诉我。<br><span style="color:#888">右上角 FPS：绿≥50 / 黄25-50 / 红&lt;25。</span></div>
<div id="info" style="max-width:640px;margin:20px auto;padding:18px;line-height:2.2;font-size:14px;border:1px solid #444;border-radius:8px;position:relative;z-index:40;background:rgba(0,0,0,.75)"></div>
<script>
var info=document.getElementById('info');
function say(s,c){var p=document.createElement('div');p.innerHTML=s;if(c)p.style.color=c;info.appendChild(p);}
say('正在 fetch 线上首页 HTML 检查版本…');
fetch('/?t='+Date.now()).then(function(r){return r.text()}).then(function(html){
  var hasX5=html.indexOf('MQQBrowser')>-1;
  var hasStop=html.indexOf('stopHomeAnim')>-1;
  say('版本检测：'+(hasX5&&hasStop
    ?'<b style="color:#4f4">✅ 新版（含 X5 降级代码）</b>'
    :'<b style="color:#f44">❌ 旧版/缓存（不含 X5 降级代码！你之前测的首页就是旧的）</b>'));
  say('下面 iframe 加载的就是真实首页。看右上角 <b>本页（外层）FPS</b>：这是首页所在容器的真实帧率。');
  var f=document.createElement('iframe');
  f.src='/?v=liveprobe'+Date.now();
  f.style.cssText='position:fixed;inset:0;width:100%;height:100%;border:0;z-index:1';
  f.setAttribute('allow','fullscreen');
  document.body.appendChild(f);
}).catch(function(e){say('fetch 失败：'+e.message,'#f44')});</script>
</body></html>
