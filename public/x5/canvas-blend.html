<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>X5诊断 · 猜想C+A·粒子canvas叠blend巨字（关键）</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#030303;color:#EFEFEF;font-family:monospace;min-height:100vh;overflow-x:hidden}
.note{position:relative;z-index:50;max-width:640px;margin:24px auto;padding:16px 20px;line-height:1.9;font-size:14px;background:rgba(0,0,0,.6);border:1px solid #444;border-radius:8px}
.note b{color:#d4af37}
canvas{width:100vw;height:100vh}
   .bg-text-container{position:fixed;top:50%;left:5%;transform:translateY(-50%);z-index:3;pointer-events:none;mix-blend-mode:exclusion}
   .giant-text{font-size:clamp(6rem,10vw,12rem);font-weight:900;line-height:0.8;color:transparent;-webkit-text-stroke:1px rgba(255,255,255,0.15)}
   .giant-text.kanji{-webkit-text-stroke:1px #d4af37;text-shadow:0 0 30px rgba(212,175,55,0.25);margin-left:20%;margin-top:-5%;opacity:0.85}
</style>

<script>
(function(){
  var frames=0,last=0,el=null;
  function loop(t){
    frames++;
    if(!last)last=t;
    if(t-last>=800){
      var fps=Math.round(frames*1000/(t-last));
      if(el){el.textContent=fps+' FPS';el.style.color=fps>=50?'#4f4':(fps>=25?'#fd4':'#f44');}
      frames=0;last=t;
    }
    requestAnimationFrame(loop);
  }
  function boot(){
    el=document.createElement('div');
    el.style.cssText='position:fixed;top:10px;right:10px;z-index:2147483647;font:700 24px/1 monospace;color:#4f4;background:rgba(0,0,0,.85);padding:10px 14px;border:2px solid #666;border-radius:8px;pointer-events:none';
    document.body.appendChild(el);
    requestAnimationFrame(loop);
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
})();
</script>
</head><body>
<div class="note"><b>【猜想C+A·粒子canvas叠blend巨字（关键）】</b><br><b>关键组合页</b>：复刻首页真实层叠——底层每帧重绘的粒子 canvas + 上层 mix-blend-mode: exclusion 巨字。<br>在部分老内核上，canvas 每帧重绘会强制上层 blend 层整屏软件混合。<br>若「canvas 页不卡、blend 页不卡、本页卡」→ 凶手就是这个组合。<br><span style="color:#888">看右上角 FPS：≥50 绿=流畅；25-50 黄=偏卡；&lt;25 红=卡。</span></div>
<canvas id="c" style="position:fixed;inset:0;z-index:1"></canvas><div class="bg-text-container"><div class="giant-text kanji">魔女审判</div></div>
<script>
var canvas=document.getElementById('c');
var ctx=canvas.getContext('2d');
var W=0,H=0,dashes=[];
function resize(){W=canvas.width=innerWidth;H=canvas.height=innerHeight;seed();}
function seed(){
  dashes=[];
  var cell=38; // 与首页一致
  for(var j=-1;j<Math.ceil(H/cell)+2;j++)for(var i=-1;i<Math.ceil(W/cell)+2;i++){
    var x=(i+Math.random()*0.95+0.025)*cell,y=(j+Math.random()*0.95+0.025)*cell;
    dashes.push({x:x,y:y,n1a:x*0.0042+y*0.0033,n1b:y*0.0042-x*0.0028,
      baseR:0.6+Math.pow(Math.random(),1.8)*2.6,cOff:Math.random()*6.283,scale:0});
  }
  document.getElementById('cnt').textContent='粒子数: '+dashes.length;
}
function smooth(e0,e1,x){if(x<=e0)return 0;if(x>=e1)return 1;var t=(x-e0)/(e1-e0);return t*t*(3-2*t);}
function draw(t){
  ctx.clearRect(0,0,W,H);
  var tSlow=t*0.00045,tFast=t*0.0014,tColor=t*0.00035;
  var cx=W*0.5,cy=H*0.4,R=240;
  for(var k=0;k<dashes.length;k++){
    var d=dashes[k];
    var dx=d.x-cx,dy=d.y-cy,dist=Math.sqrt(dx*dx+dy*dy);
    var tBand=smooth(R-400,R,dist)-smooth(R,R+200,dist);
    var tt=tBand*tBand;
    if(tt<0.04&&d.scale<0.04)continue;
    d.scale+=(tt-d.scale)*0.18;
    if(d.scale<0.035)continue;
    var px=d.x+Math.sin(d.n1a+tSlow)*34+Math.sin(d.n1a*4+tFast)*6;
    var py=d.y+Math.cos(d.n1b+tSlow)*34+Math.cos(d.n1b*4+tFast)*6;
    var c=0.5+0.5*Math.sin(d.cOff+tColor);
    ctx.beginPath();
    ctx.fillStyle='rgba('+(126+c*110|0)+','+(156+c*60|0)+','+(200-c*80|0)+','+Math.min(d.scale*1.1,0.9)+')';
    ctx.arc(px,py,d.baseR*(0.55+d.scale*0.85),0,6.283);
    ctx.fill();
  }
  requestAnimationFrame(draw);
}
addEventListener('resize',resize);
resize();
requestAnimationFrame(draw);
// 额外：把巨字放到 canvas 上层（复刻首页的层叠结构）</script>
</body></html>
