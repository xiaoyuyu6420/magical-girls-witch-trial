<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>X5诊断 · UA检测·定假设1</title>
<style>*{box-sizing:border-box;margin:0;padding:0}
body{background:#030303;color:#EFEFEF;font-family:monospace}
.note{max-width:640px;margin:24px auto;padding:16px 20px;line-height:1.9;font-size:14px;background:rgba(0,0,0,.6);border:1px solid #444;border-radius:8px;position:relative;z-index:50}
.note b{color:#d4af37}

</style>

<script>
(function(){
  var frames=0,last=0,el=null;
  function loop(t){
    frames++;
    if(!last)last=t;
    if(t-last>=800){
      var fps=Math.round(frames*1000/(t-last));
      if(el){el.textContent=fps+' FPS';el.style.color=fps>=50?'#4f4':(fps>=25?'#fd4':'#f44');}
      frames=0;last=t;
    }
    requestAnimationFrame(loop);
  }
  function boot(){
    el=document.createElement('div');
    el.style.cssText='position:fixed;top:10px;right:10px;z-index:2147483647;font:700 24px/1 monospace;color:#4f4;background:rgba(0,0,0,.85);padding:10px 14px;border:2px solid #666;border-radius:8px;pointer-events:none';
    document.body.appendChild(el);
    requestAnimationFrame(loop);
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
})();
</script>
</head><body>
<div class="note"><b>【UA检测·定假设1】</b><br>显示你设备的 UserAgent 字符串，并测试是否命中我们降级用的正则（MQQBrowser/QQBrowser/MicroMessenger）。<br>若显示 ❌ 未命中 → 降级代码在你设备上从未生效，一切解释通。把 UA 全文截图给我。<br><span style="color:#888">右上角 FPS：绿≥50 / 黄25-50 / 红&lt;25。</span></div>
<div style="max-width:640px;margin:20px auto;padding:18px;line-height:2;border:1px solid #444;border-radius:8px;word-break:break-all;font-size:13px">
     <div style="color:#888">你的 UA：</div>
     <div id="ua" style="color:#d4af37;margin:8px 0"></div>
     <div id="verdict" style="font-size:15px;margin:12px 0"></div>
     <div id="cls" style="color:#888;font-size:12px;word-break:break-all"></div>
   </div>
<script>
var ua=navigator.userAgent;
var hit=/MQQBrowser|QQBrowser|MicroMessenger/i.test(ua);
document.getElementById('ua').textContent=ua;
document.getElementById('verdict').innerHTML=hit
 ?'<b style="color:#4f4">✅ 命中检测（html.x5 会加上，降级生效）</b>'
 :'<b style="color:#f44">❌ 未命中！（降级从未触发——这就是"没优化到"的原因）</b>';
document.getElementById('cls').textContent='当前 html class = "'+document.documentElement.className+'"（本页未做任何检测，仅 /test 和首页会加 x5）';</script>
</body></html>
