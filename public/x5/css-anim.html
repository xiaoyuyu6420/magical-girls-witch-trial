<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>X5诊断 · CSS动画·纯transform</title>
<style>*{box-sizing:border-box;margin:0;padding:0}
body{background:#030303;color:#EFEFEF;font-family:monospace}
.note{max-width:640px;margin:24px auto;padding:16px 20px;line-height:1.9;font-size:14px;background:rgba(0,0,0,.6);border:1px solid #444;border-radius:8px;position:relative;z-index:50}
.note b{color:#d4af37}
.track{height:300px;position:relative;background:#0a0a0a;border:1px solid #222;margin:10px 0}
   .box{position:absolute;top:120px;left:0;width:80px;height:80px;background:linear-gradient(135deg,#d4af37,#b80a1f);animation:slide 2.4s ease-in-out infinite alternate}
   .b2{top:40px;animation-duration:3.1s;opacity:.6}
   .b3{top:200px;animation-duration:1.8s;opacity:.4}
   @keyframes slide{from{transform:translateX(20px) scale(.8)}to{transform:translateX(calc(100vw - 140px)) scale(1.2)}}
</style>

<script>
(function(){
  var frames=0,last=0,el=null;
  function loop(t){
    frames++;
    if(!last)last=t;
    if(t-last>=800){
      var fps=Math.round(frames*1000/(t-last));
      if(el){el.textContent=fps+' FPS';el.style.color=fps>=50?'#4f4':(fps>=25?'#fd4':'#f44');}
      frames=0;last=t;
    }
    requestAnimationFrame(loop);
  }
  function boot(){
    el=document.createElement('div');
    el.style.cssText='position:fixed;top:10px;right:10px;z-index:2147483647;font:700 24px/1 monospace;color:#4f4;background:rgba(0,0,0,.85);padding:10px 14px;border:2px solid #666;border-radius:8px;pointer-events:none';
    document.body.appendChild(el);
    requestAnimationFrame(loop);
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
})();
</script>
</head><body>
<div class="note"><b>【CSS动画·纯transform】</b><br>一个色块循环做 transform 位移+缩放动画（GPU 最友好的属性，无 canvas/无滤镜/无 blend）。<br>静态观看 + 上下滚动页面。<br>这种动画都 &lt;30 FPS → WebView 合成器废了；静态流畅但滚动卡 → 还是软件渲染。<br><span style="color:#888">右上角 FPS：绿≥50 / 黄25-50 / 红&lt;25。</span></div>
<div class="track"><div class="box"></div><div class="box b2"></div><div class="box b3"></div></div>
   <p style="padding:14px 20px;color:#777">滚动行 1</p><p style="padding:14px 20px;color:#777">滚动行 2</p><p style="padding:14px 20px;color:#777">滚动行 3</p><p style="padding:14px 20px;color:#777">滚动行 4</p><p style="padding:14px 20px;color:#777">滚动行 5</p><p style="padding:14px 20px;color:#777">滚动行 6</p><p style="padding:14px 20px;color:#777">滚动行 7</p><p style="padding:14px 20px;color:#777">滚动行 8</p><p style="padding:14px 20px;color:#777">滚动行 9</p><p style="padding:14px 20px;color:#777">滚动行 10</p><p style="padding:14px 20px;color:#777">滚动行 11</p><p style="padding:14px 20px;color:#777">滚动行 12</p>
<script></script>
</body></html>
