<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>X5诊断 · 猜想E·Google Fonts 网络</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#030303;color:#EFEFEF;font-family:monospace;min-height:100vh;overflow-x:hidden}
.note{position:relative;z-index:50;max-width:640px;margin:24px auto;padding:16px 20px;line-height:1.9;font-size:14px;background:rgba(0,0,0,.6);border:1px solid #444;border-radius:8px}
.note b{color:#d4af37}

</style>

<script>
(function(){
  var frames=0,last=0,el=null;
  function loop(t){
    frames++;
    if(!last)last=t;
    if(t-last>=800){
      var fps=Math.round(frames*1000/(t-last));
      if(el){el.textContent=fps+' FPS';el.style.color=fps>=50?'#4f4':(fps>=25?'#fd4':'#f44');}
      frames=0;last=t;
    }
    requestAnimationFrame(loop);
  }
  function boot(){
    el=document.createElement('div');
    el.style.cssText='position:fixed;top:10px;right:10px;z-index:2147483647;font:700 24px/1 monospace;color:#4f4;background:rgba(0,0,0,.85);padding:10px 14px;border:2px solid #666;border-radius:8px;pointer-events:none';
    document.body.appendChild(el);
    requestAnimationFrame(loop);
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
})();
</script>
</head><body>
<div class="note"><b>【猜想E·Google Fonts 网络】</b><br>测试 fonts.googleapis.com 的可达性与耗时（首页 head 里是 render-blocking 的字体 CSS）。<br><b>判定：</b>CSS 耗时 &gt;3 秒 = 网络是首页慢的重要原因（白屏等待+字体回退重排），但注意这影响的是「等待感」，不是动画帧率。<br><span style="color:#888">看右上角 FPS：≥50 绿=流畅；25-50 黄=偏卡；&lt;25 红=卡。</span></div>
<div id="log" style="max-width:640px;margin:30px auto;padding:20px;line-height:2.2;font-size:14px;border:1px solid #444;border-radius:8px"></div><div style="display:none" class="f-test"><span style="font-family:Cinzel,serif">Cinzel Font Ready?</span> <span style="font-family:'Noto Serif SC',serif">思源宋体就绪？</span></div>
<script>
var log=document.getElementById('log');
function line(s){var p=document.createElement('div');p.textContent=s;log.appendChild(p);}
line('T+0ms 开始加载 Google Fonts CSS link…');
var t0=performance.now();
var link=document.createElement('link');
link.rel='stylesheet';
link.href='https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Noto+Serif+SC:wght@300;600;900&display=swap';
link.onload=function(){
  line('T+'+Math.round(performance.now()-t0)+'ms CSS 到达。开始计时字体就绪…');
  var t1=performance.now();
  document.fonts.ready.then(function(){
    line('T+'+Math.round(performance.now()-t1)+'ms fonts.ready 全部字体就绪。');
    line('若 CSS 耗时 >3000ms（红色），则你的网络访问 Google Fonts 很慢——这会让首页白屏久、字体反复切换重排。');
  });
};
link.onerror=function(){line('T+'+Math.round(performance.now()-t0)+'ms ❌ CSS 加载失败（网络被断/拦截）');};
document.head.appendChild(link);</script>
</body></html>
