<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>X5诊断 · 猜想C·巨字mix-blend-mode（静态）</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#030303;color:#EFEFEF;font-family:monospace;min-height:100vh;overflow-x:hidden}
.note{position:relative;z-index:50;max-width:640px;margin:24px auto;padding:16px 20px;line-height:1.9;font-size:14px;background:rgba(0,0,0,.6);border:1px solid #444;border-radius:8px}
.note b{color:#d4af37}
body{background:radial-gradient(circle at 50% 40%,#17121e 0%,#0a0709 55%,#030303 100%)}
   .bg-text-container{position:fixed;top:50%;left:5%;transform:translateY(-50%);z-index:3;pointer-events:none;mix-blend-mode:exclusion}
   .giant-text{font-size:clamp(6rem,10vw,12rem);font-weight:900;line-height:0.8;color:transparent;text-transform:uppercase;position:relative;-webkit-text-stroke:1px rgba(255,255,255,0.15)}
   .giant-text.kanji{-webkit-text-stroke:1px #d4af37;text-shadow:0 0 30px rgba(212,175,55,0.25);margin-left:20%;margin-top:-5%;opacity:0.85}
</style>

<script>
(function(){
  var frames=0,last=0,el=null;
  function loop(t){
    frames++;
    if(!last)last=t;
    if(t-last>=800){
      var fps=Math.round(frames*1000/(t-last));
      if(el){el.textContent=fps+' FPS';el.style.color=fps>=50?'#4f4':(fps>=25?'#fd4':'#f44');}
      frames=0;last=t;
    }
    requestAnimationFrame(loop);
  }
  function boot(){
    el=document.createElement('div');
    el.style.cssText='position:fixed;top:10px;right:10px;z-index:2147483647;font:700 24px/1 monospace;color:#4f4;background:rgba(0,0,0,.85);padding:10px 14px;border:2px solid #666;border-radius:8px;pointer-events:none';
    document.body.appendChild(el);
    requestAnimationFrame(loop);
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
})();
</script>
</head><body>
<div class="note"><b>【猜想C·巨字mix-blend-mode（静态）】</b><br>复刻首页的「魔女审判」背景巨字：mix-blend-mode: exclusion + text-stroke + text-shadow，<b>底层是静态渐变（无 canvas 动画）</b>。<br>验证：单纯 blend 层是否卡。若这页不卡、下一页（canvas+blend）卡 → 凶手是「动态canvas叠blend巨字」的强制软件合成。<br><span style="color:#888">看右上角 FPS：≥50 绿=流畅；25-50 黄=偏卡；&lt;25 红=卡。</span></div>
<div class="bg-text-container"><div class="giant-text kanji">魔女审判</div></div><div style="height:100vh"></div>
<script></script>
</body></html>
