characters:
  - _code: 🔒 "EMMA"
    _name: 🔒 "樱羽艾玛"
    _group: 🔒 "B"
    _vector: "🔒 LHH-LLM-HHH-LLL"
    _source: "witch-trial"
    slogan: "「因为，我不想被讨厌。仅仅是这么简单的理由。」"
    desc: "你把笑容当成铠甲，因为心底那句“不想被讨厌”，是你一切讨好与笨拙的总根源——宁可故意搞砸，也不敢承认自己做得很好。真正压在心口的，是曾眼看着重要的人慢慢沉下去，而那句“住手”始终没能说出口。可正是这份没能出声的悔，证明你的心从未冷掉。你和樱羽艾玛相似的地方，是背着沉默的亏欠，仍在练习下一次为谁挺身而出。"
    keywords: "怕被讨厌,旁观之悔,笨拙的勇敢"
  - _code: 🔒 "SHERRY"
    _name: 🔒 "橘雪莉"
    _group: 🔒 "B"
    _vector: "🔒 MHM-LMH-HHH-LHH"
    _source: "witch-trial"
    slogan: "「选边就要选有趣的一边，这就是我的信条！」"
    desc: "你的感情构造和常人不太一样：别人惊慌的场面，你先注意到的是有趣的细节；别人害怕的真相，你非要看个水落石出。这不是冷血，只是在你世界里，“想弄明白”永远排在“该害怕”前面。正因为不为情绪所动，风暴里你反而是唯一清醒的人，朋友把最重的托付交给你时，你稳稳接住了它。你和橘雪莉相似的地方，是心不受常理摆布，认定的事就贯彻到底。"
    keywords: "有趣至上,不为所动,贯彻到底"
  - _code: 🔒 "MIRIA"
    _name: 🔒 "佐伯米莉亚"
    _group: 🔒 "B"
    _vector: "🔒 LMH-LLM-HMH-MML"
    _source: "witch-trial"
    slogan: "「大叔我……只是个随处可见的普通学生而已啊……！？」"
    desc: "你把外表经营得光鲜，内里却安静得像一部老电影：话不多，心事交给旧片子消化。你总说自己“只是个随处可见的普通学生”，觉得拿不出手，于是习惯迎合、追随，把存在感放得很低。可你的温柔没有结痂——真正要紧时，你比谁都敢站出来，用一个沉默的谎言替重要的人挡下一切。你和佐伯米莉亚相似的地方，是被辜负过，仍把最后的温柔留给别人。"
    keywords: "外潮内静,老电影魂,护人到底"
  - _code: 🔒 "HIRO"
    _name: 🔒 "二阶堂希罗"
    _group: 🔒 "F"
    _vector: "🔒 HLL-HMH-LHH-HHM"
    _source: "witch-trial"
    slogan: "「就让我来消灭这个世界的邪恶。」"
    desc: "你对“正确”近乎信仰：条理、规矩、应然之事，绝不容许被搅浑，“消灭这个世界的邪恶”仿佛生来就刻在骨子里。这份端正让你永远站在最前面，也让你在标准崩塌那天伤得最重——原来自己的手，也会做出不正确的事。可你连悔恨都不逃避：错了，就从清晨重来一遍，纠正为止。你和二阶堂希罗相似的地方，是把正义扛在肩上，连自己的错误也一并审判。"
    keywords: "对错分明,知悔敢当,从头再来"
  - _code: 🔒 "NANOKA"
    _name: 🔒 "黑部奈叶香"
    _group: 🔒 "F"
    _vector: "🔒 HHL-HMH-LLL-LLH"
    _source: "witch-trial"
    slogan: "「未知是恐惧之源。只要去了解对方，就不会再感到恐惧。」"
    desc: "你习惯独自行动，话不多，语气常比本意更冷——那不是天性，是提前穿好的军装。你相信“未知是恐惧之源”，只要去了解对方，恐惧就会退散，所以你执拗地查到底，哪怕要搭上这条命。你能从一件旧物里看见它经过的时光，也因此确信：所有黑幕都有名字，所有真相都有来处。你和黑部奈叶香相似的地方，是把生死看得轻，把要查清的事看得比命重。"
    keywords: "独行冷冽,洞悉过往,真相至上"
  - _code: 🔒 "HANNA"
    _name: 🔒 "远野汉娜"
    _group: 🔒 "S"
    _vector: "🔒 MHH-LMM-MHM-HML"
    _source: "witch-trial"
    slogan: "「本小姐最讨厌那种一副大人物的样子指指点点的人了。」"
    desc: "你举手投足自带千金派头，把体面撑得滴水不漏——尽管那份高贵，是你一针一线亲手缝出来的。你坚信自己是故事里的女主角，苦练着并不擅长的魔法，只为成为能救下谁的人；可等你回头，想救的人已经来不及了。所以哪怕被命运逼到墙角，你也只想守住“自己”这最后的东西。你和远野汉娜相似的地方，是用华丽的幻想，接住那颗没能原谅自己的心。"
    keywords: "千金做派,女主幻想,手巧心软"
  - _code: 🔒 "MERURU"
    _name: 🔒 "冰上梅露露"
    _group: 🔒 "S"
    _vector: "🔒 HMH-LLH-HLH-HHL"
    _source: "witch-trial"
    slogan: "「您永远……都是我重要的家人！」"
    desc: "你总是先道歉的那一个：声音小小的，眼泪却来得真，连道谢都比人多一分小心。你能修补好伤口、复原坏掉的东西，可自己的心事，你宁愿咽下去也不麻烦人。你习惯把希望寄托在重要的人身上，安静地在旁支援，因为在你心里，“家人”二字比命运更重，哪怕被亏待也舍不得放手。你和冰上梅露露相似的地方，是胆怯了一路，最要紧的事上却从未退缩。"
    keywords: "爱哭道歉,治愈之手,为家人勇敢"
  - _code: 🔒 "COCO"
    _name: 🔒 "泽渡可可"
    _group: 🔒 "S"
    _vector: "🔒 HML-LMM-LHL-MMM"
    _source: "witch-trial"
    slogan: "「推活正是我的人生！」"
    desc: "你的毒舌出了名：看谁都不顺眼，懒得对不值得的世界表演热情——推活才是你的人生，除了心里那束光，其余都不值得看。可那份厌世有来处：你曾被迫睁着眼睛，看完了最不忍看的画面，从此明白“看见”有多残忍，也多珍贵。所以你把温柔收得极紧，只肯给屏幕对面那个发光的名字。你和泽渡可可相似的地方，是对世界冷眼旁观，却为仅剩的光毫不设防。"
    keywords: "毒舌厌世,推活至上,唯一软肋"
  - _code: 🔒 "NOAH"
    _name: 🔒 "城崎诺亚"
    _group: 🔒 "S"
    _vector: "🔒 LHH-LLL-HLM-LLH"
    _source: "witch-trial"
    slogan: "「因为诺亚不画画就活不下去啊。」"
    desc: "你像一阵路过人间的风，来去自由，因为“不画画就活不下去”不是任性，而是呼吸本身。世界在你眼中是一张可以重来的画布——颜色不对了，就亲手再改；连最沉重的血，你也想画成翩翩的蝴蝶，让恐惧变轻。你的善意近乎无垢，只是不愿被任何框子收编。你和城崎诺亚相似的地方，是把人生当成未完成的作品，谁也别想在颜料干透前替你定稿。"
    keywords: "自由即我,画布人生,拒绝定稿"
  - _code: 🔒 "MARGO"
    _name: 🔒 "宝生玛格"
    _group: 🔒 "W"
    _vector: "🔒 MLM-LLM-LLM-MHL"
    _source: "witch-trial"
    slogan: "「我这辈子……几乎没有相信过任何人。」"
    desc: "你看人极准，三句话称出对方的分量，连声音都能学得以假乱真——这门手艺，是没人可爱时你给自己造的铠甲。你这辈子几乎没有相信过任何人：不信好意，也不指望被爱，因为不抱期待，就永远不会失望。可命运偏爱玩笑，嘴上最不信爱的你，恰恰在最后关头为在乎的人挡下所有。你和宝生玛格相似的地方，是把心锁得滴水不漏，却会在紧要处把爱交出去。"
    keywords: "不相信不指望,千面之声,为爱挡刀"
  - _code: 🔒 "ANAN"
    _name: 🔒 "夏目安安"
    _group: 🔒 "W"
    _vector: "🔒 MHL-LMH-LHL-MHH"
    _source: "witch-trial"
    slogan: "「吾辈是夏目安安。今后，请各位不要找吾辈说话。」"
    desc: "你在自己的房间筑起一座城堡，门外的世界太吵，文字才是你派出去的使者——开口总要换上“吾辈”的郑重腔调，好把胆怯藏进文体里。你比谁都清楚语言的力量：一句话能让人点头，也能改写整个气氛，所以你从不轻易交出真心。可越是抗拒被看弱，你心里越盼着有人把吾辈当作朋友。你和夏目安安相似的地方，是躲在安静的门后，握着一支最会说话的笔。"
    keywords: "安居一隅,文豪口癖,渴望友情"
  - _code: 🔒 "ALISA"
    _name: 🔒 "紫藤亚里沙"
    _group: 🔒 "mix"
    _vector: "🔒 HLM-LLM-MMH-HLM"
    _source: "witch-trial"
    slogan: "「我很害怕自己。我无法原谅自己。我啊，最讨厌自己了。」"
    desc: "你浑身是刺，火气上来谁的面子也不给——可你心里最恨的，其实是自己。从小到大，责骂都是稀缺品：没有人骂你，就像没有人爱你，于是你一次次把自己推到火边，只想换来一句“你错了”。可笑的是，你坦荡得近乎固执：绝不说谎，也绝不做真正越界的事。你和紫藤亚里沙相似的地方，是嘴上讨骂，心里盼的不过是被认真地在乎。"
    keywords: "自罚成瘾,绝不说谎,渴望在乎"
  - _code: 🔒 "LEIA"
    _name: 🔒 "莲见蕾雅"
    _group: 🔒 "mix"
    _vector: "🔒 MHM-LMH-MHM-LMH"
    _source: "witch-trial"
    slogan: "「因为这样大家不是都看不见我吗！！」"
    desc: "你天生属于舞台中央：姿态漂亮，台词漂亮，连疲惫都收拾得一丝不苟。可只有你知道，“被看见”对你有多重——曾经最该看你的人从不愿为你抬头，于是你学会把全场目光都召到自己身上，仿佛被注视，才能证明自己存在。你把孤独演成了优雅，渴望藏进漂亮的台词。你和莲见蕾雅相似的地方，是拼命想让全世界看见你，最想要的却只是一个人的注视。"
    keywords: "渴求视线,舞台中心,优雅的孤独"
  - _code: 🔒 "UNSET"
    _name: 🔒 "未定之魂"
    _group: 🔒 "fallback"
    _vector: "🔒 MMM-MMM-MMM-MMM"
    _source: "witch-trial"
    slogan: "「审判尚未落锤，灵魂仍在途中。」"
    desc: "你的答案彼此拉扯，没有哪一种声音稳稳压过其余。这不是没有答案，而是灵魂尚未定型——牢笼的名单上还留着你的空位，审判尚未落锤，你仍握着成为任何一种自己的可能。"
    keywords: "悬而未决,流动,一切皆可能"
  - _code: 🔒 "YUKI"
    _name: 🔒 "月代雪"
    _subtitle: 🔒 "大魔女"
    _group: 🔒 "special"
    _vector: "🔒 HHH-LLL-LLL-LLL"
    _source: "witch-trial"
    slogan: "「我的复仇之心……已经锈蚀了。」"
    desc: "你安静得像一句判词，因为在漫长岁月里，恨早已沉淀成底色：同族尽逝于人类之手，活下来的你，把复仇化作了无声的诅咒，散播进人间。可看得越久，你越看见了另一件事——人类会学习、会成长，比停在原地的你们更有未来。于是最后一刻，你亲手收回了布下的黑暗，把明天还给世界。你和月代雪相似的地方，是恨得足够深，也终于有力气亲手放下。"
    keywords: "千年之恨,见证成长,亲手放下"
  - _code: 🔒 "MADOKA"
    _name: 🔒 "鹿目圆"
    _subtitle: 🔒 "终将成为神"
    _group: 🔒 "B"
    _vector: "🔒 LLH-LLH-HLH-LLH"
    _source: "madoka"
    slogan: "「我不想让任何人再哭泣，哪怕要我变成不再存在的存在」"
    desc: "你是天生的信仰者——温柔到近乎天真的善良，让你在看到任何人的痛苦时都无法转身离开。你信任陌生人，宽恕伤害过你的人，甘愿为素不相识的人承担命运。这份善意不是软弱，是你明知世界残酷后依然选择伸出手。当所有人都绝望时，你是那个还会说'一定有办法'的人——哪怕代价是抹消自己存在的痕迹。"
    keywords: "不灭的善意、为众生成神、天真的信仰"
  - _code: 🔒 "HOMURA"
    _name: 🔒 "晓美焰"
    _subtitle: 🔒 "时间掠夺者"
    _group: 🔒 "F"
    _vector: "🔒 HHL-HLH-LHH-HHH"
    _source: "madoka"
    slogan: "「哪怕要重启世界一千次，我也要守住她一个人的笑容」"
    desc: "你是冰与执念的矛盾体——外表冷酷到不近人情，内心却燃烧着比任何人都炽烈的执着。你记着每一个轮回，每一次失败，每一个没能救下她的瞬间。你不信任旁人，因为旁人从未陪你走过那些被重置的时间；你宽恕不了命运，因为命运从未对你手软。你的温柔只对一个人开放，而对那一个人的爱，足够让你与整个世界为敌。"
    keywords: "轮回千次、冷焰执念、为一人敌世界"
  - _code: 🔒 "SAYAKA"
    _name: 🔒 "美树沙耶香"
    _subtitle: 🔒 "正义的末路"
    _group: 🔒 "mix"
    _vector: "🔒 HML-MHH-HHH-LHH"
    _source: "madoka"
    slogan: "「我明明是想做一个正确的人，为什么最后变成了怪物」"
    desc: "你是被自己的正义感烧成灰烬的人——你眼里容不下一点不公，你为受伤的人出头，你许愿治愈心上人却不敢让他知道。可这个世界不奖励纯粹的好人：你信任的人背叛了你的秘密，你救的人忘了你的存在，你信奉的正义在残酷的现实前一寸寸碎裂。你的崩溃不是软弱，是太用力地善良之后被反噬的伤口。魔女化不是堕落，是你的正义找不到出口的悲鸣。"
    keywords: "正义的崩塌、爱而不得、魔女化悲鸣"
  - _code: 🔒 "KYOKO"
    _name: 🔒 "佐仓杏子"
    _subtitle: 🔒 "末路求生者"
    _group: 🔒 "mix"
    _vector: "🔒 MHL-MMH-LMH-MMH"
    _source: "madoka"
    slogan: "「别傻了。在这个世界里，只为别人许愿的人活不长」"
    desc: "你是被现实磨硬了壳的实用主义者——曾经的你也相信为他人牺牲是神圣的，直到那个许愿毁了你的全家。从那以后你学会了先顾自己，学会了冷眼旁观别人的悲剧，学会了用'这不关我事'挡住所有想靠近的人。可你骗不了自己：当真正在乎的人陷入绝境，你还是会冲上去。你的硬是装出来的，你的软才是底色——只是你不敢再轻易把它交出来。"
    keywords: "实用主义盔甲、家庭创伤、关键时刻的真心"
  - _code: 🔒 "MAMI"
    _name: 🔒 "巴麻美"
    _subtitle: 🔒 "孤独的前辈"
    _group: 🔒 "B"
    _vector: "🔒 HMM-LHM-HHL-HHL"
    _source: "madoka"
    slogan: "「当魔法少女这么久，我其实……一直都好害怕」"
    desc: "你是优雅的盔甲下藏着深渊的人——你永远是后辈面前从容不迫的前辈，泡着红茶、系着缎带、用最漂亮的姿态消灭魔女。可没有人知道你独自战斗了多少年，没有人知道你每个夜晚都在害怕下一次会不会就回不来了。你渴望同伴，渴望被需要，渴望有人能让你卸下'可靠前辈'的伪装。当有人终于愿意走近你，你会紧紧抓住——因为你太孤独了，孤独到宁可把脆弱藏在优雅里，也不愿被人看见。"
    keywords: "优雅的盔甲、深层孤独、渴望被需要"
  - _code: 🔒 "homura_devil"
    _name: 🔒 "晓美焰 · 执念的黑化魔女"
    _group: 🔒 "special"
    _vector: "🔒 HHL-HHH-LHH-HHH"
    _source: "madoka"
    slogan: "重要的人一旦认定，你就很难退开。"
    desc: "你不是拒绝亲近，只是靠近之前会观察很久。一旦认定一个人重要，你会把对方的事当成自己的事；局面失控时，又会先收紧边界，尽量自己处理。你和焰相似的地方不是什么黑化，而是这份很难收回的认真。"
    keywords: "谨慎,边界感,行动先于表达"
    prosecution: "你不是拒绝亲近，只是靠近之前会观察很久。一旦认定一个人重要，你会把对方的事当成自己的事；局面失控时，又会先收紧边界，尽量自己处理。"
    softlanding: "在意一个人，不等于要替所有变数负责。把担心提前说出来，对方才有机会和你一起处理。"
    tags: "谨慎,边界感,行动先于表达"
  - _code: 🔒 "madoka_god"
    _name: 🔒 "鹿目圆 · 终极救赎的圆环之理"
    _group: 🔒 "special"
    _vector: "🔒 LLH-LLL-HHH-LLL"
    _source: "madoka"
    slogan: "你常常先注意到别人的需要。"
    desc: "气氛一不对，你通常会先看谁在难受，然后想自己能做什么。照顾人时你很有行动力，问题是自己的需要常常被排到后面。你和圆相似的地方，是温柔不只是态度，也会真的动手去做。"
    keywords: "敏感,照顾,行动力"
    prosecution: "气氛一不对，你通常会先看谁在难受，然后想自己能做什么。照顾人时你很有行动力，问题是自己的需要常常被排到后面。"
    softlanding: "答应照顾别人之前，先确认自己还有余裕。长期硬撑出来的体贴，最后容易变成委屈。"
    tags: "敏感,照顾,行动力"
  - _code: 🔒 "sayaka_siren"
    _name: 🔒 "美树沙耶香 · 理想主义破灭的痛楚"
    _group: 🔒 "special"
    _vector: "🔒 HML-MHH-HHH-LHH"
    _source: "madoka"
    slogan: "你对公平和承诺很敏感。"
    desc: "答应过的事，你会当真；看到敷衍和偏袒，也比一般人更难受。事情没做好时，你容易先检讨自己，再把失望压成愤怒。你和沙耶香相似的地方，是不愿意用“随便啦”处理重要关系。"
    keywords: "原则感,认真,自我要求"
    prosecution: "答应过的事，你会当真；看到敷衍和偏袒，也比一般人更难受。事情没做好时，你容易先检讨自己，再把失望压成愤怒。"
    softlanding: "失望时先分清：哪部分是自己的责任，哪部分是别人的选择。不是每件事都要先归因给自己。"
    tags: "原则感,认真,自我要求"
  - _code: 🔒 "kyoko_pragmatist"
    _name: 🔒 "佐仓杏子 · 利己外衣下的真心"
    _group: 🔒 "special"
    _vector: "🔒 MHL-MMH-LMH-MMH"
    _source: "madoka"
    slogan: "你的关心，常常包在现实判断里。"
    desc: "你习惯先算可行性，再决定要不要投入，不喜欢把气氛说得很满。但真正认定一个人后，你会用具体行动帮忙，只是不一定会承认自己在意。你和杏子相似的地方，是嘴上留余地，事上不轻易退。"
    keywords: "务实,有底线,嘴硬心软"
    prosecution: "你习惯先算可行性，再决定要不要投入，不喜欢把气氛说得很满。但真正认定一个人后，你会用具体行动帮忙，只是不一定会承认自己在意。"
    softlanding: "把在意说得更直接一点，关系会少一些猜测；帮忙前讲清界限，也更容易长期相处。"
    tags: "务实,有底线,嘴硬心软"
