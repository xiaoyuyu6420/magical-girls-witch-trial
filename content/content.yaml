    questions: |-
      { meta: "Q1 · 晨光中的虛妄", text: "清晨，微塵在陽光裡起舞。這看似平凡卻令人深感疲憊的一天又開始了。那一刻，您心底浮現的聲音是——", options: ["「今天，也許會有好事發生吧。」（這年頭還願意相信這種話，該說您是天真，還是堅強呢。）", "「不出大亂子，平平安安混過去就好。」（求個安穩而已。只是，您不覺得這樣的人生有些無趣嗎？）", "「把『我很好』焊在臉上吧。」（畢竟沒有人想看您的爛攤子。您很懂規矩呢。）"] },
      { meta: "Q2 · 塑膠的溫熱", text: "熱鬧的教室裡，有人拉著您的手笑說：「來吧，這件事少了你可不行」。面對這種廉價的社交辭令，您——", options: ["心裡一陣回暖。用力點頭。（「被需要」這三個字，還真是能輕易拿捏您呢。）", "笑著答應，心底卻發虛。（是在害怕哪天沒了利用價值，這熱鬧就與您無關了吧？）", "禮貌附和，冷眼旁觀。（十分清醒。可惜這種塑膠感情，風一吹就散了。）"] },
      { meta: "Q3 · 施捨的傘簷", text: "雨夜，您看到一個孤僻的同學被困在屋簷下，而您手裡恰好有傘。您會做些什麼？——", options: ["毫不猶豫地遞過傘。（幫個小忙，順便體會一把道德優越感，感覺不錯吧？）", "猶豫了一下，還是把傘遞了過去。（害怕麻煩又硬要當好人，您不覺得累嗎？）", "遞過傘，並把這筆人情記在心裡。（很現實的考量。您的傘，可從來不是白給的。）"] },
      { meta: "Q4 · 沉重的皇冠", text: "長輩當眾把重任壓在您肩上，嘴上說著給您戴高帽：「交給您最放心。」那一刻，您的真實想法是——", options: ["挺直背脊，暗暗較勁。（寧可自己熬到禿也絕不搞砸，真是一個聽話的優等生呢。）", "肩膀像灌了鉛，笑著應下。（明明被那句「放心」壓得喘不過氣，卻連個「不」字都不敢說。）", "客氣應承，心裡冷笑。（您早就看透了吧，這堆冠冕堂皇的藉口下，全是要您收拾的爛攤子。）"] },
      { meta: "Q5 · 無聲的妥協", text: "朋友們一致嚷嚷著要去一家您厭惡至極的餐廳。當有人順嘴問起您的意見時，您——", options: ["立刻附和：「那家我也超想去！」（為了不掃興，把自己塞回委屈的套子裡，您早就習慣了吧。）", "「我都可以啊。」（那句「我不想去」還是嚥回去了。隨大流，永遠是最安全的。）", "聳聳肩說「隨便吧」。（心裡在冷笑吧？他們就是裝模作樣問問，根本沒人在意您的死活。）"] },
      { meta: "Q6 · 鏡中的妄想", text: "深夜看著鏡子裡疲憊又平凡的自己，如果真能獲得某種不講道理的魔法，您渴望的是——", options: ["治癒一切，讓身邊的人都不再流淚。（連自己的破洞都沒補上，您還妄想著拯救世界嗎？）", "變得絕對完美。（是想把那些讓您抬不起頭的自卑，通通抹掉吧。）", "「透明化」。（累了就原地消失。逃避雖然可恥，但對您來說，真的是個好用的藉口。）"] },
      { meta: "Q7 · 聚光燈外的陰溝", text: "看著舞台中央那個光彩照人、奪走所有視線的朋友，站在陰暗角落裡默默鼓掌的您，其實在想——", options: ["手掌拍得發紅，真心為她自豪。（甘心當一輩子的綠葉，您可真是大度得讓人意外。）", "用力鼓掌，掌心發涼。（是不是在想……為什麼站在光裡的，永遠不能是您？）", "冷冷地看著。（風光都是別人的。站得越高摔得越響，您其實是這麼期盼著的吧？）"] },
      { meta: "Q8 · 守護與自我", text: "天平兩端：一端是「嚥下委屈，換取虛偽的體面」，另一端是「死守底線，哪怕讓所有人下不來台」。您要把籌碼推向哪邊？", options: ["委屈自己，換取短暫的和平與溫暖。【純潔犧牲傾向】", "死守底線，哪怕被所有人孤立和冷眼。【極黑獨占】"] },
      { meta: "Q9 · 破碎時的搖尾", text: "極度委屈、情緒徹底崩潰的時候，蜷縮在角落裡的您，腦子裡冒出的念頭是——", options: ["好想被人抱一下。聽一句「沒事的」。（您還在等誰來救場呢？現實已經證明過很多次了吧，您的痛苦對別人來說，只是一件麻煩事而已。）", "趕緊把眼淚擦乾。（把傷口藏起來，它就不會流血了嗎？您只是在用這種懂事，換取別人不去踩踏您的仁慈。）", "指望誰呢？別傻了。（在別人拋棄您之前，先一步推開所有人。這就是您用來保證自己絕對安全的方法嗎？）"] },
      { meta: "Q10 · 提線木偶的順從", text: "面對長輩或上位者不容置疑的命令和安排，明明心裡有一百個不願意，可您的最終反應是——", options: ["強迫自己相信「他們是為我好」，全盤接受。（只要放棄思考，把人生的方向盤交出去，就永遠不需要為失敗承擔責任了。真是輕鬆的生存之道呢。）", "表面乖順，內心卻築起一道高牆誰也不讓進。（您以為在心裡保留抗拒就是一種反叛？可他們根本不在乎您的靈魂，只要您的行為服從就夠了。）", "在心裡掀了一萬次桌子，第二天還是原樣照做了。（明明有一百個不願意，最後卻連一個「不」字都沒說出口。您的反抗，永遠只敢發生在沒人看見的腦子裡呢。）"] },
      { meta: "Q11 · 完美無瑕的謊言", text: "當別人貌似關心地問起「您最近過得好嗎」時，您脫口而出的是——", options: ["掛上標準微笑：「挺好的呀！」（堪稱完美的反射神經。您已經極其熟練地，把自己的求救訊號掐滅在喉嚨裡了呢。）", "用極其誇張和自嘲的語氣，把自己的倒楣事當笑話講出來。（只要您先把自己當成小丑，別人就無法真正可憐您。這是您用來推開別人的絕佳盾牌。）", "歎口氣，欲言又止地說一句「勉強活著吧」。（把傷口撕開一條縫，祈求著對方能追問下去，卻又害怕對方真的走進來。您不覺得這種試探很可憐嗎？）"] },
      { meta: "Q12 · 偶像的崩塌", text: "發現您一直極度敬佩的人，私下裡竟然也會撒謊、算計、露出極其醜陋的一面。那一刻——", options: ["腦子發懵，拼命在心裡替他找藉口。（您其實並不是在保護他。您只是害怕一旦承認現實，您自己那點可憐的信仰就會隨之崩塌罷了。）", "像被潑了一盆冷水。（您總是喜歡把凡人推上神壇，然後等他們跌落時，再名正言順地品嚐這份額外的失望。）", "心裡發出一聲冷笑。（如果認定所有人從根子上就是爛的，您就不需要再承擔「去信任誰」的風險了，對吧？）"] },
      { meta: "Q13 · 廉價的通宵", text: "熬了好幾個通宵的心血，被別人輕飄飄地一筆帶過，甚至功勞都被搶走。面對這種屈辱，您——", options: ["強行自我開解：反正事情辦成了，學到經驗就好。（只要把自己降格成一個沒有感情的工具，就不會感到痛了。真是高效的自我麻痺呢。）", "表面笑說沒事，回過頭在心裡把對方千刀萬剮。（所有的憤怒都只敢在安全的陰暗處發洩。因為您比誰都清楚，掀翻桌子的代價您根本付不起。）", "微笑著把成果全部交接，從此收起所有真心。（「真心不值錢」——這個道理，您用幾個通宵就學會了。往後您交出去的，不過是沒有溫度的等價交換罷了。）"] },
      { meta: "Q14 · 崩塌時刻的籌碼", text: "委屈像土石流一樣壓下來，理智快要斷線。把手裡僅剩的 3 點籌碼，全部分到下面這幾種發洩方式上吧：", options: ["weight::2|1|0", "weight::2|0|1", "weight::1|2|0", "weight::0|2|1", "weight::1|0|2", "weight::0|1|2", "weight::1|1|1"] },
      { meta: "Q15 · 談資與笑料", text: "偶然間，您看到最親近的朋友正在另一個群裡，把您掏心掏肺傾訴的傷痛當成笑料講給眾人聽。那一刻——", options: ["拼命催眠自己：她大概就是為了迎合氣氛，嘴快無心。（在對方把刀插進您胸口的時候，您還要體貼地替她找藉口。您的自我欺騙，真是可悲到讓人歎息。）", "血液抽乾。一聲不吭地退出她的世界，單方面切斷聯繫。（連發火和對質的勇氣都沒有。您只能用這種近乎「假死」的沉默，來維持最後一點可憐的體面。）", "把截圖直接甩進群裡，當眾撕破臉，然後封鎖。（「既然我的真心被當成了垃圾，那大家就一起下地獄吧。」——您根本不在乎濺自己一身血，只要能看到對方驚慌失措的臉就夠了。）"] },
      { meta: "Q16 · 共犯的沉默", text: "那個全班避之唯恐不及的同學默不作聲地坐在您身旁。朋友嫌惡地拉了拉您的衣角：「走遠點，別挨著她，沾上晦氣。」您——", options: ["配合地露出嫌惡的表情，跟著朋友一起坐到遠處。（透過踩低一個更弱小的人，來確認自己還留在安全的「圈子」裡。您對這套骯髒的生存法則適應得很好。）", "僵在座位上假裝沒聽見，手心冒汗，什麼也不敢做。（既不敢反抗朋友，也不想傷害那個同學。您這種兩邊都想討好的軟弱，最後只會把您自己逼瘋。）", "甩開朋友的手：「嫌晦氣你自己滾。」然後繼續坐在原地。（為了那點毫無用處的正義感，把自己也變成被孤立的靶子。您這種自我毀滅式的英雄主義，真是蠢得無藥可救。）"] },
      { meta: "Q17 · 虛榮的倒影", text: "拿著糟糕的成績單，聽著父母長長地歎氣：「我們這輩子真是白白辛苦了，你對得起我們嗎？」您——", options: ["罪惡感瞬間淹沒自己，趕忙道歉。（您對這種債務關係已經形成了條件反射。只要不斷地透支自己去償還，就能換來一點點被愛的錯覺。）", "像木樁一樣低頭挨罵，心底一片冰涼。（您早就看穿了這副名為「愛」的枷鎖下，那赤裸裸的虛榮。所以您選擇了凍結自己的心。）", "心裡湧起一種報復的痛快。（如果無論如何都無法滿足他們的期待，那乾脆就用毀滅來作為對這索取無度的反擊吧。）"] },
      { meta: "Q20 · 陰溝裡的自卑", text: "獨自走在大街上，總覺得路人的目光有意無意地掃過自己。那種「大家都在看我笑話」的局促感，讓您很難熬吧？面對這種無處遁形的錯覺，您的第一反應是——", options: ["立刻把背挺直，假裝在看手機，走得飛快。（明明慌得要命，還要裝出大人的游刃有餘。別擔心，您藏得很好——好到連您自己都快信了呢。）", "低下頭，恨不得把臉埋進衣服裡。（「我好奇怪、我穿得好土」——這種羞恥得想當場消失的念頭，您到底還要在心裡反芻多少次呢？）", "在心裡瘋狂挑路人的刺，覺得他們才是一群蠢貨。（靠著在心裡貶低別人，來維持自己搖搖欲墜的自尊。您這種帶毒的防衛機制，真是可悲得可愛。）"] },
      { meta: "Q21 · 窒息的鎖鏈", text: "一個非常親近的人，總是喜歡以「我這都是為了你好」為藉口，強行插手、干預您的決定。面對這種令人窒息的控制欲，您——", options: ["感到挫敗，但還是順從地改掉了自己的習慣。（連呼吸的空間都被奪走了，卻還是捨不得丟掉這份變態的「在乎」。您對被愛的渴望，真是飢不擇食呢。）", "忍到極點，冷冷地甩開對方的手：「我的事不用你管。」（既然察覺到了這是毒藥，就毫不猶豫地打碎。哪怕代價是失去這段關係，您也絕不回頭。）", "陰陽怪氣地刺回去，找出對方的痛點瘋狂攻擊。（想單方面控制您？那就互相傷害吧。您似乎並不抗拒和他們一起在泥潭裡撕咬呢。）"] },
      { meta: "Q22 · 終極的審判", text: "陷入毫無退路的絕境時，您只能選一個：是「委屈自己，換取您在乎的人全身而退」，還是「就算毀掉一切，也絕不放開手裡的東西」？", options: ["把矛頭對準自己。（「只要他能好好的，我怎麼樣都無所謂。」……多麼純粹又令人顫慄的覺悟啊。）【純潔殉道】", "死死抱住執念。（「哪怕大家一起完蛋，我也要拿到我想要的。」……就是這個，這才是能孕育出巨大魔力的貪婪。）【極黑獨占】"] },
      { meta: "Q23 · 隱秘的毒汁", text: "聽說那個處處壓您一頭、完美無瑕的人，突然遭遇大挫一蹶不振。那一瞬間，從您心底湧出的，是怎樣甜美的毒汁？——", options: ["趕緊發去得體的安慰，掩蓋自己的幸災樂禍。（到了這個時候還在克制嗎？其實，您完全可以更坦誠地享受這份額外的獎賞呢。）", "暗爽了一秒，緊接著被罪惡感淹沒。（在黑暗的快感和道德的審判之間痛苦掙扎。這份矛盾的撕扯，正是靈魂最美味的部分。）", "爽，連呼吸都順暢了。（「憑什麼好運都是別人的？」……沒錯，把這種嫉妒和惡意釋放出來吧，這並沒有什麼可恥的。）"] },
      { meta: "Q24 · 被拋棄的抹布", text: "曾經熱愛的圈子，在發現您失去利用價值後，迅速將您當成了空氣。面對這種如同被當成抹布丟棄的落差，您——", options: ["硬著頭皮繼續打雜。（明明已經被拋棄了，卻還在搖尾乞憐。如果您願意和我結契，您就再也不用看這些人的臉色了哦。）", "一聲不吭地收拾東西離開。（把這種被背叛的刺痛深深埋進心裡。等它潰爛、發酵，最後會孵化出什麼樣的怪物呢？）", "臉上笑嘻嘻，心裡判死刑。（微笑著給所有人刻下墓誌銘。您這副隨時準備將他們拉下水的眼神，真是棒極了。）"] },
      { meta: "Q25 · 懸崖邊的安魂曲", text: "如果這輩子注定要在孤獨與泥濘中跋涉。看著那個已經傷痕累累的自己，在這場審判的最後，您想留下的遺言是——", options: ["「再咬牙撐一下吧，說不定明天就有奇蹟了。」（哪怕是一場注定沒有救贖的徒勞，您也依然要死死抓住那根名為希望的蜘蛛絲嗎？）", "「辛苦了。以後我陪著你，咱們再也不看別人臉色了。」（把心門徹底焊死，切斷與這個世界的所有連結。在這座只屬於您的孤島上，直到靈魂乾涸。）", "「把這些痛全刻在骨頭上。以後誰敢傷我們，就加倍咬回來！」（太精彩了。憤怒吧，憎恨吧，把這些絕望化作燎原的烈火。您已經準備好迎接降生了。）"] },
      { meta: "Q26 · 簽下這落魄的契約", text: "「看清楚了吧？這充滿裂痕、被恐懼和欲望支配的模樣……就是剝去偽裝後，您最真實的靈魂。」審判官微笑著，彷彿洞悉一切的惡魔，將一份空白的契約推到您面前。「但我不討厭這樣的您哦。這個世界不要您，我要。那麼現在，交出您的代價，收下這個奇蹟吧。」", options: ["閉上眼，死死摀住耳朵不敢看。（「別過來……哪怕繼續這麼爛下去，我也絕不把靈魂交給你！」）【虛幻禱告】", "一把推開契約，冷冷地看著他。（「別太傲慢了。我的絕望，我自己會背。輪不到你來施捨！」）【清醒接納】", "顫抖著伸出手，直視審判官的眼睛。（「只要能改變這一切……不管變成什麼怪物，我都簽。」）【徹底黑化】"] },
    gate:
      meta: "Q18 · 懸崖邊的決斷"
      text: "偽裝已經被徹底剝離，站在這無聲的懸崖邊，風很冷吧？……沒關係，您不需要一直站在那裡。只要向我許下一個願望，所有的重力都會消失。現在，告訴我您的渴望——"
      options: |-
        "【毀滅】既然這世界又髒又不公——不如借給我力量，把它連同我自己一起燒個乾淨吧。",
        "【被看見】哪怕要用靈魂作為抵押，我也要撕開這世界的眼皮，讓它看清楚我到底有多痛！",
        "【平靜】太累了。只要能讓這些痛苦停止，哪怕就這樣沉入安靜的水底，我也願意交換。",
        "【游離】我不知道……哪怕是墜落，我也沒有想去的方向。請您來替我決定吧。",
        ]
    trigger:
      meta: "Q19 · 惡魔的契約"
      text: "迷霧中，走出一個滿臉淚痕的小孩——是過去那個總是搞砸一切的您。她攥著一顆發光的石頭遞過來，小心翼翼地問：「如果還有一次重來的機會……你還願意相信奇蹟嗎？」"
      options: |-
        "接過石頭，緊緊攥進掌心。（「這一次，奇蹟我會親手去搶過來——哪怕代價是我最珍貴的東西。」）（觸發特殊分支）",
        "搖搖頭，推開她的手。（「現實可不是童話。那種輕飄飄的『奇蹟』，我早就戒掉了。」）",
        ]
    disclaimer:
      footer: 本測試為同人二創作品，與原作版權方無隸屬關係 · 測試結果僅供參考
      result: 角色版權歸原作方所有 · 測試結果僅供參考

