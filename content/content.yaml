    questions: |-
      [
          { meta: "Q1 · A Wish in the Morning Light", text: "Sunlight slips through the gap in the curtains before the alarm has even gone off. You open your eyes and watch dust motes drifting in the light. In that moment, a quiet hope for today rises in your chest —", options: ["Something good is bound to happen today. I'll smile at everyone I meet.", "If the day passes by quiet and uneventful, that's already more than enough.", "I'm a little tired. Still, I pull on the \u201C\u2018I'm fine\u2019\u201D mask and face the day."] },
          { meta: "Q2 · The Warmth of the Circle", text: "After class, the room hums with excited talk about the weekend gathering. Someone turns and takes your hand with a smile: \u201CYou're coming too, right? We can't do it without you.\u201D In that moment —", options: ["A warmth spreads through my chest, and I nod hard. Being wanted like this... it feels good.", "I smile and agree, but something tightens inside—afraid that one day I won't be good enough, and the warmth will scatter.", "I nod along politely. I know better than to trust this kind of warmth; it fades as fast as it comes."] },
          { meta: "Q3 · An Umbrella in the Rain", text: "A late-autumn night, rain pouring. The library is closing, and you stand at the door beside a quiet, withdrawn classmate. She stares helplessly at the downpour, no umbrella in hand. You happen to have one. In that moment —", options: ["I hand her my umbrella with a smile: \u201CLet's walk together.\u201D A small act, but it settles something in me.", "I hesitate before asking. We're not close, but it's on the way, so... I do it anyway.", "I pass her the umbrella, quietly keeping count of the favor. Next group project, she owes me one."] },
          { meta: "Q4 · A Mission Entrusted", text: "In front of everyone, a teacher or elder places an important task in your hands, patting your shoulder: \u201CYou're the most reliable one.\u201D In that moment —", options: ["I straighten my back. To be trusted like this—I silently vow: I will not fail.", "My shoulders suddenly feel heavy. I smile and accept, but the expectation presses down until I can hardly breathe.", "I take it politely. I know the drill: sweet words first, and from now on this burden is all mine."] },
          { meta: "Q5 · The Silent Compromise", text: "At dinner with friends, everyone cheers for a restaurant you don't like. Someone casually turns to ask your opinion —", options: ["I say at once: \u201CI've been dying to try that place!\u201D Them being happy matters more than what I want to eat.", "I smile and say \u201Canything's fine,\u201D swallowing the words I really wanted to say.", "I shrug and say \u201Cwhatever.\u201D A little cold, maybe—but no one was really asking me anyway."] },
          { meta: "Q6 · The Mirror's Transformation", text: "Late at night, you stand before the bathroom mirror, looking at the tired, ordinary face reflected back. A childhood fantasy about \u201Cmagical girls\u201D flickers through your mind. If you really could gain some kind of power —", options: ["I'd want the magic to protect everyone—to make every tear disappear.", "I'd want to become perfect, so I'd never have to bow my head again because of my weaknesses.", "I'd want the power to turn invisible—so that when I vanish, no one can find me."] },
          { meta: "Q7 · Shadow Under the Spotlight", text: "Your friend stands center stage, radiant, surrounded by adoring people. You clap quietly from the dark corner of the audience. In that moment —", options: ["I'm genuinely happy for her. She shines so bright—it reflects well on me too, as her friend.", "I clap hard, but my palms have gone cold: why is it never me standing in that light?", "I watch from the shadows, unmoved. Glory is fleeting anyway—the higher you climb, the harder you fall."] },
          { meta: "Q8 · Protection and Self", text: "On one end of the scale: \u201Csuppress your own feelings, so everyone can be okay.\u201D On the other: \u201Chold your boundaries, even if it disappoints those close to you.\u201D Where do you place the weight —", options: ["Sacrifice myself, in exchange for warmth and peace. [Pure sacrifice]", "Hold my boundaries, even if it means loneliness and cold stares. [Absolute self-preservation]"] },
          { meta: "Q9 · A Wound's Shelter", text: "When something unbearably unfair happens, you curl up in the corner of your room. The first thought that crosses your mind is —", options: ["I want someone to hold me and say, \u201CIt's okay. This will pass.\u201D", "I want to harden up, fast. From now on, I'll carry my own weight—I don't need anyone's approval.", "I stop hoping. No one has ever really come for me anyway."] },
          { meta: "Q10 · Obedience Under Discipline", text: "When an elder gives you a command that brooks no argument, and lays out a future for you that clashes with what you truly want, you usually —", options: ["Trust that they mean well, and walk the road they've paved.", "Appear obedient on the surface, while secretly keeping a corner of my own.", "Lie awake all night, seething with resistance—then do as I'm told the next morning anyway."] },
          { meta: "Q11 · The Perfect, Flawless Lie", text: "When someone asks with concern, \u201CSo... how have you been?\u201D your first reaction is usually —", options: ["To smile faster than anyone: \u201CI'm great!\u201D It's what they want to hear, anyway.", "To deflect with a joke. My bad moods aren't anyone else's burden.", "To answer flatly, \u201CFine.\u201D The words on the tip of my tongue go back down."] },
          { meta: "Q12 · The Frost on Idealism", text: "The first time you discover that someone you admire also lies, acts selfishly, and shows an ugly side in private, in that moment —", options: ["I'm shocked and hurt, but I can't stop making excuses for them.", "I'm a little disillusioned. I guess everyone's the same. I'll have to accept it.", "A cold laugh rises in me. See? There was never anyone truly clean."] },
          { meta: "Q13 · Effort, Dismissed", text: "The work you poured sleepless nights into gets brushed aside in a meeting, the credit going to someone else. In that moment, you —", options: ["Take a deep breath and tell myself: it's fine, the work got done, I'll try harder next time.", "My nails dig into my palm. I know how many all-nighters this cost me, and I know this anger has nowhere to go.", "A cold laugh. Fine. If sincerity means nothing here, from now on I'll just go through the motions."] },
          { meta: "Q14 · Dividing the Last Chips", text: "Misunderstandings and pressure pile on one after another, and you're about to break. Divide the last 3 points of mental chips among the three ways of coping below:", options: ["weight::2|1|0", "weight::2|0|1", "weight::1|2|0", "weight::0|2|1", "weight::1|0|2", "weight::0|1|2", "weight::1|1|1"] },
          { meta: "Q15 · A Secret Made a Joke", text: "By chance, in a group chat you were never added to, you see your closest friend casually use the wound you hide deepest as entertainment for everyone. In that moment —", options: ["I close the screen quietly and tell myself: everyone talks behind backs, she didn't mean it, we're still friends.", "My hands grow cold. I press \u201Cleave group.\u201D This friendship... it ends here.", "I take a screenshot. Some door inside me closes—from now on, I keep my distance too."] },
          { meta: "Q16 · The Silent Onlooker", text: "In high school, the classmate everyone avoided silently sits down beside you. Your friend tugs your sleeve: \u201CCome on, don't get mixed up in that.\u201D You look at her hands picking at the peeling paint on the desk. In that moment —", options: ["I get up and walk away, telling myself a reason: I just need water. I'm not the one who started this.", "My stomach clenches, but I murmur, \u201CI'll head off first.\u201D I know—I'm part of it too.", "I edge my chair away. People get what they deserve. She brought this on herself."] },
          { meta: "Q17 · Blackmail in the Name of Love", text: "You come home with grades that disappoint. Your parents sigh, long and heavy: \u201CAll our life's effort, wasted. Are you even sorry?\u201D In that moment —", options: ["I apologize at once and promise to do better. They worry about me—they're exhausted too.", "I stand there, head down, silent. I know what they want isn't me—it's the report card.", "Looking at their graying hair, something in me feels almost pleased: fine then. I'll be the disappointment you think I am."] },
          { meta: "Q20 · The Inescapable Self-Doubt", text: "Walking down a crowded street, feeling eyes sweep over you, your body's most immediate reaction is —", options: ["To straighten my back at once, stride long and steady—even if it's all an act, I'll act confident.", "A chill runs down my spine, my palms sweat. That \u201CI'm not good enough\u201D feeling follows me everywhere.", "To start picking at others: that person's hair, that person's outfit... the more I pick, the better I feel about myself."] },
          { meta: "Q21 · Love as Control", text: "Your partner constantly criticizes your clothes, your posts, your every word, always insisting: \u201CI'm only doing this for your own good.\u201D In that moment —", options: ["I clumsily change to fit their demands. If they're this particular, they must really care, right?", "I'm exhausted, but I still say \u201Cno.\u201D I know once these words leave my mouth, this relationship might be over.", "I turn it back on them—their body, their income. They take a jab, I jab back. No one gets the upper hand."] },
          { meta: "Q22 · The Ultimate Price", text: "The judge backs you into a corner. The scale offers only two choices: \u201Csacrifice yourself so the ones you love can be happy again,\u201D or \u201Cdrag the whole world down with you, so long as you keep holding the only true feeling you have\u201D? ", options: ["Rather sacrifice myself, in exchange for others' light. [Pure martyrdom]", "Rather destroy the world than let go of my obsession. [Absolute obsession]"] },
          { meta: "Q23 · Hidden Malice and Envy", text: "You hear that the person who always outshone you, always perfect, has suddenly taken a hard fall. The very first thought that flashes through your mind is —", options: ["I hurry to suppress it and scold myself: \u201CHow could you think that?\u201D Then I send the usual polite greeting.", "I admit it—for one second, it felt good. Immediately followed by guilt: what kind of person am I?", "Good. Really good. I've been waiting for this—why did they get to have everything?"] },
          { meta: "Q24 · Discarded After Being Drained", text: "The group or leader that once fussed over you quickly pushes you to the margins once you've lost your usefulness. Facing this coldness —", options: ["I keep helping with the chores, making excuses for them: everyone's just busy. They're not deliberately ignoring me.", "I quietly pack my things and leave. Being used up and thrown away—I'll remember this.", "I stay calm on the surface, but inside I've blacklisted them all. Need my help again? Sorry, I'm so \u201Cbusy.\u201D"] },
          { meta: "Q25 · Farewell at the Cliff's Edge", text: "If every hope has died, and you stand at the end of the road, looking at the self that has been wounded all the way here, you want to say to her —", options: ["\u201CIt's okay. Hold on a little longer—tomorrow the sun will come out.\u201D (Even if you don't quite believe it yourself)", "\u201CYou've worked so hard. It hurt all the way here, but I'm with you. We won't run anymore.\u201D", "\u201CI remember every single pain. Whoever hurts us from now on—we'll give it right back.\u201D"] },
          { meta: "Q26 · The Final Verdict", text: "The judge's voice echoes through the empty world of the mind: \u201CSee it now? This is what's under your skin—cowardice, compromise, darkness, stubbornness. All of it, every last piece of you. Now, are you willing to take this true face and sign the contract of survival?\u201D", options: ["I close my eyes, unable to look, still praying that a holy light will wash away all my filth. [Vain prayer]", "I open my eyes and meet the judge's gaze: \u201CThis is me, broken as I am. I'll keep living with these scars and this ugliness.\u201D [Sober acceptance]", "I snatch the contract and tear it apart: \u201CI don't need your judgment! My darkness is my weapon—I will become my own god!\u201D [Complete corruption]"] },
        ]
