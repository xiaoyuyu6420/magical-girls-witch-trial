    questions: |-
      [
          { meta: "Q1 · 晨光中的許願", text: "清晨的陽光透過窗簾縫隙打在臉上，鬧鐘還沒響。我睜開眼，看著天花板上的微塵在光裡起舞。那一刻，我心裏悄悄浮現出對今天的期許——", options: ["今天一定會有好事發生吧。見到誰，都笑著打個招呼。", "像平常一樣平平靜靜地過完，就已經很好了。", "其實有點累。還是打起精神，把那副「沒問題」的樣子穿好。"] },
          { meta: "Q2 · 小團體的溫熱", text: "放學後的教室，大家圍在一起熱烈地討論著週末的聚會。有人忽然轉過頭，微笑著拉住我的手：「你肯定也會來的，對吧？少了你可不行。」那一刻——", options: ["心裡一暖，我用力點頭。被這樣需要著，真好。", "我笑著答應了，心裡有點發緊——怕哪天自己不夠好，這份熱鬧就散了。", "我禮貌地應和著。心裡清楚，這樣的熱鬧，散起來也快。"] },
          { meta: "Q3 · 雨夜的傘簷", text: "深秋的雨夜，圖書館關門了。我站在門口，旁邊是那個平時很少說話、有些孤僻的同班同學。她正窘迫地看著雨幕，手裡沒有任何雨具。而我手裡恰好有一把傘。那一刻——", options: ["我把傘遞過去，笑著說「一起走吧」。做了件小事，心裡挺踏實的。", "我猶豫了一下才開口邀請。做朋友的可能不大，但順路的事，做了就做了。", "我遞過傘，心裡記下了這份人情：下次小組作業，她也該幫我一回。"] },
          { meta: "Q4 · 被賦予的使命", text: "老師或長輩當著眾人的面，將一項重要的任務交到了我手裡，並拍著我的肩膀說：「你是最讓人放心的。」那一刻——", options: ["我挺直了背。被人這麼信任著，心裡暗暗較勁：絕不能搞砸。", "肩膀好像一下子沉了。我笑著應下來，可這份期待壓得人喘不過氣。", "我客氣地接下。心裡明白，好聽話說在前頭，往後這攤事就都是我的了。"] },
          { meta: "Q5 · 無聲的妥協", text: "朋友聚餐時，大家都高聲贊同去吃某家我不喜歡的餐廳。當有人順口問起我的意見時——", options: ["我立刻說「那家我也超想去」。大家吃得開心，比我想吃什麼重要。", "我笑著說「都行」，把想說的那句話嚥了回去。", "我聳聳肩說「隨便」。有點涼——好像也沒人真的想問我。"] },
          { meta: "Q6 · 鏡中的變身", text: "深夜，我站在洗手間的鏡子前，看著鏡子裡疲憊又平凡的自己，腦海中忽然閃過小時候關於「魔法少女」的幻想。如果真的能獲得某種力量——", options: ["我想擁有守護大家的魔法，讓所有人的眼淚都能消失。", "我想變得完美，不再因為那些軟弱和不完美，在人前抬不起頭。", "我想擁有隱身的能力——至少消失的時候，誰也找不到我。"] },
          { meta: "Q7 · 光芒下的陰影", text: "看著舞台中央那個光彩照人、被所有人簇擁的朋友，我站在台下陰暗的角落裡默默鼓掌。那一刻——", options: ["我是真心為她高興。她這麼耀眼，我這當朋友的，臉上也有光。", "我使勁鼓掌，掌心有點發涼：為什麼站在光裡的，永遠不是我？", "我在台下冷冷看著。風光嘛，都是暫時的——站得越高，摔得越狠。"] },
          { meta: "Q8 · 守護與自我", text: "天平兩端，一端是「壓下自己的情緒，換大家都好」，另一端是「守住自己的界限，哪怕讓身邊的人失望」。你把籌碼放在——", options: ["犧牲自我，換取溫暖與安寧。【純潔犧牲傾向】", "守住界限，哪怕承受孤立與冷眼。【極黑獨占／自存傾向】"] },
          { meta: "Q9 · 脆弱時的懷抱", text: "遇到極度委屈的事情時，蜷縮在房間角落裡的我，第一個閃過的念頭是——", options: ["想被誰抱一下，聽一句「沒事的，都會過去」。", "想快點硬氣起來。往後的事自己扛，不用再看誰的臉色。", "不再指望了。反正從來沒有人真的來過。"] },
          { meta: "Q10 · 規訓下的順從", text: "面對長輩不容置疑的命令和對未來的安排，即使與我內心的渴望背道而馳，我通常會——", options: ["相信他們是為我好，順著鋪好的路往下走。", "表面乖乖配合，私下偷偷留一塊只屬於自己的地方。", "心裡抗拒得整宿睡不著，可第二天還是乖乖照做了。"] },
          { meta: "Q11 · 完美無瑕的謊言", text: "當別人關切地問起「你最近還好嗎」時，我的第一反應往往是——", options: ["笑得比誰都快：「我挺好的。」反正大家想聽的也是這句。", "開個玩笑岔過去。自己的壞情緒，不想拿去麻煩別人。", "淡淡回一句「還行」，湧到嘴邊的話又嚥了回去。"] },
          { meta: "Q12 · 理想主義的微霜", text: "第一次發現自己敬佩的人私下裡也會說謊、利己、展現醜陋的一面時，那一刻——", options: ["我又震驚又難過，但還是忍不住替他找理由開脫。", "有點幻滅。原來誰都一樣，只能慢慢接受。", "心裡冷笑了一下：看吧，根本沒有真正乾淨的人。"] },
          { meta: "Q13 · 被輕描淡寫的付出", text: "我熬夜幾天幾夜做出的努力，在會議上被上司或同伴輕飄飄地一筆帶過，甚至將功勞歸於他人。那一刻，我——", options: ["深吸一口氣，安慰自己：沒關係，事情做好就行，下次再努力。", "指甲掐進掌心。我清楚自己熬了幾個通宵，也清楚這口氣只能自己嚥。", "心裡冷笑：行。既然真心不值錢，往後我也只是應付差事。"] },
          { meta: "Q14 · 崩塌時刻的籌碼分配", text: "誤解和壓力一件接一件壓下來，快撐不住了。把手裡僅剩的 3 點心理籌碼，分給下面三種應對方式：", options: ["weight::2|1|0", "weight::2|0|1", "weight::1|2|0", "weight::0|2|1", "weight::1|0|2", "weight::0|1|2", "weight::1|1|1"] },
          { meta: "Q15 · 被當作談資的秘密", text: "偶然間，我在那個未曾把我拉入的群聊裡，看見最親近的朋友正用輕佻的字眼，把我藏得最深的傷痛當作談資呈給眾人看。那一刻——", options: ["我默默關掉介面，勸自己：誰人背後不說人，她只是無心，我們還是朋友。", "手心一點點涼下去，我按下了「退出群聊」。這段關係到這兒吧，回不去了。", "我保存了截圖。心裡某扇門關上了——往後對她，我也留一手。"] },
          { meta: "Q16 · 無聲的冷眼旁觀", text: "高中那年，那個全班避之不及的同學默不作聲地坐在我身旁。朋友拉拉我的袖子：「走了，別沾上晦氣。」我看著她摳著桌角起皮漆的雙手。那一刻——", options: ["我起身走開，替自己找好了理由：不過是去買個水，這風又不是我揚的。", "胃裡一陣發緊，我還是低聲說了句「我先走了」。我知道，我也算其中一個。", "我把椅子往外挪了挪：可憐之人必有可恨之處，她那樣，她自己也有份。"] },
          { meta: "Q17 · 以愛為名的勒索", text: "拿著不理想的成績／績效回家，父母長久地嘆氣：「我們一輩子的心血都白費了，你對得起我們嗎？」那一刻——", options: ["我趕忙道歉，保證下次一定考好。他們也是為我操心，累壞了。", "我低頭站著不吭聲。心裡清楚，他們要的是那張成績單，不是我。", "看著他們斑白的頭髮，我心裡竟然有點痛快：行啊，我爛給你們看。"] },
          { meta: "Q20 · 無法逃離的自卑", text: "每當走在熱鬧的大街上，感覺周圍人的目光掃過自己時，我身體最直觀的反應是——", options: ["立刻挺直腰板，步子邁得又穩又大——裝也要裝出自信的樣子。", "後背發涼，手心出汗。那種「我不夠好」的感覺，走到哪都甩不掉。", "心裡開始挑別人的刺：那人的髮型、那人的穿搭……挑著挑著，自己好像真的好受了點。"] },
          { meta: "Q21 · 控制與互戕的愛情", text: "伴侶頻繁挑剔我的穿著、朋友圈和言行，並表達「我都是為了你好」。那一刻——", options: ["我笨拙地照他說的改。他這麼挑剔，大概是真的在乎我吧。", "我很累，但還是說了「不」。我知道這句話一出口，這段感情可能就到頭了。", "我反過來挑剔他的身材和收入。他挑我一句，我頂回去一句，誰也別想佔上風。"] },
          { meta: "Q22 · 終極代價", text: "審判官把你逼到死角，天平兩端只能選一個：是「犧牲你自己，換愛過你的人重新幸福」，還是「拉著整個世界陪葬，也要抱緊你唯一的真情」？", options: ["寧願獻祭自我，換取他人的光明。【純潔殉道】", "寧可毀滅世界，也絕不放手執念。【極黑獨占】"] },
          { meta: "Q23 · 隱秘的惡意與嫉妒", text: "聽說那個處處壓你一頭、一直完美的人突然栽了大跟頭，我心裡第一下閃過的念頭是——", options: ["我慌忙把那點念頭壓下去，罵自己「怎麼能這麼想」，然後照常發去一句問候。", "我承認那一秒有點暗爽。緊接著就是愧疚：我怎麼是這樣的人。", "爽，是真的爽。等這一天很久了——憑什麼好事全讓你佔了。"] },
          { meta: "Q24 · 被榨乾後的廢棄", text: "曾經對你噓寒問暖的團體或領導，在你失去了利用價值後，迅速將你邊緣化。面對這種冷酷——", options: ["我照舊幫著做雜事，替他們想：大家只是太忙，不是故意晾著我。", "我默默收拾好東西離開。被用完就丟，這事兒我記下了。", "面上不吵不鬧，心裡已經把他們拉黑。再找我幫忙？抱歉，我可「忙」著呢。"] },
          { meta: "Q25 · 懸崖邊的告別", text: "如果所有希望都破滅了，站在路的盡頭，看著那個一路傷痕累累的自己，我想對她說——", options: ["「沒關係的，再堅持一下，明天陽光一定會照進來的。」（哪怕你自己都不太信）", "「辛苦你了。這一路很痛，但我陪著你，我們不逃了。」", "「這些痛我都記著。往後誰再傷我們，我們就還回去。」"] },
          { meta: "Q26 · 審判終章確認", text: "審判的聲音在空曠的精神世界迴響：「看清了嗎？這就是你皮囊底下的真實——懦弱、妥協、陰暗、執拗，一樣都不少的你。現在，願意帶著這副真面目，簽下這份生存契約嗎？」", options: ["我閉上眼不敢直視，依然祈求能有一道聖光洗淨我所有的髒污。【虛幻禱告】", "我睜開眼，直視著審判官：「這就是殘破的我，我帶著這些傷痕與醜陋繼續活著。」【清醒接納】", "我奪過契約撕碎：「我不需要你的審判！我的陰暗就是我的武器，我自會成為自己的神！」【徹底黑化】"] },
        ]
