    types:
      EMMA:
                name: "櫻羽艾瑪"
                slogan: "「即使全世界都放棄了，我也不會」"
                desc: "你是天生的信仰者。你相信每一個人都值得被拯救，即使被背叛、被傷害、被全世界誤解，你仍然選擇伸出手。這份善意不是天真——是你明知代價後依然做出的選擇。"
                keywords: "不滅的希望、絕對的信任、自我犧牲"
      SHERRY:
                name: "橘雪莉"
                slogan: "「為了你，我可以成為任何人——甚至壞人」"
                desc: "你是天生的守護者，溫暖而充滿活力，是所有人眼中的太陽。但你守護的方式會走向極端——當摯愛受到威脅，你願意為之殺人。你的善意和瘋狂之間，只隔著一個你在乎的人。"
                keywords: "致命的天真、為愛瘋狂、陽光下的暗面"
      MIRIA:
                name: "佐伯米莉亞"
                slogan: "「不用怕，姐姐來扛」"
                desc: "你是大姐般的存在，總是默默照顧所有人，把自己的痛苦藏在笑容後面。你不會等到別人求助就主動出手，甚至在生死關頭甘願以命相替。你的溫柔有稜角——是對世界最倔強的善意。"
                keywords: "無聲的守護、以命相替、倔強的溫柔"
      HIRO:
                name: "二階堂希羅"
                slogan: "「哪怕要死一千次，我也要把她帶回來」"
                desc: "你是冰與火的矛盾體——外表冷酷無情，內心卻燃燒著比任何人都熾热的情感。你不會輕易信任，但一旦認定了某個人，即使要赴湯蹈火、反覆經歷死亡，你也不會後退一步。"
                keywords: "冷焰、死亡回溯、為摯愛不惜一切"
      NANOKA:
                name: "黑部奈葉香"
                slogan: "「不需要同伴，不需要溫暖，我只要復仇」"
                desc: "你是獨行的孤狼，用尖刺包裹住所有傷口。你拒絕一切善意，因為過去的經歷告訴你——靠近的人只會被利用。你的復仇不是熱血，而是冰冷的、精密的、孤獨的執念。"
                keywords: "孤狼復仇、拒絕溫暖、精密的執念"
      HANNA:
                name: "遠野漢娜"
                slogan: "「我才不關心你呢……笨蛋」"
                desc: "你用傲慢和刻薄鑄造了一面完美的盔甲，盔甲之下卻藏著一顆比誰都柔軟的心。你不會直接表達善意——你會做一個人偶放在對方枕邊，或者在所有人離開後偷偷照顧病人。你的溫柔，只有讀懂你的人才看得見。"
                keywords: "傲嬌、盔甲下的脆弱、笨拙的溫柔"
      MERURU:
                name: "冰上梅露露"
                slogan: "「我等了很久……很久很久」"
                desc: "你是永恆的守望者，溫柔體貼的外表下藏著跨越千年的孤獨。你對每個人都真誠相待，但你真正的目的從未改變。你目睹了無數羈絆的誕生與碎裂，卻依然選擇相信——這份堅持本身就是最大的奇蹟。"
                keywords: "千年守望、溫柔偽裝、永不放棄的執念"
      COCO:
                name: "澤渡可可"
                slogan: "「別誤會，我只是無聊才跟你說話」"
                desc: "你是毒舌主播，用刻薄和自我中心掩飾內心的寂寞。你總在嘲笑別人的天真，但嘲笑的語氣裡有微妙的溫度。你害怕被拋棄，所以選擇先推開所有人——但又忍不住在角落裡偷偷關注他們。"
                keywords: "毒舌盔甲、寂寞中心、拒絕脆弱"
      NOAH:
                name: "城崎諾亞"
                slogan: "「這個顏色……好漂亮，我想把它畫下來」"
                desc: "你是活在夢境中的畫家，擁有獨特的世界觀和不受常理束縛的思維。你對惡意幾乎免疫——不是因為你不懂，而是因為你的世界裡有比仇恨更重要的美。你的純真是一種力量，哪怕在最黑暗的監牢裡，你也在創造光。"
                keywords: "純真創造、夢境畫家、對抗黑暗的美"
      MARGO:
                name: "寶生瑪格"
                slogan: "「別太在意我，我只是路過的」"
                desc: "你是漂泊的星，沒人能真正看清你的全貌。你時而帶刺時而可靠，總是在關鍵時刻出現又在平時消失。你有自己的價值觀和行為準則，不受任何人的框架約束。你的神秘不是偽裝——你就是活成了謎題本身。"
                keywords: "神秘莫測、獨立法則、關鍵時刻的援手"
      ANAN:
                name: "夏目安安"
                slogan: "「只有你……不能離開我」"
                desc: "你是封閉花園中的獨佔者，社恐的外殼下藏著極端的依賴與嫉妒。你害怕人群，卻渴望被某一個特定的人完全接納。當這份渴望被威脅時，你內心的黑暗會以一種安靜但致命的方式爆發。你的愛是一座牢籠——困住別人，也困住自己。"
                keywords: "獨佔慾、社恐暗面、安靜的危險"
      ALISA:
                name: "紫藤亞里沙"
                slogan: "「少廢話，跟上就是了」"
                desc: "你是不良外表下的鐵薔薇，粗魯的言行掩蓋著笨拙的正義感。你嘴上抱怨個不停，行動上卻總是第一個衝進火場救人。你不容易敞開心扉，但一旦認可了某個人，你會用最笨拙的方式守護到底。"
                keywords: "不良正義、笨拙溫柔、行動派"
      LEIA:
                name: "蓮見蕾雅"
                slogan: "「看著我的眼睛——告訴我，我在你眼裡是閃光的」"
                desc: "你是天生的領袖，美麗自信，一出現就能吸引所有人的目光。但光環之下是深不見底的空洞——你需要被看見、被認可、被崇拜。當這份渴望得不到滿足時，你會做出任何事來重新站上舞台中央。你的魅力是真實的，你的脆弱也是。"
                keywords: "領袖魅力、被認可的渴望、光環下的空洞"
      UNSET:
                name: "未定之魂"
                slogan: "「審判還未落錘，你的靈魂在等待被定義」"
                desc: "你的因子尚未覺醒到可以歸類的程度。也許你在所有人之間遊走，也許你刻意隱藏了真實的自己。無論哪種，下次審判見。"
                keywords: ""
      YUKI:
                name: "月代雪"
                subtitle: "大魔女"
                slogan: "「你們人類的悲劇……我全都看在眼裡。所以，由我來終結」"
                desc: "你是跨越百年的復仇者，是最年幼也最強大的魔女。你曾真心地愛過這個世界，也曾被摯友的溫暖動搖過。但你選擇把這一切都埋葬，用冰冷的理性執行一個漫長到令人窒息的計畫。你的復仇不是瘋狂——而是一種絕望到極致的清醒。"
                keywords: "百年復仇、絕望的清醒、冰冷的終焉"
      ETL:
                name: "不滅雪華"
                subtitle: "梅露露真身"
                slogan: "「即使世界拋棄了我，我對雪的愛不會消融」"
                desc: "你是千年不滅的存在，因對「雪」的信仰而獲得了不老不死。你經歷了無數少女的誕生與死亡，目睹了無數次背叛與絕望，但你從未放棄尋找那個離開你的人。你的堅持不是執念——而是對愛的最純粹回應。"
                keywords: "千年不滅、純粹的信仰、永恆的守望"
      MADOKA:
                name: "鹿目圓"
                subtitle: "終將成為神"
                slogan: "「我不想讓任何人再哭泣，哪怕要我變成不再存在的存在」"
                desc: "你是天生的信仰者——溫柔到近乎天真的善良，讓你在看到任何人的痛苦時都無法轉身離開。你信任陌生人，寬恕傷害過你的人，甘願為素不相識的人承擔命運。這份善意不是軟弱，是你明知世界殘酷後依然選擇伸出手。當所有人都絕望時，你是那個還會說‘一定有辦法’的人——哪怕代價是抹消自己存在的痕跡。"
                keywords: "不滅的善意、為眾生成神、天真的信仰"
      HOMURA:
                name: "曉美焰"
                subtitle: "時間掠奪者"
                slogan: "「哪怕要重啟世界一千次，我也要守住她一個人的笑容」"
                desc: "你是冰與執念的矛盾體——外表冷酷到不近人情，內心卻燃燒著比任何人都熾烈的執著。你記著每一個輪迴，每一次失敗，每一個沒能救下她的瞬間。你不信任旁人，因為旁人從未陪你走過那些被重置的時間；你寬恕不了命運，因為命運從未對你手軟。你的溫柔只對一個人開放，而對那一個人的愛，足夠讓你與整個世界為敵。"
                keywords: "輪迴千次、冷焰執念、為一人敵世界"
      SAYAKA:
                name: "美樹沙耶香"
                subtitle: "正義的末路"
                slogan: "「我明明是想做一個正確的人，為什麼最後變成了怪物」"
                desc: "你是被自己的正義感燒成灰燼的人——你眼裡容不下一點不公，你為受傷的人出頭，你許願治癒心上人卻不敢讓他知道。可這個世界不獎勵純粹的好人：你信任的人背叛了你的秘密，你救的人忘了你的存在，你信奉的正義在殘酷的現實前一寸寸碎裂。你的崩潰不是軟弱，是太用力地善良之後被反噬的傷口。魔女化不是墮落，是你的正義找不到出口的悲鳴。"
                keywords: "正義的崩塌、愛而不得、魔女化悲鳴"
      KYOKO:
                name: "佐倉杏子"
                subtitle: "末路求生者"
                slogan: "「別傻了。在這個世界裡，只為別人許願的人活不長」"
                desc: "你是被現實磨硬了殼的實用主義者——曾經的你也相信為他人犧牲是神聖的，直到那個許願毀了你的全家。從那以後你學會了先顧自己，學會了冷眼旁觀別人的悲劇，學會了用‘這不關我事’擋住所有想靠近的人。可你騙不了自己：當真正在乎的人陷入絕境，你還是會衝上去。你的硬是裝出來的，你的軟才是底色——只是你不敢再輕易把它交出來。"
                keywords: "實用主義盔甲、家庭創傷、關鍵時刻的真心"
      MAMI:
                name: "巴麻美"
                subtitle: "孤獨的前輩"
                slogan: "「當魔法少女這麼久，我其實……一直都好害怕」"
                desc: "你是優雅的盔甲下藏著深淵的人——你永遠是後輩面前從容不迫的前輩，泡著紅茶、繫著緞帶、用最漂亮的姿態消滅魔女。可沒有人知道你獨自戰鬥了多少年，沒有人知道你每個夜晚都在害怕下一次會不會就回不來了。你渴望同伴，渴望被需要，渴望有人能讓你卸下‘可靠前輩’的偽裝。當有人終於願意走近你，你會緊緊抓住——因為你太孤獨了，孤獨到寧可把脆弱藏在優雅裡，也不願被人看見。"
                keywords: "優雅的盔甲、深層孤獨、渴望被需要"
      homura_devil:
                name: "曉美焰"
                slogan: "重要的人一旦認定，你就很難退開。"
                desc: "你不是拒絕親近，只是靠近之前會觀察很久。一旦認定一個人重要，你會把對方的事當成自己的事；局面失控時，又會先收緊邊界，盡量自己處理。你和焰相似的地方不是什麼黑化，而是這份很難收回的認真。"
                keywords: "謹慎,邊界感,行動先於表達"
      madoka_god:
                name: "鹿目圓"
                slogan: "你常常先注意到別人的需要。"
                desc: "氣氛一不對，你通常會先看誰在難受，然後想自己能做什麼。照顧人時你很有行動力，問題是自己的需要常常被排到後面。你和圓相似的地方，是溫柔不只是態度，也會真的動手去做。"
                keywords: "敏感,照顧,行動力"
      sayaka_siren:
                name: "美樹沙耶香"
                slogan: "你對公平和承諾很敏感。"
                desc: "答應過的事，你會當真；看到敷衍和偏袒，也比一般人更難受。事情沒做好時，你容易先檢討自己，再把失望壓成憤怒。你和沙耶香相似的地方，是不願意用「隨便啦」處理重要關係。"
                keywords: "原則感,認真,自我要求"
      kyoko_pragmatist:
                name: "佐倉杏子"
                slogan: "你的關心，常常包在現實判斷裡。"
                desc: "你習慣先算可行性，再決定要不要投入，不喜歡把氣氛說得很滿。但真正認定一個人後，你會用具體行動幫忙，只是不一定會承認自己在意。你和杏子相似的地方，是嘴上留餘地，事上不輕易退。"
                keywords: "務實,有底線,嘴硬心軟"
      emma_truth:
                name: "櫻羽艾瑪"
                slogan: "你想弄清楚事情本來的樣子。"
                desc: "你不擅長用「算了」糊過去。一句話前後對不上，或者有人在關係裡回避問題，你會注意到，也會想繼續問。答案讓人不舒服時，你仍寧願先知道事實，再決定怎麼處理。"
                keywords: "求真,有邊界,不輕易自欺"
