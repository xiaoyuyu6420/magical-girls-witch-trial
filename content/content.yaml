  说明: 这是文案权威源。别的 Agent 在这里填文案，然后跑 `pnpm exec tsx scripts/sync-content.ts` 同步到项目。
  规则:
    - 标 🔒 的字段是结构字段（dim/type/score/value/trigger/vector 等），绝对不能改——改了会破坏评分算法
    - 标 ✏️ 的字段是文案字段（text/label/slogan/desc/keywords/meta），在这里填
    - 四语言：zh-CN 是中文权威源，en/ja/zh-TW 是翻译
    - "题库 26 题：1-12 正向 / 13-17 反向 / 18 门控 / 19 触发 / 20-26 反向；第 8/22 是天平题(2选项) / 第 14 是砝码题(7选项 weight:: 编码 🔒)"
    - 改完后跑 sync，项目 http://localhost:3010 立即生效
questions:
  - _index: 1
    _dim: 🔒 W2
    _type: 🔒 normal
    meta: ✏️ Q1 · 晨光中的虚妄
    text: 清晨，微尘在阳光里起舞。这看似平凡的一天又开始了。那一刻，您心底浮现的声音是——
    options:
      - _score: 🔒 1
        label: “今天，也许会有好事发生吧。”（这年头还愿意相信这种话，该说您是天真，还是坚强呢。）
      - _score: 🔒 2
        label: “不出大乱子，平平安安混过去就好。”（求个安稳而已。只是，您不觉得这样的人生有些无趣吗？）
      - _score: 🔒 3
        label: “把‘我很好’焊在脸上吧。”（毕竟没有人想看您的烂摊子。您很懂规矩呢。）
  - _index: 2
    _dim: 🔒 B1
    _type: 🔒 normal
    meta: ✏️ Q2 · 塑料的温热
    text: 热闹的教室里，有人拉着您的手笑着说：“来吧，这件事少了你可不行”。面对这种廉价的社交辞令，您——
    options:
      - _score: 🔒 3
        label: 心里一阵回暖。用力点头。（“被需要”这三个字，还真是能轻易拿捏您呢。）
      - _score: 🔒 2
        label: 笑着答应，心底却发虚。（是在害怕哪天没了利用价值，这热闹就与您无关了吧？）
      - _score: 🔒 1
        label: 礼貌附和，冷眼旁观。（十分清醒。可惜这种塑料感情，风一吹就散了。）
  - _index: 3
    _dim: 🔒 B3
    _type: 🔒 normal
    meta: ✏️ Q3 · 施舍的伞檐
    text: 雨夜，您看到一个孤僻的同学被困在屋檐下，而您手里恰好有伞。您会做些什么？——
    options:
      - _score: 🔒 3
        label: 毫不犹豫地递过伞。（帮个小忙，顺便体会一把道德优越感，感觉不错吧？）
      - _score: 🔒 2
        label: 犹豫了一下，还是把伞递了过去。（害怕麻烦又硬要当好人，您不觉得累吗？）
      - _score: 🔒 1
        label: 递过伞，并把这笔人情记在心里。（很现实的考量。您的伞，可从来不是白给的。）
  - _index: 4
    _dim: 🔒 S2
    _type: 🔒 normal
    meta: ✏️ Q4 · 沉重的皇冠
    text: 长辈当众把重任压在您肩上：“交给您最放心。”那一刻，您的真实想法是——
    options:
      - _score: 🔒 3
        label: 挺直背脊，暗暗较劲。（宁可自己熬秃也绝不搞砸，真是一个听话的优等生呢。）
      - _score: 🔒 2
        label: 肩膀像灌了铅，笑着应下。（明明被那句“放心”压得喘不过气，却连个“不”字都不敢说。）
      - _score: 🔒 1
        label: 客气应承，心里冷笑。（您早就看透了吧，这堆冠冕堂皇的借口下，全是要您收拾的烂摊子。）
  - _index: 5
    _dim: 🔒 W1
    _type: 🔒 normal
    meta: ✏️ Q5 · 无声的妥协
    text: 朋友们一致嚷嚷着要去一家您不太感兴趣的餐厅。当有人顺嘴问起您的意见时，您——
    options:
      - _score: 🔒 3
        label: 立刻附和：“我也超想吃那家！”（为了不扫兴，把自己塞回委屈的套子里，您早就习惯了吧。）
      - _score: 🔒 2
        label: “我都行啊。”（那句“我不想去”还是咽回去了。随大流，永远是最安全的。）
      - _score: 🔒 1
        label: 耸耸肩说“随便吧”。（心里在冷笑吧？他们就是装模作样问问，根本没人在意您的死活。）
  - _index: 6
    _dim: 🔒 S2
    _type: 🔒 normal
    meta: ✏️ Q6 · 镜中的妄想
    text: 深夜看着镜子里疲惫又平凡的自己，如果真能获得某种不讲道理的魔法，您渴望的是——
    options:
      - _score: 🔒 1
        label: 治愈一切，让身边的人都不再流泪。（连自己的窟窿都没填上，您还妄想着拯救世界吗？）
      - _score: 🔒 3
        label: 变得绝对完美。（是想把那些让您抬不起头的自卑，通通抹掉吧。）
      - _score: 🔒 2
        label: “透明化”。（累了就原地消失。逃避虽然可耻，但对您来说，真的是个好用的借口。）
  - _index: 7
    _dim: 🔒 F1
    _type: 🔒 normal
    meta: ✏️ Q7 · 聚光灯外的阴沟
    text: 看着舞台中央那个光彩照人、夺走所有视线的朋友，站在阴暗角落里默默鼓掌的您，其实在想——
    options:
      - _score: 🔒 1
        label: 真心为她自豪。（甘心当一辈子的绿叶，您可真是大度得让人意外。）
      - _score: 🔒 2
        label: 用力鼓掌，掌心发凉。（是不是在想……为什么站在光里的，永远不能是您？）
      - _score: 🔒 3
        label: 冷冷地看着。（风光都是别人的。站得越高摔得越响，您其实是这么期盼着的吧？）
  - _index: 8
    _dim: 🔒 B3
    _type: 🔒 normal (scale)
    meta: ✏️ Q8 · 守护与自我
    text: 天平两端：一端是“咽下委屈，换取虚伪的体面”，另一端是“死守底线，哪怕让所有人下不来台”。您要把筹码推向哪边？
    options:
      - _score: 🔒 3
        _value: 🔒 SACRIFICE
        label: 委屈自己，换取短暂的和平与温暖。【纯洁牺牲倾向】
      - _score: 🔒 1
        _value: 🔒 OBSESSION
        label: 死守底线，哪怕被所有人孤立和冷眼。【极黑独占】
  - _index: 9
    _dim: 🔒 B1
    _type: 🔒 normal
    meta: ✏️ Q9 · 破碎时的摇尾
    text: 极度委屈、情绪彻底崩溃的时候，蜷缩在角落里的您，脑子里冒出的念头是——
    options:
      - _score: 🔒 3
        label: 好想被人抱一下。听一句“没事的”。（您还在等谁来救场呢？现实已经证明过很多次了吧，您的痛苦对别人来说，只是一件麻烦事而已。）
      - _score: 🔒 2
        label: 赶紧把眼泪擦干。（把伤口藏起来，它就不会流血了吗？您只是在用这种懂事，换取别人不去踩踏您的仁慈。）
      - _score: 🔒 1
        label: 指望谁呢？别傻了。（在别人抛弃您之前，先一步推开所有人。这就是您用来保证自己绝对安全的方法吗？）
  - _index: 10
    _dim: 🔒 S1
    _type: 🔒 normal
    meta: ✏️ Q10 · 提线木偶的顺从
    text: 面对长辈或上位者不容置疑的命令和安排，明明心里有一百个不愿意，可您的最终反应是——
    options:
      - _score: 🔒 3
        label: 强迫自己相信“他们是为我好”，全盘接受。（只要放弃思考，把人生的方向盘交出去，就永远不需要为失败承担责任了。真是轻松的生存之道呢。）
      - _score: 🔒 2
        label: 表面乖顺，内心却建起一堵高墙谁也不让进。（您以为在心里保留抗拒就是一种反叛？可他们根本不在乎您的灵魂，只要您的行为服从就够了。）
      - _score: 🔒 1
        label: 在心里掀了一万次桌子，第二天还是原样照做了。（明明有一百个不愿意，最后却连一个“不”字都没说出口。您的反抗，永远只敢发生在没人看见的脑子里呢。）
  - _index: 11
    _dim: 🔒 W1
    _type: 🔒 normal
    meta: ✏️ Q11 · 完美无瑕的谎言
    text: 当别人貌似关心地问起“您最近过得好吗”时，您脱口而出的是——
    options:
      - _score: 🔒 3
        label: 挂上标准微笑：“挺好的呀！”（堪称完美的反射神经。您已经极其熟练地，把自己的求救信号掐灭在喉咙里了呢。）
      - _score: 🔒 2
        label: 用极其夸张和自嘲的语气，把自己的倒霉事当笑话讲出来。（只要您先把自己当成小丑，别人就无法真正可怜您。这是您用来推开别人的绝佳盾牌。）
      - _score: 🔒 1
        label: 叹口气，欲言又止地说一句“勉强活着吧”。（把伤口撕开一条缝，祈求着对方能追问下去，却又害怕对方真的走进来。您不觉得这种试探很可怜吗？）
  - _index: 12
    _dim: 🔒 S3
    _type: 🔒 normal
    meta: ✏️ Q12 · 偶像的崩塌
    text: 发现您一直极度敬佩的人，私下里竟然也会撒谎、算计，露出极其丑陋的一面。那一刻——
    options:
      - _score: 🔒 3
        label: 脑子发懵，拼命在心里替他找借口。（您其实并不是在保护他。您只是害怕一旦承认现实，您自己那点可怜的信仰就会随之崩塌罢了。）
      - _score: 🔒 2
        label: 像被泼了一盆冷水。（您总是喜欢把凡人推上神坛，然后等他们跌落时，再名正言顺地品尝这份额外的失望。）
      - _score: 🔒 1
        label: 心里发出一声冷笑。（如果认定所有人从根子上就是烂的，您就不需要再承担“去信任谁”的风险了，对吧？）
  - _index: 13
    _dim: 🔒 F2
    _type: 🔒 normal
    meta: ✏️ Q13 · 廉价的通宵
    text: 熬了好几个通宵的心血，被别人轻飘飘地一笔带过，甚至功劳都被抢走。面对这种屈辱，您——
    options:
      - _score: 🔒 1
        label: 强行自我开解：反正事情办成了，学到经验就好。（只要把自己降格成一个没有感情的工具，就不会感到痛了。真是高效的自我麻醉呢。）
      - _score: 🔒 2
        label: 表面笑着说没事，回过头在心里把对方千刀万剐。（所有的愤怒都只敢在安全的阴暗处发泄。因为您比谁都清楚，掀翻桌子的代价您根本支付不起。）
      - _score: 🔒 3
        label: 微笑着把成果全部交接，从此收起所有真心。（“真心不值钱”——这个道理，您用几个通宵就学会了。往后您交出去的，不过是没有温度的等价交换罢了。）
  - _index: 14
    _dim: 🔒 W3
    _type: 🔒 normal (weight)
    meta: ✏️ Q14 · 崩塌时刻的筹码
    text: 委屈像泥石流一样压下来，理智快要断线。把手里仅剩的 3 点筹码，全部分到下面这几种发泄方式上吧：
    options:
      - _score: 🔒 2
        label: 🔒 weight::2|1|0 (编码，勿动)
      - _score: 🔒 2
        label: 🔒 weight::2|0|1 (编码，勿动)
      - _score: 🔒 2
        label: 🔒 weight::1|2|0 (编码，勿动)
      - _score: 🔒 2
        label: 🔒 weight::0|2|1 (编码，勿动)
      - _score: 🔒 2
        label: 🔒 weight::1|0|2 (编码，勿动)
      - _score: 🔒 2
        label: 🔒 weight::0|1|2 (编码，勿动)
      - _score: 🔒 1
        label: 🔒 weight::1|1|1 (编码，勿动)
  - _index: 15
    _dim: 🔒 B2
    _type: 🔒 normal
    meta: ✏️ Q15 · 谈资与笑料
    text: 偶然间，您看到最亲近的朋友正在另一个群里，把您掏心掏肺倾诉的伤痛当成笑料讲给众人听。那一刻——
    options:
      - _score: 🔒 1
        label: 拼命催眠自己：她大概就是为了迎合气氛，嘴快无心。（在对方把刀插进您胸口的时候，您还要体贴地替她找借口。您的自我欺骗，真是可悲到让人叹息。）
      - _score: 🔒 2
        label: 血液抽干。一声不吭地退出她的世界，单方面切断联系。（连发火和对质的勇气都没有。您只能用这种近乎“假死”的沉默，来维持最后一点可怜的体面。）
      - _score: 🔒 3
        label: 把截图直接甩进群里，当众撕破脸，然后拉黑。（“既然我的真心被当成了垃圾，那大家就一起下地狱吧。”——您根本不在乎溅自己一身血，只要能看到对方惊慌失措的脸就够了。）
  - _index: 16
    _dim: 🔒 S3
    _type: 🔒 normal
    meta: ✏️ Q16 · 共犯的沉默
    text: 那个全班避之不及的同学默不作声地坐在您身旁。朋友嫌恶地拉了拉您的衣角：“走远点，别挨着她，沾上晦气。”您——
    options:
      - _score: 🔒 1
        label: 配合地露出嫌恶的表情，跟着朋友一起坐到远处。（通过踩低一个更弱小的人，来确认自己还留在安全的“圈子”里。您对这套肮脏的生存法则适应得很好。）
      - _score: 🔒 2
        label: 僵在座位上假装没听见，手心冒汗，什么也不敢做。（既不敢反抗朋友，也不想伤害那个同学。您这种两边都想讨好的软弱，最后只会把您自己逼疯。）
      - _score: 🔒 3
        label: 甩开朋友的手：“嫌晦气你自己滚。”然后继续坐在原地。（为了那点毫无用处的正义感，把自己也变成被孤立的靶子。您这种自我毁灭式的英雄主义，真是蠢得无药可救。）
  - _index: 17
    _dim: 🔒 S1
    _type: 🔒 normal
    meta: ✏️ Q17 · 虚荣的倒影
    text: 拿着糟糕的成绩单，听着父母长长地叹气：“我们这辈子真是白白辛苦了，你对得起我们吗？”您——
    options:
      - _score: 🔒 3
        label: 愧疚感瞬间淹没自己，赶忙道歉。（您对这种债务关系已经形成了条件反射。只要不断地透支自己去偿还，就能换来一点点被爱的错觉。）
      - _score: 🔒 2
        label: 像木桩一样低头挨骂，心底一片冰凉。（您早就看穿了这副名为“爱”的枷锁下，那赤裸裸的虚荣。所以您选择了冻结自己的心。）
      - _score: 🔒 1
        label: 心里涌起一种报复的痛快。（如果无论如何都无法满足他们的期待，那干脆就用毁灭来作为对这索取无度的反击吧。）
  - _index: 18
    _dim: 🔒 GATE
    _type: 🔒 gate
    meta: ✏️ Q18 · 悬崖边的决断
    text: 伪装已经被彻底剥离，站在这无声的悬崖边，风很冷吧？……没关系，您不需要一直站在那里。只要向我许下一个愿望，所有的重力都会消失。现在，告诉我您的渴望——
    options:
      - _score: 🔒 4
        _value: 🔒 destroy
        label: 【毁灭】既然这世界又脏又不公——不如借给我力量，把它连同我自己一起烧个干净吧。
      - _score: 🔒 4
        _value: 🔒 seen
        label: 【被看见】哪怕要用灵魂作为抵押，我也要撕开这世界的眼皮，让它看清楚我到底有多痛！
      - _score: 🔒 4
        _value: 🔒 peace
        label: 【平静】太累了。只要能让这些痛苦停止，哪怕就这样沉入安静的水底，我也愿意交换。
      - _score: 🔒 3
        _value: 🔒 undecided
        label: 【游离】我不知道……哪怕是坠落，我也没有想去的方向。请您来替我决定吧。
  - _index: 19
    _dim: 🔒 TRIGGER
    _type: 🔒 trigger
    meta: ✏️ Q19 · 恶魔的契约
    text: 迷雾中，走出一个满脸泪痕的小孩——是过去那个总是搞砸一切的您。她攥着一颗发光的石头递过来，小心翼翼地问：“如果还有一次重来的机会……你还愿意相信奇迹吗？”
    options:
      - _score: 🔒 3
        _value: 🔒 true
        _trigger: 🔒 SPECIAL_A
        label: 接过石头，紧紧攥进掌心。（“这一次，奇迹我会亲手去抢过来——哪怕代价是我最珍贵的东西。”）（触发特殊分支）
      - _score: 🔒 2
        _value: 🔒 false
        label: 摇摇头，推开她的手。（“现实可不是童话。那种轻飘飘的‘奇迹’，我早就戒掉了。”）
  - _index: 20
    _dim: 🔒 F2
    _type: 🔒 normal
    meta: ✏️ Q20 · 阴沟里的自卑
    text: 独自走在大街上，总觉得路人的目光有意无意地扫过自己。那种“大家都在看我笑话”的局促感，让您很难熬吧？面对这种无处遁形的错觉，您的第一反应是——
    options:
      - _score: 🔒 1
        label: 立刻把背挺直，假装在看手机，走得飞快。（明明慌得要命，还要装出大人的游刃有余。别担心，您藏得很好——好到连您自己都快信了呢。）
      - _score: 🔒 2
        label: 低下头，恨不得把脸埋进衣服里。（“我好奇怪、我穿得好土”——这种羞耻得想当场消失的念头，您到底还要在心里反刍多少次呢？）
      - _score: 🔒 3
        label: 在心里疯狂挑路人的刺，觉得他们才是一群蠢货。（靠着在心里贬低别人，来维持自己摇摇欲坠的自尊。您这种带毒的防卫机制，真是可悲得可爱。）
  - _index: 21
    _dim: 🔒 W2
    _type: 🔒 normal
    meta: ✏️ Q21 · 窒息的锁链
    text: 一个非常亲近的人，总是喜欢以“我这都是为了你好”为借口，强行插手、干预您的决定。面对这种令人窒息的控制欲，您——
    options:
      - _score: 🔒 1
        label: 感到挫败，但还是顺从地改掉了自己的习惯。（连呼吸的空间都被夺走了，却还是舍不得丢掉这份变态的“在乎”。您对被爱的渴望，真是饥不择食呢。）
      - _score: 🔒 3
        label: 忍到极点，冷冷地甩开对方的手：“我的事不用你管。”（既然察觉到了这是毒药，就毫不犹豫地打碎。哪怕代价是失去这段关系，您也绝不回头。）
      - _score: 🔒 2
        label: 阴阳怪气地刺回去，找出对方的痛点疯狂攻击。（想单方面控制您？那就互相伤害吧。您似乎并不抗拒和他们一起在泥潭里撕咬呢。）
  - _index: 22
    _dim: 🔒 F3
    _type: 🔒 normal (scale)
    meta: ✏️ Q22 · 终极的审判
    text: 陷入毫无退路的绝境时，您只能选一个：是“委屈自己，换取您在乎的人全身而退”，还是“就算毁掉一切，也绝不放开手里的东西”？
    options:
      - _score: 🔒 1
        _value: 🔒 SACRIFICE
        label: 把矛头对准自己。（“只要他能好好的，我怎么样都无所谓。”……多么纯粹又令人颤栗的觉悟啊。）【纯洁殉道】
      - _score: 🔒 3
        _value: 🔒 OBSESSION
        label: 死死抱住执念。（“哪怕大家一起完蛋，我也要拿到我想要的。”……就是这个，这才是能孕育出巨大魔力的贪婪。）【极黑独占】
  - _index: 23
    _dim: 🔒 F1
    _type: 🔒 normal
    meta: ✏️ Q23 · 隐秘的毒汁
    text: 听说那个处处压您一头、像天鹅一样完美的人，突然受到大挫，一蹶不振。听到消息的那一秒——
    options:
      - _score: 🔒 1
        label: 赶紧发去得体的安慰，掩盖自己的幸灾乐祸。（到了这个时候还在克制吗？其实，您完全可以更坦诚地享受这份额外的奖赏呢。）
      - _score: 🔒 2
        label: 暗爽了一秒，紧接着被罪恶感淹没。（在黑暗的快感和道德的审判之间痛苦挣扎。这份矛盾的撕扯，正是灵魂最美味的部分。）
      - _score: 🔒 3
        label: 爽，连呼吸都顺畅了。（“凭什么好运都是别人的？”……没错，把这种嫉妒和恶意释放出来吧，这并没有什么可耻的。）
  - _index: 24
    _dim: 🔒 B2
    _type: 🔒 normal
    meta: ✏️ Q24 · 被抛弃的抹布
    text: 曾经您热爱的圈子，在发现您失去利用价值后迅速将您当成了空气。面对这种落差——
    options:
      - _score: 🔒 1
        label: 硬着头皮继续打杂。（明明已经被抛弃了，却还在摇尾乞怜。如果您愿意和我结契，您就再也不用看这些人的脸色了哦。）
      - _score: 🔒 2
        label: 一声不吭地收拾东西离开。（把这种被背叛的刺痛深深埋进心里。等它溃烂、发酵，最后会孵化出什么样的怪物呢？）
      - _score: 🔒 3
        label: 脸上笑嘻嘻，心里判死刑。（微笑着给所有人刻下墓志铭。您这副随时准备将他们拉下水的眼神，真是棒极了。）
  - _index: 25
    _dim: 🔒 F3
    _type: 🔒 normal
    meta: ✏️ Q25 · 悬崖边的安魂曲
    text: 如果这辈子注定要在孤独与泥泞中跋涉。看着那个已经伤痕累累的自己，在这场审判的最后，您想留下的遗言是——
    options:
      - _score: 🔒 1
        label: “再咬牙撑一下吧，说不定明天就有奇迹了。”（哪怕是一场注定没有救赎的徒劳，您也依然要死死抓住那根名为希望的蜘蛛丝吗？）
      - _score: 🔒 2
        label: “辛苦了。以后我陪着你，咱们再也不看别人眼色了。”（把心门彻底焊死，切断与这个世界的所有连接。在这座只属于您的孤岛上，直到灵魂干涸。）
      - _score: 🔒 3
        label: “把这些痛全刻在骨头上。以后谁敢伤我们，就加倍咬回来！”（太精彩了。愤怒吧，憎恨吧，把这些绝望化作燎原的烈火。您已经准备好迎接降生了。）
  - _index: 26
    _dim: 🔒 W3
    _type: 🔒 normal
    meta: ✏️ Q26 · 签下这落魄的契约
    text: “看清楚了吧？这充满裂痕、被恐惧和欲望支配的模样……就是剥去伪装后，您最真实的灵魂。”审判官微笑着，仿佛洞悉一切的恶魔，将一份空白的契约推到您面前。“但我不讨厌这样的您哦。这个世界不要您，我要。那么现在，交出您的代价，收下这个奇迹吧。”
    options:
      - _score: 🔒 1
        label: 闭上眼，死死捂住耳朵不敢看。（“别过来……哪怕继续这么烂下去，我也绝不把灵魂交给你！”）【虚幻祷告】
      - _score: 🔒 2
        label: 一把推开契约，冷冷地看着他。（“别太傲慢了。我的绝望，我自己会背。轮不到你来施舍！”）【清醒接纳】
      - _score: 🔒 3
        label: 颤抖着伸出手，直视审判官的眼睛。（“只要能改变这一切……不管变成什么怪物，我都签。”）【彻底黑化】

