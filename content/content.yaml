      homura_devil:
        name: Homura Akemi
        slogan: Once someone matters, it is hard for you to step back.
        desc: You are not refusing closeness; you observe first. When someone becomes important, their concerns start to feel like your own. When things feel unstable, you tighten your boundaries and try to handle it yourself. Like Homura, your steadiness comes from a seriousness that is difficult to withdraw.
        keywords: careful,boundaries,action before words
      madoka_god:
        name: Madoka Kaname
        slogan: You often notice other people's needs first.
        desc: When the mood changes, you look for who is struggling and what you can do. Your care has real action behind it; the difficulty is that your own needs often move to the end of the line. Like Madoka, your gentleness is not passive.
        keywords: sensitive,caring,practical kindness
      sayaka_siren:
        name: Sayaka Miki
        slogan: Fairness and promises matter to you.
        desc: You take commitments seriously, and carelessness or favoritism can sting for a long time. When something goes wrong, you may blame yourself first, then turn disappointment into anger. Like Sayaka, you do not want to treat important relationships casually.
        keywords: principled,earnest,high standards
      kyoko_pragmatist:
        name: Kyoko Sakura
        slogan: Your care often arrives as practical judgment.
        desc: You consider whether something is realistic before you invest, and you avoid making promises merely for the mood. Once you truly care about someone, however, you help through concrete action. Like Kyoko, you leave room in words while remaining firm in deeds.
        keywords: pragmatic,boundaries,guarded warmth
      emma_truth:
        name: Emma
        slogan: You want to see things as they are.
        desc: You have difficulty letting things go with a vague answer. When a story does not add up or someone keeps avoiding the issue, you notice and want to ask more. Even when the truth is uncomfortable, you would rather know it before deciding what to do.
        keywords: truth-seeking,boundaries,honest with yourself
