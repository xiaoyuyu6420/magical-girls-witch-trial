    questions: |-
      { meta: "Q1 · A Wish in the Morning Light", text: "Morning light, and dust motes dancing in it. Another seemingly ordinary, quietly exhausting day is beginning. In that moment, the voice that rises in your heart is —", options: ["“Maybe something good will happen today.” (Still willing to believe that, in this day and age? I can't tell if it makes you naive, or strong.)", "“No disasters. Just let it pass safely.” (All you want is a quiet life. But don't you find that existence a little hollow?)", "“Weld the ‘I'm fine’ mask onto my face.” (After all, no one wants to see your mess. You know the rules so well.)"] },
      { meta: "Q2 · The Warmth of the Circle", text: "In the bustling classroom, someone takes your hand with a smile: “Come on, we can't do this without you.” Faced with this cheap social flattery, you —", options: ["Warmth floods your chest. You nod, hard. (Those three words—“being needed”—really do have you on a string, don't they?)", "You smile and agree, hollow inside. (Afraid that the day you're no longer useful, all this liveliness will have nothing to do with you?)", "You play along politely, watching from a cold distance. (Perfectly clear-eyed. A pity this plastic warmth scatters at the first gust of wind.)"] },
      { meta: "Q3 · An Umbrella in the Rain", text: "A rainy night. You see a withdrawn classmate stuck under the eaves, and you happen to have an umbrella. What do you do? —", options: ["Hand her the umbrella without a second thought. (A small favor—plus a taste of moral superiority. Feels nice, doesn't it?)", "Hesitate... then hand it over anyway. (Afraid of the trouble, yet insisting on playing the good person. Aren't you tired?)", "Hand over the umbrella—and quietly file the favor away. (A very practical calculation. Your umbrella was never free of charge.)"] },
      { meta: "Q4 · A Mission Entrusted", text: "An elder publicly lays a heavy duty on your shoulders, crowning you with flattery: “You're the one I trust most.” In that moment, what you really think is —", options: ["Straighten your back, silently steeling yourself. (Rather burn yourself out than fail. Such an obedient little honor student.)", "Shoulders like lead, smiling as you accept. (That one word—“trust”—has crushed the breath out of you, yet you can't spit out a single “no.”)", "Accept graciously, sneering inside. (You saw through it long ago, didn't you? Under all those high-sounding excuses is nothing but a mess for you to clean up.)"] },
      { meta: "Q5 · The Silent Compromise", text: "Your friends all clamor for a restaurant you despise. When someone casually asks your opinion, you —", options: ["Chime in at once: “I've been dying to try that place!” (To keep the mood, you stuff yourself back into the box of your own grievances. Old habit by now, isn't it?)", "“I'm easy.” (The words “I don't want to go” get swallowed back down. Going with the flow is always the safest.)", "Shrug: “Whatever.” (Sneering inside, aren't you? They only asked to be polite—no one actually cares whether you live or die.)"] },
      { meta: "Q6 · The Mirror's Transformation", text: "Late at night, facing the tired, ordinary self in the mirror—if you could truly gain some unreasonable magic, what you crave is —", options: ["The power to heal, so no one around you ever cries again. (You haven't even filled in the hole in yourself, and you're dreaming of saving the world?)", "To become absolutely perfect. (What you really want is to erase every bit of the inferiority that keeps your head down.)", "“Transparency.” (When you're tired, just vanish on the spot. Cowardly, yes—but for you, such a convenient excuse.)"] },
      { meta: "Q7 · Shadow Under the Spotlight", text: "Watching the radiant friend at center stage steal every gaze, you applaud quietly from the dark corner. What you're really thinking is —", options: ["Palms red from clapping, honestly proud of her. (Content to be the eternal supporting leaf. How unexpectedly magnanimous of you.)", "Clapping hard, palms gone cold. (Are you thinking... why is the one standing in the light never, ever you?)", "Watching, cold-eyed. (The glory is all theirs. The higher they climb, the louder the fall—you're hoping for exactly that, aren't you?)"] },
      { meta: "Q8 · Protection and Self", text: "Two pans of the scale: one holds “swallow the grievance, buy a hypocritical peace”; the other, “hold your bottom line, even if everyone loses face.” Which way do you push your chips?", options: ["Wrong myself, in exchange for a brief peace and warmth. [Pure sacrifice]", "Hold the line, even if it means everyone's cold stares and isolation. [Absolute obsession]"] },
      { meta: "Q9 · A Wound's Shelter", text: "Utterly wronged, completely broken down, curled up in a corner—what surfaces in your mind is —", options: ["I want someone to hold me. To hear “it's okay.” (Still waiting for a rescuer? Reality has proven it many times: your pain, to others, is merely an inconvenience.)", "Wipe the tears away, quickly. (Hide the wound and it stops bleeding, does it? You're just trading this “sensible” act for the mercy of not being stepped on.)", "Count on whom, exactly? Don't be stupid. (Push everyone away before they can abandon you. So this is how you guarantee your own absolute safety?)"] },
      { meta: "Q10 · Obedience Under Discipline", text: "Faced with unquestionable commands and arrangements from elders or superiors—a hundred unwillingnesses in your heart—your final response is —", options: ["Force yourself to believe “it's for my own good,” and accept it all. (Surrender the steering wheel of your life, and you'll never have to answer for failure. Such an easy way to live.)", "Outwardly docile, while building a wall inside your heart no one may enter. (You think keeping your defiance hidden counts as rebellion? They don't care about your soul—only that your behavior complies.)", "Overturn the table ten thousand times in your head—then do exactly as told the next day. (A hundred unwillingnesses, and not one “no” ever made it out of your mouth. Your rebellion only ever happens where no one can see.)"] },
      { meta: "Q11 · The Perfect, Flawless Lie", text: "When someone asks, with a show of concern, “How have you been lately?”—what comes out of your mouth is —", options: ["The standard smile: “Doing great!” (Flawless reflexes. You've grown so practiced at strangling your own distress signals in your throat.)", "An exaggerated, self-mocking tone, turning your misfortunes into a comedy routine. (Play the clown first, and no one can truly pity you. A superb shield for keeping people away.)", "A sigh, a half-spoken “...surviving, I guess.” (Tearing the wound open a crack, praying they'll ask more—yet terrified they might actually step in. Isn't this fishing for comfort a little pitiful?)"] },
      { meta: "Q12 · The Frost on Idealism", text: "You discover that the person you've deeply admired also lies, schemes, and shows an ugly side in private. In that moment —", options: ["Mind going blank, frantically making excuses for them. (You're not protecting them. You're just terrified that admitting reality would bring your own fragile faith crumbling down with it.)", "Doused in cold water. (You love setting mortals up on altars—so that when they fall, you can savor the extra disappointment with a clear conscience.)", "A single cold laugh inside. (If you decide everyone is rotten at the root, you never have to run the risk of trusting anyone again—right?)"] },
      { meta: "Q13 · Effort, Dismissed", text: "The work you poured all-nighters into gets brushed off in a single light sentence—the credit even taken by someone else. Faced with this humiliation, you —", options: ["Reason with yourself: it worked out, I learned something. (Degrade yourself into a feelingless tool, and it stops hurting. Highly efficient self-anesthesia.)", "Smile and say it's fine—then tear them apart a thousand times in your head. (All your rage is vented only in the safety of the dark. Because you know better than anyone: you can't afford the price of flipping the table.)", "Smile, hand everything over—and from then on, withdraw all sincerity. (“Sincerity is worthless”—a lesson a few sleepless nights taught you. Everything you hand over from now on is merely temperatureless exchange.)"] },
      { meta: "Q14 · Dividing the Last Chips", text: "Misunderstandings and pressure pile on one after another, and you're about to break. Divide the last 3 points of mental chips among the three ways of coping below:", options: ["weight::2|1|0", "weight::2|0|1", "weight::1|2|0", "weight::0|2|1", "weight::1|0|2", "weight::0|1|2", "weight::1|1|1"] },
      { meta: "Q15 · A Secret Made a Joke", text: "By chance, you see your closest friend in another group chat, offering the wounds you confided in tears as entertainment for everyone. In that moment —", options: ["Hypnotize yourself: she was just playing to the room, thoughtless. (Even with the knife already in your chest, you still considerately make excuses for her. Your self-deception is sigh-worthy.)", "The blood drains away. You silently walk out of her world, severing the connection one-sidedly. (No courage even for anger or confrontation. This near-death silence is all you have to keep your last shred of dignity.)", "Throw the screenshots straight into the chat, tear off the mask in public—then block her. (“Since my sincerity was treated as garbage, then let's all go to hell together.”—You don't care about the blood splashed on yourself; seeing the panic on her face is enough.)"] },
      { meta: "Q16 · The Silent Onlooker", text: "The classmate everyone avoids sits down beside you in silence. Your friend tugs your sleeve in disgust: “Move away—don't sit near her, you'll catch the bad luck.” You —", options: ["Put on a disgusted expression and move away with your friend. (Stomping someone weaker to confirm you're still inside the safe “circle.” You've adapted to this filthy survival rule beautifully.)", "Freeze in your seat, pretending not to hear, palms sweating, doing nothing. (Too afraid to defy your friend, unwilling to hurt the classmate. This softness that tries to please both sides will only drive you mad in the end.)", "Shake off your friend's hand: “If it disgusts you, YOU go.” And keep sitting there. (For that worthless sense of justice, you've made yourself the next target. This self-destructive heroism is hopelessly foolish.)"] },
      { meta: "Q17 · Blackmail in the Name of Love", text: "With a bad report card in hand, you listen to your parents' long sigh: “Our whole life's work, wasted. Are you even sorry?” You —", options: ["Drowned in guilt, apologizing at once. (A conditioned reflex to this debt relationship. Keep overdrawing yourself to repay it, and you can buy the illusion of being loved.)", "Standing there like a post, head down, heart gone cold. (You saw through long ago the naked vanity under this shackle called “love.” So you chose to freeze your heart.)", "A vengeful rush of pleasure. (If their expectations can never be met anyway, then destruction itself will be your counterattack against this endless extraction.)"] },
      { meta: "Q20 · The Inescapable Self-Doubt", text: "Walking down the street alone, you keep feeling strangers' eyes graze over you. That cramped feeling of “everyone's watching my joke”—hard to bear, isn't it? Faced with this inescapable illusion, your first reaction is —", options: ["Straighten your back at once, pretend to check your phone, walk fast. (Panicking inside, yet performing adult composure. Don't worry—you hide it well. So well you've almost fooled yourself.)", "Lower your head, wishing you could bury your face in your clothes. (“I look weird, I dress cheap”—how many more times will you chew over these shame-soaked thoughts?)", "Rip the strangers apart in your head: they're the idiots, all of them. (Keeping your crumbling self-esteem alive by belittling others. This poison defense mechanism is pitifully adorable.)"] },
      { meta: "Q21 · Love as Control", text: "Someone very close to you keeps using “it's for your own good” as a license to interfere with and control your decisions. Faced with this suffocating control, you —", options: ["Feel defeated—but obediently change your habits anyway. (Even your breathing room has been taken, yet you still can't bear to give up this twisted “care.” Your hunger to be loved will settle for anything.)", "At the limit of endurance, you coldly shake off their hand: “Stay out of my life.” (Having recognized the poison, you smash it without hesitation. Even at the cost of the relationship—you don't look back.)", "Stab back with barbed sarcasm, hunting their sore spots relentlessly. (Want to control me one-sidedly? Then let's hurt each other. You don't seem to mind tearing at each other in the mud.)"] },
      { meta: "Q22 · The Ultimate Price", text: "In a corner with no way out, you may choose only one: “wrong yourself, so the one you care about escapes unscathed,” or “destroy everything rather than let go of what's in your hands”?", options: ["Turn the blade on yourself. (“As long as he's all right, nothing about me matters.”... What a pure, shudder-inducing resolve.) [Pure martyrdom]", "Cling to the obsession. (“Even if we all go down together, I'll have what I want.”... Yes—this is the greed that births tremendous magic.) [Absolute obsession]"] },
      { meta: "Q23 · Hidden Malice and Envy", text: "You hear that the flawless person who always lorded over you has suffered a great fall and collapsed. In that instant, what sweet venom rises from the bottom of your heart? —", options: ["Hurry to send a tasteful condolence, covering up the gloating. (Still restraining yourself at a time like this? Honestly, you could enjoy this extra reward far more openly.)", "A second of dark delight, immediately drowned in guilt. (Torn apart between dark pleasure and moral judgment. This contradictory writhing is the most delicious part of a soul.)", "Delight. Even your breathing eases. (“Why do the good fortunes all belong to others?”... That's right—let the jealousy and malice out. There's nothing shameful in it.)"] },
      { meta: "Q24 · Discarded After Being Drained", text: "The circle you once loved, upon discovering you've lost your usefulness, promptly turns you into thin air. Faced with this gap—discarded like a used rag—you —", options: ["Grit your teeth and keep doing the chores. (Abandoned already, and still begging for scraps. If you contracted with me, you'd never have to see their faces again.)", "Silently pack your things and leave. (Bury this sting of betrayal deep inside. What kind of monster will it hatch, once it festers and ferments?)", "Smiling on the outside, pronouncing sentences within. (Carving epitaphs for them all with a smile. Those eyes of yours, ready to drag them underwater at any moment—magnificent.)"] },
      { meta: "Q25 · Farewell at the Cliff's Edge", text: "If this life is destined to be a trek through loneliness and mud—looking at that already-scarred self, at the end of this trial, the last words you want to leave are —", options: ["“Hold on a little longer. Maybe tomorrow there'll be a miracle.” (Even for a salvation-less, futile hope, you'd still cling to that spider-silk called hope?)", "“You've suffered enough. From now on I'm with you—we'll never read anyone's face again.” (Weld the door of your heart shut, cut every connection to this world. On this island of yours alone—until the soul runs dry.)", "“Carve every one of these pains into the bone. Whoever dares hurt us next, we bite back twice as hard!” (Wonderful. Rage. Hate. Turn this despair into a raging fire. You're ready to be born.)"] },
      { meta: "Q26 · The Final Verdict", text: "“See clearly now? This fissured thing, ruled by fear and desire... this is your truest soul, stripped of its disguise.” The judge smiles—like a demon who sees through everything—and slides a blank contract toward you. “But I don't dislike this you. The world doesn't want you; I do. So now: pay your price, and take this miracle.”", options: ["Close your eyes, cover your ears, refusing to look. (“Stay away... even if I stay this rotten forever, I will never give you my soul!”) [Vain prayer]", "Shove the contract away, watching him coldly. (“Don't be so arrogant. My despair is mine to carry. You don't get to dispense it as charity!”) [Sober acceptance]", "Reach out, trembling, meeting the judge's eyes. (“As long as it changes everything... whatever monster I become, I'll sign.”) [Complete corruption]"] },
    gate:
      meta: "Q18 · The Verdict at the Cliff's Edge"
      text: "The disguise has been stripped away entirely. You stand at the edge of this soundless cliff—the wind is cold, isn't it? ...It's all right. You don't have to keep standing there. Make one wish to me, and all gravity disappears. Now—tell me your desire."
      options: |-
        "[Destruction] This world is filthy and unjust—lend me the strength, and I'll burn it clean, myself included.",
        "[Be Seen] Even with my soul as collateral, I'll tear open this world's eyelids and make it see exactly how much I hurt!",
        "[Stillness] I'm so tired. If only the pain would stop, I'd gladly sink into that quiet water—whatever it takes.",
        "[Drifting] I don't know... even falling, I have no direction I want to go. Please—decide for me.",
        ]
    trigger:
      meta: "Q19 · The Devil's Contract"
      text: "Out of the mist walks a tear-streaked child—the you of the past, the one who always messed everything up. She holds out a glowing stone and asks, carefully: “If you could start over once more... would you still believe in miracles?”"
      options: |-
        "Take the stone and grip it tight in your palm. (“This time, I'll seize the miracle with my own hands—even if the price is the most precious thing I have.”) (Triggers a special branch)",
        "Shake your head and push her hand away. (“Reality isn't a fairy tale. That weightless thing called a ‘miracle’—I quit it long ago.”)",
        ]
    disclaimer:
      footer: A fan-made test, not affiliated with the original copyright holders · Results are for reference only
      result: Characters belong to their original creators · Results are for reference only
