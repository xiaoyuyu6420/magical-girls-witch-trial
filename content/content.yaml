    questions: |-
      { meta: "Q1 · 朝の光に込めた願い", text: "朝の光の中、埃が舞っている。平凡に見えて、ひどく疲れる一日がまた始まる。その瞬間、あなたの心に浮かぶ声は——", options: ["「今日は、いいことがあるかもしれない。」（このご時世にまだこんな言葉を信じられるなんて。無垢というか、強いというか。）", "「大きな騒ぎさえ起きなければ、平穏にやり過ごせればいい。」（安定を求めるだけ。ただ、そんな人生、少し退屈だとは思いませんか？）", "「『私は大丈夫』という顔を、顔に溶接しよう。」（誰もあなたの惨めな現場など見たくないですからね。よくわかっていらっしゃる。）"] },
      { meta: "Q2 · 小さな輪のぬくもり", text: "賑やかな教室で、誰かがあなたの手を取って笑う：「さあ、これはあなたがいないと始まらない」。こんな安っぽい社交辞令に対して、あなたは——", options: ["胸が温かくなる。強く頷く。（「必要とされる」という三文字に、簡単に操られるんですね。）", "笑顔で承諾するが、心は空っぽ。（利用価値を失った日、この賑やかさが自分と無関係になるのを、恐れているのでしょう？）", "礼儀正しく同調しつつ、冷ややかに眺める。（ずいぶん冷静ですね。ただ、こんなプラスチックの温もりは、風が吹けば散りますけれど。）"] },
      { meta: "Q3 · 雨夜の傘", text: "雨の夜。孤立しがちな同級生が軒下に閉じ込められているのに気づき、あなたの手にはちょうど傘がある。あなたは——", options: ["迷わず傘を差し出す。（小さな親切、ついでに道徳的優越感もひと味。悪くない気分でしょう？）", "少し迷って、それでも傘を差し出す。（面倒が怖いくせにいい人を演じる。疲れませんか？）", "傘を渡し、その貸しを心に記録しておく。（現実的な計算ですね。あなたの傘は、ただでは貸さない。）"] },
      { meta: "Q4 · 託された使命", text: "目上の人が皆の前で重任をあなたの肩に押しつけ、おだてて言う：「あなたに任せるのが一番安心」。その瞬間、あなたの本音は——", options: ["背筋を伸ばし、密かに闘志を燃やす。（禿げるまで頑張っても絶対に失敗しない、と。いい優等生ですね。）", "肩に鉛を流し込まれたように、笑って引き受ける。（あの「安心」という一言に息もできないほど押しつぶされながら、「ノー」の一言すら言えない。）", "礼儀正しく引き受け、心で冷笑する。（とうに見抜いているのでしょう？ りっぱな言い訳の山の下は、全部あなたが片付ける汚れ仕事。）"] },
      { meta: "Q5 · 無言の妥協", text: "友人たちがこぞって、あなたが大嫌いなレストランに行こうと騒いでいる。誰かが何気なくあなたの意見を聞いた時、あなたは——", options: ["即座に同調：「そこ超食べたかった！」（場を盛り下げないために、自分を悔しい殻に押し込む。とうに慣れたものでしょう。）", "「どこでもいいよ。」（「行きたくない」という一言は、やはり飲み込んだ。多数派に従うのが、いつだって一番安全。）", "肩をすくめて「適当で」。（心で冷笑しているのでしょう？ 形ばかりの質問で、あなたのことなんて誰も気にしていないのに。）"] },
      { meta: "Q6 · 鏡の中の変身", text: "深夜、鏡の中の疲れて平凡な自分を見つめて——もし道理の通らない魔法を本当に手に入れられるなら、あなたが渇望するのは——", options: ["すべてを癒し、周りの人をもう泣かせない。（自分の穴も埋まっていないのに、世界を救う妄想ですか？）", "絶対的に完璧になること。（頭を上げられなくさせる劣等感を、全部消し去りたいのでしょう。）", "「透明化」。（疲れたらその場で消える。逃避は恥ずかしいけれど、あなたには本当に使い勝手のいい言い訳。）"] },
      { meta: "Q7 · スポットライトの影", text: "舞台の中央で輝き、すべての視線を奪う友人を見つめ、暗い隅で静かに拍手するあなた。実際に思っているのは——", options: ["手のひらが赤くなるほど、心から彼女を誇る。（一生わき役を甘んじるなんて、意外とおおらかですね。）", "力強く拍手し、手のひらは冷たい。（考えているのは……光の中に立つのが、どうして永遠に自分じゃないのか、でしょう？）", "冷ややかに見つめる。（栄光は全部他人のもの。高いところに登るほど派手に落ちる——あなたはそう願ってもいるのでしょう？）"] },
      { meta: "Q8 · 守りと自分", text: "天秤の両端：片方は「悔しさを飲み込み、偽善的な体面を買う」、もう片方は「底線を死守し、誰の顔を潰そうと構わない」。あなたはどちらにチップを積みますか？", options: ["自分を曲げて、束の間の平和と温もりを買う。【純潔の犠牲】", "全員に孤立され冷たい目で見られても、底線を死守する。【漆黒の独占】"] },
      { meta: "Q9 · 傷ついた時の居場所", text: "極限まで悔しく、感情が完全に崩れた時、部屋の隅に丸まったあなたの頭に浮かぶのは——", options: ["誰かに抱きしめてほしい。「大丈夫だよ」と一言。（まだ誰かの救済を待っているのですか？ 現実は何度も証明済みでしょう——あなたの苦しみは、他人にとってただの面倒事。）", "すぐに涙を拭く。（傷を隠せば血は止まりますか？ この「いい子」で、踏まれないだけの慈悲を買っているだけ。）", "誰に期待するの？ バカなこと。（見捨てられる前に、先回りして全員を突き放す。それがあなたの絶対的な安全を保証する方法ですか？）"] },
      { meta: "Q10 · 服従という名の規範", text: "目上の人物の、反論を許さない命令や押しつけに対し、心には百個の嫌悪があるのに、あなたの最終的な反応は——", options: ["「私のためだ」と無理に信じ込み、すべて受け入れる。（考えるのをやめ、人生のハンドルを手放せば、失敗の責任を負う必要は永遠にない。楽な生き方ですね。）", "表面上は従順、心の中には誰も入れない高い壁を築く。（心に反抗を残せば反逆だと思っている？ 彼らはあなたの魂など気にしません。行動が従えばそれで十分。）", "頭の中で一万回テーブルをひっくり返し、翌日またきっちり従う。（百個の嫌悪がありながら、「ノー」の一言も口に出せない。あなたの反抗は、永遠に誰にも見えない頭の中でだけ。）"] },
      { meta: "Q11 · 完璧な嘘", text: "誰かに心配そうに「最近どうしてる？」と聞かれた時、口をついて出るのは——", options: ["標準の笑顔：「元気だよ！」（完璧な反射神経。自分の救難信号を喉の奥で絞め殺すことに、すっかり熟練していますね。）", "大げさな自嘲の口調で、自分の不運を笑い話にする。（先に自分をピエロにしてしまえば、誰にも本気で哀れまれない。人を遠ざける絶好の盾。）", "ため息をつき、言いかけたままの「なんとか生きてるよ」。（傷を少し裂いて、相手が追及してくれるのを祈る——でも本当に中に入ってこられるのは怖い。この探り合い、惨めだと思いませんか？）"] },
      { meta: "Q12 · 理想主義の霜", text: "深く敬愛していた人が、裏では嘘をつき、計算し、醜い一面を見せるのだと発見した。その瞬間——", options: ["頭が真っ白になり、必死に彼を擁護する。（彼を守っているのではない。現実を認めたら、自分の頼りない信仰まで一緒に崩れるのが怖いだけ。）", "冷水を浴びたよう。（凡人を神棚に上げておいて、落ちた時に、また一つ失望を味わうのがお好きなんですね。）", "心の中で一つ、冷笑。（全員が根っから腐っていると決めつければ、「誰かを信じる」リスクを負わずに済む——そうですよね？）"] },
      { meta: "Q13 · 軽く流された努力", text: "何晩も徹夜して作った心血を、誰かにあっさり一筆で流され、手柄まで奪われた。この屈辱に対して、あなたは——", options: ["無理やり自分を納得させる：まあ上手くいったし、経験になればいい。（自分を感情のない道具に格下げすれば、痛みも感じない。効率的な自己麻酔ですね。）", "表向きは笑って「大丈夫」、心の中で相手をずたずたに刻む。（怒りはすべて、安全な暗闇の中でだけ発散される。テーブルをひっくり返す代償など払えないことを、誰よりよくわかっているのでしょう。）", "笑顔で成果をすべて引き継ぎ、以後真心をしまう。（「真心なんてただ同然」——その道理を、いく晩かの徹夜で学んだんですね。これからあなたが差し出すものは、温度のない等価交換にすぎません。）"] },
      { meta: "Q14 · 崩壊の瞬間、残されたチップの配分", text: "誤解とプレッシャーが次々と押し寄せ、もう限界だ。手元に残ったたった 3 点の心のチップを、以下の三つの対処法に分けてください：", options: ["weight::2|1|0", "weight::2|0|1", "weight::1|2|0", "weight::0|2|1", "weight::1|0|2", "weight::0|1|2", "weight::1|1|1"] },
      { meta: "Q15 · 笑い話にされた秘密", text: "偶然、一番親しい友人が別のグループで、あなたが心を開いて打ち明けた傷を、皆への笑い話にしているのを見た。その瞬間——", options: ["必死に自分に言い聞かす：場の空気に合わせただけ、口が滑っただけ。（相手が刃を胸に突き立てた時でさえ、思いやりをもって言い訳してあげる。その自己欺瞞は、ため息が出るほど悲しい。）", "血の気が引く。黙って彼女の世界から退出し、一方的に縁を切る。（怒ることも対決することもできない。この「仮死」のような沈黙で、せめてもの体面を保つ精一杯。）", "スクリーンショットをチャットに投げつけ、衆人環視の前で絶交し、ブロックする。（「私の真心がゴミ扱いされるなら、みんなで地獄に落ちましょう」——自分に血が飛び散っても構わない。相手のうろたえた顔が見られればそれで十分。）"] },
      { meta: "Q16 · 無言の傍観", text: "クラス全員が避ける同級生が、黙ってあなたの隣に座った。友人が嫌悪顔で袖を引く：「離れて、あの子に近づいちゃダメ、縁起が悪い」。あなたは——", options: ["嫌悪の表情を作って、友人と一緒に離れて座る。（より弱い人を踏み下げることで、自分がまだ安全な「輪」にいることを確認する。この汚い生存法則、よく順応できていますね。）", "席で硬直し、聞こえないふり、手のひらに汗、何もできない。（友人に逆らえず、同級生も傷つけたくない。両方に取り入ろうとするその軟弱さは、最後に自分自身を追い詰めるだけ。）", "友人の手を振りほどく：「縁起が悪いならあんたが行け。」そしてその場に座り続ける。（あの役に立たない正義感のために、自分まで孤立の的になる。そんな自己破壊的な英雄主義、救いようのない愚かさですね。）"] },
      { meta: "Q17 · 愛という名の脅迫", text: "悪い成績表を手に、親の長いため息を聞く：「私たちは一生無駄に苦労した。私たちに申し訳ないと思わないの？」あなたは——", options: ["罪悪感に瞬時に飲み込まれ、慌てて謝る。（この債務関係には条件反射が出来上がっている。自分を払い続ければ、愛されている錯覚を少し買えるだけ。）", "棒立ちのままうつむいて怒鳴られ、心は氷のように冷たい。（「愛」という名の枷の下の、裸の虚栄をとうに見抜いている。だから心を凍らせた。）", "心に湧き上がる、復讐の痛快さ。（どうせ期待に応えられないなら、破壊こそが、この際限ない搾取への反撃にしてやる。）"] },
      { meta: "Q20 · 逃れられない劣等感", text: "一人で大通りを歩いていると、通行人の視線がちらちらと自分を掠めていく気がする。「皆が私の笑いものを見ている」という窮屈さ、つらいでしょう？ この逃れられない錯覚に対して、あなたの第一反応は——", options: ["すぐに背筋を伸ばし、スマホを見るふりをして、足早に歩く。（内心はパニックなのに、大人の余裕を装う。ご安心を——隠せていますよ。自分自身が信じかけるほど上手に。）", "頭を下げ、顔を服に埋めたいくらい。（「私って変、服がダサい」——恥ずかしくて消えたくなるこの想念、あと何回心の中で反芻するつもりですか？）", "心の中で通行人の粗探しをしまくり、連中こそ愚者の集まりだと思う。（他人を贬めることで、崩れ落ちる自尊心を支える。その毒入りの防衛機制、悲しいくらい可愛いですね。）"] },
      { meta: "Q21 · 支配という名の愛", text: "とても親しい人が「これ全部あなたのため」という口実で、あなたの決定にやたらと口を出し、干渉してくる。この窒息しそうな支配欲に対して、あなたは——", options: ["挫折感を覚えつつ、従順に自分の習慣を改める。（呼吸する空間まで奪われているのに、この歪んだ「気にかけてくれる」を手放せない。愛されたい渇望は、選り好みできないほど切実なんですね。）", "我慢の限界で、冷たく相手の手を振りほどく：「私のことに口を出さないで。」（毒だと気づいた以上、迷わず打ち砕く。関係を失う代償でも、振り向かない。）", "嫌味ったらしく刺し返し、相手の痛いところを探して攻撃しまくる。（一方的に支配したい？ なら共倒れしましょう。泥沼で噛みつき合うのも、悪くないと思っているようですね。）"] },
      { meta: "Q22 · 究極の代償", text: "逃げ道のない絶境に陥った時、選べるのは一つだけ：「自分を曲げて、大切な人を無傷で逃がす」か、「すべてを壊しても、手の中のものを絶対離さない」か？", options: ["矛先を自分に向ける。（「あの人が無事なら、私はどうなってもいい。」……なんと純粋で、震えるほどの覚悟でしょう。）【純潔の殉教】", "執念を死守する。（「みんな一緒に終わるとしても、欲しいものは手に入れる。」……そう、これこそ、巨大な魔力を孕む貪欲さ。）【漆黒の独占】"] },
      { meta: "Q23 · 秘めた悪意と嫉妬", text: "あなたの上にいつも君臨していた完璧な人が、突然の大挫折で立ち直れなくなったと聞いた。その一瞬、心の底から湧き上がる、なんと甘美な毒は——", options: ["さっそとかわいそうなお見舞いの言葉を送り、内心のほくそ笑みを隠す。（こんな時まで自制するんですか？ 正直、このご褒美はもっと素直に味わっていいんですよ。）", "一瞬スッとして、すぐ罪悪感に飲まれる。（暗い快感と道徳の審判の間で葛藤する。この矛盾の引き裂きこそ、魂の一番美味しい部分。）", "爽快、呼吸まで通る。（「なんでいい思いは全部他人のものなの？」……そう、この嫉妬と悪意を解き放て。恥じることなど何もない。）"] },
      { meta: "Q24 · 搾り取られた後の廃棄", text: "かつて熱中したサークルが、あなたの利用価値がなくなったと知るや、迅速にあなたを空気扱いにした。雑巾のように捨てられたこの落差に対して、あなたは——", options: ["顔を引きつらせて雑用を続ける。（もう捨てられたのに、まだ媚びを売る。私と契約してくれれば、二度とこんな人たちの顔色を見ずに済みますよ。）", "一言もなく荷物をまとめて去る。（この裏切りの痛みを心の奥深くに埋める。それが潰れて、発酵して、最後にどんな怪物を孵すのでしょうね？）", "表面上はニコニコ、心の中では死刑判決。（微笑みながら全員に墓碑銘を刻む。いつでも彼らを道連れに引きずり込めそうなその眼差し、実に素晴らしい。）"] },
      { meta: "Q25 · 崖っぷちでの別れ", text: "もしこの人生が、孤独と泥濘の中を歩き続けることが運命づけられているなら——傷だらけのその自分を見つめて、この審判の最後に残したい遺言は——", options: ["「もう少し歯を食いしばって。明日には奇跡があるかもしれない。」（救いのない徒労だとわかっていても、希望という名の蜘蛛の糸にしがみつき続けますか？）", "「お疲れさま。これからは私がついてる。もう誰の顔色も見なくていい。」（心の扉を完全に溶接し、この世界とのすべての繋がりを断つ。あなただけの孤島で、魂が干からびるまで。）", "「この痛みを全部骨に刻め。これから誰かが私たちを傷つけたら、倍にして咬み返せ！」（素晴らしい。怒れ、憎め、この絶望を燎原の烈火に変えろ。誕生を迎える準備はできています。）"] },
      { meta: "Q26 · 審判の最終確認", text: "「見えてきたでしょう？ この亀裂だらけの、恐怖と欲望に支配された姿……偽装を剥がした後の、あなたの最も真実の魂です。」審判官は微笑む。すべてを見通す悪魔のように、白紙の契約書をあなたの前に差し出す。「ですが、こんなあなたを嫌いではありませんよ。世界があなたを要らないなら、私が要る。さあ——代償を差し出して、この奇跡を受け取りなさい。」", options: ["目を閉じ、耳をきつく塞いで見ない。（「来ないで……このまま腐り続けても、魂だけは絶対に渡さない！」）【虚ろな祈り】", "契約を突き返し、冷ややかに彼を見る。（「傲慢になるな。私の絶望は、私が背負う。あんたに施される筋はない！」）【清醒な受容】", "震える手を伸ばし、審判官の目をまっすぐ見る。（「すべてを変えられるなら……どんな怪物になっても、私は署名する。」）【完全な黒化】"] },
    gate:
      meta: "Q18 · 崖っぷちの決断"
      text: "偽装は完全に剥がされました。音のない崖っぷちに立って、風が冷たいでしょう？ ……大丈夫、ずっとそこに立ち続ける必要はありません。私に一つ願いを捧げれば、すべての重力が消えます。さあ、あなたの渇望を教えて——"
      options: |-
        "【破壊線】この世界は汚くて不公——力を貸して、私ごと全部綺麗に燃やし尽くそう。",
        "【見てほしい線】魂を担保にしても、この世界の瞼を引き裂いて、私がどれほど痛いか見せつけてやる！",
        "【静寂線】疲れた。この痛みが止まるなら、静かな水底に沈んででも、喜んで交換する。",
        "【遊離線】分からない……落ちるとしたって、行きたい方向すらない。どうか、あなたが決めて。",
        ]
    trigger:
      meta: "Q19 · 悪魔の契約"
      text: "霧の中から、涙にまみれた子供が歩み出る——いつも失敗ばかりしていた、過去のあなた。光る石を握って差し出し、おずおずと尋ねます：「もし、もう一度やり直せるチャンスがあったら……あなたはまだ奇跡を信じる？」"
      options: |-
        "石を受け取り、掌に強く握り込む。（「今度こそ、奇跡はこの手で掴み取る——たとえ代償が私の一番大切なものでも。」）（特殊分岐を発動）",
        "首を振り、彼女の手を押し戻す。（「現実はおとぎ話じゃない。『奇跡』なんて軽いもの、とっくに断っている。）",
        ]
