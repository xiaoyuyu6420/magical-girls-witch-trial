    types:
      EMMA:
                name: "桜羽エマ"
                slogan: "「世界中の誰もが諦めても、私だけは諦めない」"
                desc: "あなたは生まれながらの信仰者です。誰もが救われるべきだと信じ、裏切られ、傷つけられ、世界中に誤解されても、それでも手を差し伸べ続けます。その優しさは天真無邪気なものではありません——代償を知った上で、それでも選び取った覚悟なのです。"
                keywords: "不滅の希望、絶対の信頼、自己犠牲"
      SHERRY:
                name: "橘シェリー"
                slogan: "「あなたのためなら、誰にでもなれる——たとえ悪人でも」"
                desc: "あなたは生まれながらの守護者で、温かく活力に満ち、皆にとっての太陽のような存在です。しかし、その守り方は極端へと走り——愛する者が脅かされた時、殺すことすら厭わなくなります。あなたの優しさと狂気の間には、たった一人の大切な人が隔てているだけなのです。"
                keywords: "致命的な無邪気さ、愛ゆえの狂気、陽の下の影"
      MIRIA:
                name: "佐伯ミリア"
                slogan: "「怖がらないで、お姉ちゃんが背負うから」"
                desc: "あなたは姉御肌の存在で、いつも黙って皆の世話を焼き、自分の痛みは笑顔の裏に隠しています。助けを求められる前に手を差し伸べ、生死の境では自ら命を代えることすら厭いません。あなたの優しさには棘があります——世界に対する最も頑固な善意なのです。"
                keywords: "声なき守護、命を代える覚悟、頑固な優しさ"
      HIRO:
                name: "二階堂ヒロ"
                slogan: "「千回死のうとも、彼女を連れ戻す」"
                desc: "あなたは氷と炎の矛盾体——外面は冷酷無情、内面は誰よりも熾烈な感情を燃やしています。容易く信頼はしませんが、一度認めた相手のためなら、火の海を越え、幾度も死を繰り返しても、一歩も退くことはありません。"
                keywords: "冷焔、死の遡行、愛する者のためならすべてを"
      NANOKA:
                name: "黒部ナノカ"
                slogan: "「仲間も温もりもいらない、必要なのは復讐だけ」"
                desc: "あなたは独り歩む孤狼で、すべての傷を棘で包み隠しています。あらゆる善意を拒絶します——過去が教えてくれたからです。近づく者は利用されるだけだと。あなたの復讐は情熱的なものではなく、冷徹で、精密で、孤独な執念なのです。"
                keywords: "孤狼の復讐、温もりの拒絶、精密な執念"
      HANNA:
                name: "遠野ハンナ"
                slogan: "「別にあんたのことなんてどうでも……バカ」"
                desc: "あなたは傲慢と辛辣で完璧な鎧を鋳造しましたが、その鎧の下には誰よりも柔らかい心が隠れています。直接善意を示すことはありません——枕元に人形をそっと置いたり、誰もいなくなってからこっそり病人の世話をしたりします。あなたの優しさは、あなたを理解できる者にしか見えません。"
                keywords: "ツンデレ、鎧の下の脆さ、不器用な優しさ"
      MERURU:
                name: "氷上メルル"
                slogan: "「ずっと待っていたの……長く、長く」"
                desc: "あなたは永遠の番人で、優しく思いやりのある外見の下に千年を超える孤独を秘めています。誰に対しても誠実に接しますが、真の目的は決して変わりません。無数の絆の誕生と崩壊を目撃しながらも、それでも信じることを選び続ける——その意志こそが最大の奇跡なのです。"
                keywords: "千年の守望、優しさの仮面、諦めない執念"
      COCO:
                name: "沢渡ココ"
                slogan: "「勘違いしないで、暇だから話しかけただけ」"
                desc: "あなたは毒舌配信者で、辛辣さと自己中心的さで心の寂しさを隠しています。いつも他人の無邪気さを嘲笑していますが、その口調には微かな温もりが宿っています。見捨てられることを恐れ、誰もが寄せ付けないようにしています——それでも、片隅からこっそり気にかけてしまうのです。"
                keywords: "毒舌の鎧、寂しさの芯、脆さへの拒絶"
      NOAH:
                name: "城崎ノア"
                slogan: "「この色……きれい、描いてみたい」"
                desc: "あなたは夢の中に生きる画家で、独特の世界観と常理に縛られない思考を持っています。悪意にほぼ免疫があります——理解できないからではなく、あなたの世界には憎しみより大切な美があるからです。あなたの純真は力であり、最も暗い監牢の中にあっても、光を創り出しています。"
                keywords: "純真なる創造、夢幻の画家、闇に抗う美"
      MARGO:
                name: "宝生マルゴ"
                slogan: "「気にしないで、ただの通りすがりだから」"
                desc: "あなたは漂泊の星で、誰もあなたの全貌を本当には見ることができません。時に棘があり、時に頼りがいがあり、決定的な瞬間に現れては日常では姿を消します。あなた独自の価値観と行動原理を持ち、誰の枠組みにも縛られません。あなたの神秘は仮面ではありません——あなたそのものが謎として生きているのです。"
                keywords: "神秘、独立の法則、決定的瞬間の援護"
      ANAN:
                name: "夏目アナン"
                slogan: "「あなただけは……私のそばから離れないで」"
                desc: "あなたは閉ざされた庭園の独占者で、対人恐怖の殻の下に極端な依存と嫉妬を隠しています。人混みを恐れながらも、特定の誰かに完全に受け入れられることを渇望しています。その渇望が脅かされた時、内なる闇が静かに、しかし致命的な形で暴発します。あなたの愛は牢獄——他人を閉じ込め、自分自身も閉じ込めているのです。"
                keywords: "独占欲、対人恐怖の闇、静かな危険"
      ALISA:
                name: "紫藤アリサ"
                slogan: "「御託はいい、ついてくればいい」"
                desc: "あなたは不良の外見に隠れた鉄の薔薇で、粗暴な振る舞いの下に不器用な正義感を秘めています。口では文句を言い続けながら、行動ではいつも真っ先に火の中に飛び込みます。容易く心を開きませんが、一度認めた相手のためなら、最も不器用な方法で守り抜きます。"
                keywords: "不良の正義、不器用な優しさ、行動派"
      LEIA:
                name: "蓮見レイア"
                slogan: "「私の目を見て——教えて、あなたの瞳に私は輝いている？」"
                desc: "あなたは生まれながらの指導者で、美しく自信に満ち、現れるだけですべての視線を集めます。しかしその光环の下には底なしの空虚があります——見られたい、認められたい、崇められたいのです。その渇望が満たされない時、再び舞台の中心に立つためなら何でもするでしょう。あなたの魅力は本物ですが、あなたの脆さもまた本物なのです。"
                keywords: "指導者の魅力、認められたい渇望、光环の下の空洞"
      UNSET:
                name: "未定の魂"
                slogan: "「審判の槌はまだ落ちていない、あなたの魂は定義されるのを待っている」"
                desc: "あなたの因子は分類できるほどには覚醒していません。すべての者の間を漂っているのか、あるいは本当の自分を意図的に隠しているのかもしれません。いずれにせよ、次の審判でお会いしましょう。"
                keywords: ""
      YUKI:
                name: "月代雪"
                subtitle: "大魔女"
                slogan: "「人間たちの悲劇は……すべて見てきた。だから、私が終わらせる」"
                desc: "あなたは百年を超える復讐者であり、最も幼くも最も強大な魔女です。かつてこの世界を心から愛し、親友の温もりに心を揺らされたこともありました。しかし、そのすべてを葬り去ることを選び、冷徹な理性で息が詰まるほど永い計画を実行しています。あなたの復讐は狂気ではありません——絶望の果ての、極限の覚醒なのです。"
                keywords: "百年の復讐、絶望の覚醒、氷冷の終焉"
      ETL:
                name: "不滅雪華"
                subtitle: "メルルの真の姿"
                slogan: "「世界が私を見捨てても、雪への愛は溶けない」"
                desc: "あなたは千年不滅の存在であり、「雪」への信仰によって不老不死を獲得しました。無数の少女の誕生と死を見届け、幾度もの裏切りと絶望を目撃しながらも、あの日去っていったあの人を探すことを決して諦めませんでした。あなたの執念は執着ではありません——愛に対する最も純粋な応えなのです。"
                keywords: "千年の不滅、純粋なる信仰、永遠の守望"
      MADOKA:
                name: "鹿目まどか"
                subtitle: "いつか神になる少女"
                slogan: "「誰にも泣いてほしくない——たとえ自分が存在しなくなっても」"
                desc: "あなたは生まれながらの信仰者——無垢に近い優しさで、誰かの痛みを見ると目を背けられない。見知らぬ人を信じ、自分を傷つけた者を許し、会ったこともない人の運命を背負おうとする。その優しさは弱さではない。世界の残酷さを知った上で、それでも手を差し伸べる決意だ。皆が絶望するとき、あなただけは「きっと方法はある」と言える人——たとえ代償が自分の存在を消し去ることでも。"
                keywords: "不滅の善意、すべてを救う神、無垢な信仰"
      HOMURA:
                name: "暁美ほむら"
                subtitle: "時間の掠奪者"
                slogan: "「世界を千回やり直しても、たった一人の彼女の笑顔だけは守り抜く」"
                desc: "あなたは氷と執念の矛盾体——外見は人情的でないほど冷たく、内側では誰よりも激しい執着が燃えている。全ての輪廻、全ての失敗、彼女を救えなかった瞬間を覚えている。他人を信じない。誰もリセットされた時間を共に歩いてくれなかったから。運命を許せない。運命は一度も手加減してくれなかったから。あなたの優しさはたった一人にだけ向かい、その一人への愛は、世界全体を敵に回すに足る。"
                keywords: "千回の輪廻、冷たい炎の執念、一人のために世界と敵対"
      SAYAKA:
                name: "美樹さやか"
                subtitle: "正義の末路"
                slogan: "「正しい人になりたかっただけなのに、なぜ最後は怪物になったんだろう」"
                desc: "あなたは自分の正義感で灰になるまで燃え尽きる人——不義を一秒も許せず、傷ついた人のために立ち上がり、想い人を癒やしたいと願いながら、それを伝えられない。だがこの世界は純粋な善人に報いない：信じた人に秘密を裏切られ、救った人に存在を忘れられ、信じた正義は残酷な現実の前で少しずつ砕けていく。あなたの崩壊は弱さではない——強く優しすぎた反動の傷だ。魔女化は堕落ではなく、出口を見つけられなかった正義の悲鳴。"
                keywords: "正義の崩壊、報われない愛、魔女化の悲鳴"
      KYOKO:
                name: "佐倉杏子"
                subtitle: "末路のサバイバー"
                slogan: "「バカなこと言うなよ。この世界で他人のためだけに願う奴は長く生きられない」"
                desc: "あなたは現実に殻を固くされた現実主義者——かつては他人のための犠牲が神聖だと信じていた。その願いが家族を壊すまで。それからあなたは自分を優先することを覚え、他人の悲劇を冷めた目で見ることを覚え、「俺の関係ない」で近づく心を全部遮ることを覚えた。でも自分は騙せない：本当に大事な人が窮地に陥れば、やはり飛び込んでいく。硬さは鎧で、柔らかさが地の色——ただ、もう簡単には差し出せないだけだ。"
                keywords: "現実主義の鎧、家庭の傷、土壇場の真心"
      MAMI:
                name: "巴マミ"
                subtitle: "孤独な先輩"
                slogan: "「魔法少女をやってきた長い間、実は……ずっと怖かったんだ」"
                desc: "あなたは優雅な鎧の下に深淵を隠す人——後輩の前ではいつも泰然とした先輩で、紅茶を淹れ、リボンを結び、最も美しい所作で魔女を倒す。けれど誰も知らない：何年一人で戦ってきたか、毎晩「次こそ帰ってこられないかもしれない」と怖がっていることを。あなたは仲間を渇望し、必要とされることを渇望し、誰かに「頼れる先輩」の仮面を外させてほしいと願っている。誰かがようやく近づいてきたら、あなたはぎゅっと掴んで離さない——あまりに孤独で、脆さを優雅の奥に隠すほうを選ぶほどに。"
                keywords: "優雅な鎧、深い孤独、必要とされたい渇望"
      homura_devil:
                name: "暁美ほむら"
                slogan: "大切だと思った人から、簡単には引けない。"
                desc: "人を遠ざけているわけではなく、近づく前にまずよく見ています。大切な人ができると、その人の問題まで自分事に感じてしまう。不安なときは境界を引き、まず自分で処理しようとする。ほむらに似ているのは、簡単には引き戻せない真剣さです。"
                keywords: "慎重,境界,言葉より行動"
      madoka_god:
                name: "鹿目まどか"
                slogan: "あなたはまず相手の必要に気づく。"
                desc: "空気が変わると、誰が困っているかを探し、自分に何ができるかを考えます。世話焼きには行動力があるのに、自分の必要は後回しになりがちです。まどかに似ているのは、優しさが態度だけではなく実行を伴うことです。"
                keywords: "感受性,思いやり,行動力"
      sayaka_siren:
                name: "美樹さやか"
                slogan: "公平や約束に敏感です。"
                desc: "約束は本気にします。いい加減な扱いやえこひいきは、人より長く心に残ります。うまくいかないとき、まず自分を責めてから失望を怒りに変えることもある。さやかに似ているのは、大事な関係を「まあいいか」で済ませたくない気持ちです。"
                keywords: "原則,真面目,自我要求"
      kyoko_pragmatist:
                name: "佐倉杏子"
                slogan: "気にかける気持ちは、現実的な判断に包まれる。"
                desc: "まず現実的に可能かを考えてから関わります。空気だけで約束は作りません。それでも本当に大切な人には、具体的な行動で手を貸します。杏子に似ているのは、口では余地を残しながら、事態からは簡単に退かない強さです。"
                keywords: "現実的,境界,不器用な優しさ"
      emma_truth:
                name: "桜羽エマ"
                slogan: "物事をあるままの形で知りたい。"
                desc: "曖昧な「まあいいか」では済ませられません。話が合わないとき、関係が避けられているとき、あなたは気づき、さらに問いかけます。答えが心地悪くても、まず事実を知ってから次を決めたいタイプです。"
                keywords: "求真,境界,自己欺瞞しない"
    questions: |-
      [
