_meta:
  说明: 这是文案权威源。别的 Agent 在这里填文案，然后跑 `pnpm exec tsx scripts/sync-content.ts` 同步到项目。
  规则:
    - 标 🔒 的字段是结构字段（dim/type/score/value/trigger/vector 等），绝对不能改——改了会破坏评分算法
    - 标 ✏️ 的字段是文案字段（text/label/slogan/desc/keywords/meta），在这里填
    - 四语言：zh-CN 是中文权威源，en/ja/zh-TW 是翻译
    - "题库 26 题：1-12 正向 / 13-17 反向 / 18 门控 / 19 触发 / 20-26 反向；第 8/22 是天平题(2选项) / 第 14 是砝码题(7选项 weight:: 编码 🔒)"
    - 改完后跑 sync，项目 http://localhost:3010 立即生效
questions:
  - _index: 1
    _dim: 🔒 W2
    _type: 🔒 normal
    meta: ✏️ Q1 · 晨光中的虚妄
    text: 清晨，微尘在阳光里起舞。今天又是令人作呕的一天，在那一刻，您心底浮现的声音是——
    options:
      - _score: 🔒 1
        label: “今天，也许会有好事发生吧。”（这年头还信这个，也挺难得的。）
      - _score: 🔒 2
        label: “不出大乱子，平平安安混过去就好。”（求个稳呗。就是有点无聊。）
      - _score: 🔒 3
        label: “把‘我很好’焊在脸上吧。”（毕竟没人想看你的烂摊子。）
  - _index: 2
    _dim: 🔒 B1
    _type: 🔒 normal
    meta: ✏️ Q2 · 塑料的温热
    text: 热闹的教室里，有人拉着您的手笑着说：“来吧，这件事少了你可不行”。面对这种廉价的社交辞令，您——
    options:
      - _score: 🔒 3
        label: 心里一阵回暖。用力点头。（“被需要”这三个字真好骗。）
      - _score: 🔒 2
        label: 笑着答应，心底却发虚。（怕哪天没用了，热闹就跟你没关系了。）
      - _score: 🔒 1
        label: 礼貌附和，冷眼旁观。（挺清醒。可惜这种塑料感情，一碰就断。）
  - _index: 3
    _dim: 🔒 B3
    _type: 🔒 normal
    meta: ✏️ Q3 · 施舍的伞檐
    text: 雨夜，您看到一个孤僻的同学被困在屋檐下，而您手里恰好有伞。您会做些什么？——
    options:
      - _score: 🔒 3
        label: 毫不犹豫地递过伞。（帮个小忙，顺便爽一把道德优越感。）
      - _score: 🔒 2
        label: 犹豫了一下还是开口了。（怕麻烦还硬当好人，你不累啊？）
      - _score: 🔒 1
        label: 递过伞，并把这笔人情记在心里。（挺现实的。这伞可不是白给的。）
  - _index: 4
    _dim: 🔒 S2
    _type: 🔒 normal
    meta: ✏️ Q4 · 沉重的皇冠
    text: 长辈当众把重任压在您肩上，嘴上说着给您戴高帽：“交给您最放心。”那一刻，您的真实想法是——
    options:
      - _score: 🔒 3
        label: 挺直背脊，暗暗较劲。（宁可熬秃也绝不搞砸，真是条听话的好狗。）
      - _score: 🔒 2
        label: 肩膀像灌了铅，笑着应下。（被那句“放心”压得喘不过气，还不敢说不。）
      - _score: 🔒 1
        label: 客气应承，心里冷笑。（看透了吧，这堆烂摊子全是你的。）
  - _index: 5
    _dim: 🔒 W1
    _type: 🔒 normal
    meta: ✏️ Q5 · 无声的妥协
    text: 朋友们一致嚷嚷着要去一家您厌恶至极的餐厅。当有人顺嘴问起您的意见时，您——
    options:
      - _score: 🔒 3
        label: 立刻附和：“我也超想吃那家！”（扫兴多没意思——把自己塞回套子里，你早就习惯了吧。）
      - _score: 🔒 2
        label: “我都行啊。”（“我不想去”还是咽回去了。随大流最安全。）
      - _score: 🔒 1
        label: 耸耸肩说“随便吧”。（心里冷笑：他们就是装模作样问问，谁在意你啊。）
  - _index: 6
    _dim: 🔒 S2
    _type: 🔒 normal
    meta: ✏️ Q6 · 镜中的妄想
    text: 深夜看着镜子里疲惫又平凡的自己，如果真能获得某种不讲道理的魔法，您渴望的是——
    options:
      - _score: 🔒 1
        label: 治愈一切，让身边的人都不再流泪。（自己的窟窿都没填上，还想拯救世界？）
      - _score: 🔒 3
        label: 变得绝对完美。（把那些让你抬不起头的东西，全抹掉。）
      - _score: 🔒 2
        label: “透明化”。（累了就原地消失，谁也找不到。逃避可耻，但真好用。）
  - _index: 7
    _dim: 🔒 F1
    _type: 🔒 normal
    meta: ✏️ Q7 · 聚光灯外的阴沟
    text: 看着舞台中央那个光彩照人、夺走所有视线的朋友，站在阴暗角落里默默鼓掌的您，其实在想——
    options:
      - _score: 🔒 1
        label: 手掌拍得发红，真心为她自豪。（甘心当一辈子绿叶，你可真大度。）
      - _score: 🔒 2
        label: 用力鼓掌，掌心发凉。（为什么站在光里的，永远不是你？）
      - _score: 🔒 3
        label: 冷冷地看着。（风光呗。站得越高，摔得越响。）
  - _index: 8
    _dim: 🔒 B3
    _type: 🔒 normal (scale)
    meta: ✏️ Q8 · 守护与自我
    text: 天平两端：一端是“咽下委屈，换取虚伪的体面”，另一端是“死守底线，哪怕让所有人下不来台”。您要把筹码推向哪边？
    options:
      - _score: 🔒 3
        _value: 🔒 SACRIFICE
        label: 委屈自己，换取短暂的和平与温暖。【纯洁牺牲倾向】
      - _score: 🔒 1
        _value: 🔒 OBSESSION
        label: 死守底线，哪怕被所有人孤立和冷眼。【极黑独占/自存倾向】
  - _index: 9
    _dim: 🔒 B1
    _type: 🔒 normal
    meta: ✏️ Q9 · 破碎时的摇尾
    text: 极度委屈、情绪彻底崩溃的时候，蜷缩在角落里的您，脑子里冒出的可笑念头是——
    options:
      - _score: 🔒 3
        label: 好想被人抱一下。听一句“没事的”。（还指望有人来救你？真不长记性。）
      - _score: 🔒 2
        label: 赶紧把眼泪擦干。（哭完还得自己扛，软弱这东西露一次就够了。）
      - _score: 🔒 1
        label: 指望谁呢？别傻了。（反正以前没人，现在也不会有。）
  - _index: 10
    _dim: 🔒 S1
    _type: 🔒 normal
    meta: ✏️ Q10 · 提线木偶的顺从
    text: 面对长辈不容置疑的命令和安排，明明心里有一百个不愿意，可您最终——
    options:
      - _score: 🔒 3
        label: 催眠自己“他们是为我好”，按着铺好的路走。（连个不字都不敢说，那就乖一辈子吧。）
      - _score: 🔒 2
        label: 明面上乖乖点头，暗地里藏起一点真心。（只敢在没人看见的地方，留一点自己。）
      - _score: 🔒 1
        label: 在脑子里掀了一万次桌子，第二天还是没骨气地照做了。（自尊？就这？）
  - _index: 11
    _dim: 🔒 W1
    _type: 🔒 normal
    meta: ✏️ Q11 · 完美无瑕的谎言
    text: 当别人貌似关心地问起“您最近过得好吗”时，您脱口而出的是——
    options:
      - _score: 🔒 3
        label: 挂上标准微笑：“挺好的呀！”（大家那么忙，想听的不就是这句废话。）
      - _score: 🔒 2
        label: 打个哈哈随便扯开话题。（自己那堆烂情绪，就别拿出来恶心人了。）
      - _score: 🔒 1
        label: 淡淡回一句“老样子”。（委屈都到嘴边了，又窝囊地咽了回去。）
  - _index: 12
    _dim: 🔒 S3
    _type: 🔒 normal
    meta: ✏️ Q12 · 偶像的崩塌
    text: 发现您一直极度敬佩的人，私下里竟然也会撒谎、算计、露出极其丑陋的一面。那一刻——
    options:
      - _score: 🔒 3
        label: 脑子发懵，拼命在心里替他找借口。（连现实都不敢看，还躲在滤镜里。）
      - _score: 🔒 2
        label: 像被泼了一盆冷水。（叹口气：原来都是俗人。你的信仰可真便宜。）
      - _score: 🔒 1
        label: 心里发出一声冷笑。（哪有什么干净人，装得越像，烂得越深。）
  - _index: 13
    _dim: 🔒 F2
    _type: 🔒 normal
    meta: ✏️ Q13 · 廉价的通宵
    text: 熬了好几个通宵的心血，被别人轻飘飘地一笔带过，甚至功劳都被抢走。面对这种屈辱，您——
    options:
      - _score: 🔒 1
        label: 强行自我开解：事情办成了就行。（硬把自己洗脑成工具人，真了不起。）
      - _score: 🔒 2
        label: 指甲深深抠进掌心。（熬的夜有多累，这口气就有多堵——可除了咽下去，你还能怎样。）
      - _score: 🔒 3
        label: 眼神冷下来。（真心不值钱是吧？那以后大家都只配看到你的敷衍。）
  - _index: 14
    _dim: 🔒 W3
    _type: 🔒 normal (weight)
    meta: ✏️ Q14 · 崩塌时刻的筹码
    text: 委屈像泥石流一样压下来，理智快要断线。把手里仅剩的 3 点筹码，全部分到下面这几种发泄方式上吧：
    options:
      - _score: 🔒 2
        label: 🔒 weight::2|1|0 (编码，勿动)
      - _score: 🔒 2
        label: 🔒 weight::2|0|1 (编码，勿动)
      - _score: 🔒 2
        label: 🔒 weight::1|2|0 (编码，勿动)
      - _score: 🔒 2
        label: 🔒 weight::0|2|1 (编码，勿动)
      - _score: 🔒 2
        label: 🔒 weight::1|0|2 (编码，勿动)
      - _score: 🔒 2
        label: 🔒 weight::0|1|2 (编码，勿动)
      - _score: 🔒 1
        label: 🔒 weight::1|1|1 (编码，勿动)
  - _index: 15
    _dim: 🔒 B2
    _type: 🔒 normal
    meta: ✏️ Q15 · 谈资与笑料
    text: 偶然间，您看到最亲近的朋友正在另一个群里，把您掏心掏肺倾诉的伤痛当成笑料讲给众人听。那一刻——
    options:
      - _score: 🔒 1
        label: 拼命催眠自己：她大概就是嘴快无心。（脸都被人踩地上了，还替人家找借口？）
      - _score: 🔒 2
        label: 血液抽干。默默把她移出特别关心。（连对质的勇气都没有，只能灰溜溜退场。）
      - _score: 🔒 3
        label: 冷静截图留存，心门彻底锁死。（原来你是这种人。行，往后对你，真心清零。）
  - _index: 16
    _dim: 🔒 S3
    _type: 🔒 normal
    meta: ✏️ Q16 · 共犯的沉默
    text: 那个全班避之不及的同学默不作声地坐在您身旁。朋友拉您走开：“别挨着她，沾上晦气。”您——
    options:
      - _score: 🔒 1
        label: 顺势走开，在心里替自己辩解。（“孤立她的又不是我”——完美的伪善发言。）
      - _score: 🔒 2
        label: 胃里阵阵痉挛，但还是低头说了句“我先走了”。（你心里清楚得很：这种时候，你也是帮凶。）
      - _score: 🔒 3
        label: 嫌恶地把椅子挪开。（可怜之人必有可恨之处。混成这样，能怪谁？）
  - _index: 17
    _dim: 🔒 S1
    _type: 🔒 normal
    meta: ✏️ Q17 · 虚荣的倒影
    text: 拿着糟糕的成绩单，听着父母长长地叹气：“我们这辈子真是白白辛苦了，你对得起我们吗？”您——
    options:
      - _score: 🔒 3
        label: 愧疚感瞬间淹没自己，赶忙道歉。（被这种话术拿捏死，你这辈子都是提款机。）
      - _score: 🔒 2
        label: 像木桩一样低头挨骂，心底一片冰凉。（他们爱的只是那张能炫耀的纸，不是你。）
      - _score: 🔒 1
        label: 心里涌起一种报复的痛快。（行，不满意？你们只管面子是吧——那我就烂给你们看！）
  - _index: 18
    _dim: 🔒 GATE
    _type: 🔒 gate
    meta: ✏️ Q18 · 悬崖边的决断
    text: 伪装被撕碎，现实的寒气刺骨。站在这无声的悬崖边，您最后想做的是——
    options:
      - _score: 🔒 4
        _value: 🔒 destroy
        label: 【毁灭】既然这世界又脏又不公，怎么洗都洗不干净——那就掀翻它，大家一起死吧。
      - _score: 🔒 4
        _value: 🔒 seen
        label: 【被看见】哪怕头破血流、粉身碎骨，我也要撕开这世界的眼皮，让它看清楚我到底有多痛！
      - _score: 🔒 4
        _value: 🔒 peace
        label: 【平静】太累了，不想再挣扎了。把所有的痛楚都咽下去，就让我一个人安静地沉入水底吧。
      - _score: 🔒 3
        _value: 🔒 undecided
        label: 【游离】我不知道……我什么都抓不住。就像一粒灰尘，连该坠落去哪里都不知道。
  - _index: 19
    _dim: 🔒 TRIGGER
    _type: 🔒 trigger
    meta: ✏️ Q19 · 恶魔的契约
    text: 迷雾散去，走出一个满脸泪痕的小孩——是过去那个软弱的您。她伸出手地向您递出一把生锈的钥匙：“你还愿意相信奇迹吗？”
    options:
      - _score: 🔒 3
        _value: 🔒 true
        _trigger: 🔒 SPECIAL_A
        label: 一把抢过那把沾血的钥匙，死死攥紧。（奇迹？那种东西，我会用这双手亲手去抢过来！）（触发特殊分支）
      - _score: 🔒 2
        _value: 🔒 false
        label: 冷酷地俯视着她，转身走入迷雾。（现实可不是过家家，那种天真的东西，早就坏掉了。）
  - _index: 20
    _dim: 🔒 F2
    _type: 🔒 normal
    meta: ✏️ Q20 · 阴沟里的自卑
    text: 独自走在大街上，总感觉路人的目光有意无意地扫过自己。您身体的第一反应，却诚实地出卖了您——
    options:
      - _score: 🔒 1
        label: 立刻把背挺直，走路带风。（心里虚得要死，面上还要装大佬，真够滑稽。）
      - _score: 🔒 2
        label: 后背发凉，手心出汗。（“我好差劲、穿得好土”——羞耻得想当场消失。）
      - _score: 🔒 3
        label: 在心里疯狂挑路人的刺。（靠贬低别人，你那点可怜的自尊就舒服了？）
  - _index: 21
    _dim: 🔒 W2
    _type: 🔒 normal
    meta: ✏️ Q21 · 窒息的锁链
    text: 伴侣挑剔您的穿着和社交，并把“我这都是为了你好”挂在嘴边。面对这种控制欲——
    options:
      - _score: 🔒 1
        label: 感到挫败，但还是笨拙地照改。（“他管我说明他在乎我”——这脑子你是不想要了吗。）
      - _score: 🔒 3
        label: 累到极点，冷静地说一句“别管我”。（哪怕知道会毁掉一切，你也受够这“为你好”的锁链了。）
      - _score: 🔒 2
        label: 毫不客气地反唇相讥。（那就挑他的发际线和收入呗。想单方面PUA我？要折磨一起折磨。）
  - _index: 22
    _dim: 🔒 F3
    _type: 🔒 normal (scale)
    meta: ✏️ Q22 · 终极的审判
    text: 镰刀已经架在脖子上了，您只能选一个：是“献祭您自己，换您在乎的人一生顺遂”，还是“就算拉着整个世界陪葬，也绝不妥协”？
    options:
      - _score: 🔒 1
        _value: 🔒 SACRIFICE
        label: 把刀尖对准自己。（只要他活在光里，我下地狱也行。纯粹到令人反胃的牺牲。）【纯洁殉道】
      - _score: 🔒 3
        _value: 🔒 OBSESSION
        label: 死死抱住执念。（哪怕全世界都没了，我也不放手——这才是你本来的样子。）【极黑独占】
  - _index: 23
    _dim: 🔒 F1
    _type: 🔒 normal
    meta: ✏️ Q23 · 隐秘的毒汁
    text: 听说那个处处压您一头、像天鹅一样完美的人，突然受到大挫，一蹶不振。听到消息的那一秒——
    options:
      - _score: 🔒 1
        label: 痛骂自己幸灾乐祸，赶紧发去得体的安慰。（连自己那点小心思都不敢认，虚伪。）
      - _score: 🔒 2
        label: 暗爽了一秒，紧接着被罪恶感淹没。（在“恶毒”和“道德”之间来回拉扯，不累吗。）
      - _score: 🔒 3
        label: 爽，太爽了，连呼吸都顺畅了。（凭什么好处都让你占了？可算轮到你栽了。）
  - _index: 24
    _dim: 🔒 B2
    _type: 🔒 normal
    meta: ✏️ Q24 · 被抛弃的抹布
    text: 曾经您热爱的圈子，在发现您失去利用价值后迅速将您当成了空气。面对这种落差——
    options:
      - _score: 🔒 1
        label: 硬着头皮继续打杂。（还骗自己“大家只是太忙”。狗被踢了都会叫唤，你倒好，只会摇尾巴。）
      - _score: 🔒 2
        label: 一声不吭地收拾东西离开。（被用完就扔，这滋味应该刻进骨头了吧。）
      - _score: 🔒 3
        label: 脸上笑嘻嘻，心里判死刑。（再找我帮忙？抱歉，我很“忙”。有点意思。）
  - _index: 25
    _dim: 🔒 F3
    _type: 🔒 normal
    meta: ✏️ Q25 · 悬崖边的安魂曲
    text: 如果这辈子注定孤独。看着那个一路满身泥泞的自己，您最后的一句遗言是——
    options:
      - _score: 🔒 1
        label: “再咬牙撑一下吧，说不定明天就有太阳了。”（即便您自己说这话时，都觉得荒谬得想笑。）
