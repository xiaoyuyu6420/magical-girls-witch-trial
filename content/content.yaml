    _source: "witch-trial"
    slogan: "「少废话，跟上就是了」"
    desc: "你是不良外表下的铁蔷薇，粗鲁的言行掩盖着笨拙的正义感。你嘴上抱怨个不停，行动上却总是第一个冲进火场救人。你不容易敞开心扉，但一旦认可了某个人，你会用最笨拙的方式守护到底。"
    keywords: "不良正义、笨拙温柔、行动派"
  - _code: 🔒 "LEIA"
    _name: 🔒 "莲见蕾雅"
    _group: 🔒 "mix"
    _vector: "🔒 MHM-LMH-MHM-LMH"
    _source: "witch-trial"
    slogan: "「看着我的眼睛——告诉我，我在你眼里是闪光的」"
    desc: "你是天生的领袖，美丽自信，一出现就能吸引所有人的目光。但光环之下是深不见底的空洞——你需要被看见、被认可、被崇拜。当这份渴望得不到满足时，你会做出任何事来重新站上舞台中央。你的魅力是真实的，你的脆弱也是。"
    keywords: "领袖魅力、被认可的渴望、光环下的空洞"
  - _code: 🔒 "UNSET"
    _name: 🔒 "未定之魂"
    _group: 🔒 "fallback"
    _vector: "🔒 MMM-MMM-MMM-MMM"
    _source: "witch-trial"
    slogan: "「审判还未落锤，你的灵魂在等待被定义」"
    desc: "你的因子尚未觉醒到可以归类的程度。也许你在所有人之间游走，也许你刻意隐藏了真实的自己。无论哪种，下次审判见。"
    keywords: ""
  - _code: 🔒 "YUKI"
    _name: 🔒 "月代雪"
    _subtitle: 🔒 "大魔女"
    _group: 🔒 "special"
    _vector: "🔒 HHH-LLL-LLL-LLL"
    _source: "witch-trial"
    slogan: "「你们人类的悲剧……我全都看在眼里。所以，由我来终结」"
    desc: "你是跨越百年的复仇者，是最年幼也最强大的魔女。你曾真心地爱过这个世界，也曾被挚友的温暖动摇过。但你选择把这一切都埋葬，用冰冷的理性执行一个漫长到令人窒息的计划。你的复仇不是疯狂——而是一种绝望到极致的清醒。"
    keywords: "百年复仇、绝望的清醒、冰冷的终焉"
  - _code: 🔒 "ETL"
    _name: 🔒 "不灭雪华"
    _subtitle: 🔒 "梅露露真身"
    _group: 🔒 "special"
    _vector: "🔒 LLL-HHH-HHH-HHH"
    _source: "witch-trial"
    slogan: "「即使世界抛弃了我，我对雪的爱不会消融」"
    desc: "你是千年不灭的存在，因对「雪」的信仰而获得了不老不死。你经历了无数少女的诞生与死亡，目睹了无数次背叛与绝望，但你从未放弃寻找那个离开你的人。你的坚持不是执念——而是对爱的最纯粹回应。"
    keywords: "千年不灭、纯粹的信仰、永恒的守望"
  - _code: 🔒 "MADOKA"
    _name: 🔒 "鹿目圆"
    _subtitle: 🔒 "终将成为神"
    _group: 🔒 "B"
    _vector: "🔒 LLH-LLH-HLH-LLH"
    _source: "madoka"
    slogan: "「我不想让任何人再哭泣，哪怕要我变成不再存在的存在」"
    desc: "你是天生的信仰者——温柔到近乎天真的善良，让你在看到任何人的痛苦时都无法转身离开。你信任陌生人，宽恕伤害过你的人，甘愿为素不相识的人承担命运。这份善意不是软弱，是你明知世界残酷后依然选择伸出手。当所有人都绝望时，你是那个还会说'一定有办法'的人——哪怕代价是抹消自己存在的痕迹。"
    keywords: "不灭的善意、为众生成神、天真的信仰"
  - _code: 🔒 "HOMURA"
    _name: 🔒 "晓美焰"
    _subtitle: 🔒 "时间掠夺者"
    _group: 🔒 "F"
    _vector: "🔒 HHL-HLH-LHH-HHH"
    _source: "madoka"
    slogan: "「哪怕要重启世界一千次，我也要守住她一个人的笑容」"
    desc: "你是冰与执念的矛盾体——外表冷酷到不近人情，内心却燃烧着比任何人都炽烈的执着。你记着每一个轮回，每一次失败，每一个没能救下她的瞬间。你不信任旁人，因为旁人从未陪你走过那些被重置的时间；你宽恕不了命运，因为命运从未对你手软。你的温柔只对一个人开放，而对那一个人的爱，足够让你与整个世界为敌。"
    keywords: "轮回千次、冷焰执念、为一人敌世界"
  - _code: 🔒 "SAYAKA"
    _name: 🔒 "美树沙耶香"
    _subtitle: 🔒 "正义的末路"
    _group: 🔒 "mix"
    _vector: "🔒 HML-MHH-HHH-LHH"
    _source: "madoka"
    slogan: "「我明明是想做一个正确的人，为什么最后变成了怪物」"
    desc: "你是被自己的正义感烧成灰烬的人——你眼里容不下一点不公，你为受伤的人出头，你许愿治愈心上人却不敢让他知道。可这个世界不奖励纯粹的好人：你信任的人背叛了你的秘密，你救的人忘了你的存在，你信奉的正义在残酷的现实前一寸寸碎裂。你的崩溃不是软弱，是太用力地善良之后被反噬的伤口。魔女化不是堕落，是你的正义找不到出口的悲鸣。"
    keywords: "正义的崩塌、爱而不得、魔女化悲鸣"
  - _code: 🔒 "KYOKO"
    _name: 🔒 "佐仓杏子"
    _subtitle: 🔒 "末路求生者"
    _group: 🔒 "mix"
    _vector: "🔒 MHL-MMH-LMH-MMH"
    _source: "madoka"
    slogan: "「别傻了。在这个世界里，只为别人许愿的人活不长」"
    desc: "你是被现实磨硬了壳的实用主义者——曾经的你也相信为他人牺牲是神圣的，直到那个许愿毁了你的全家。从那以后你学会了先顾自己，学会了冷眼旁观别人的悲剧，学会了用'这不关我事'挡住所有想靠近的人。可你骗不了自己：当真正在乎的人陷入绝境，你还是会冲上去。你的硬是装出来的，你的软才是底色——只是你不敢再轻易把它交出来。"
    keywords: "实用主义盔甲、家庭创伤、关键时刻的真心"
  - _code: 🔒 "MAMI"
    _name: 🔒 "巴麻美"
    _subtitle: 🔒 "孤独的前辈"
    _group: 🔒 "B"
    _vector: "🔒 HMM-LHM-HHL-HHL"
    _source: "madoka"
    slogan: "「当魔法少女这么久，我其实……一直都好害怕」"
    desc: "你是优雅的盔甲下藏着深渊的人——你永远是后辈面前从容不迫的前辈，泡着红茶、系着缎带、用最漂亮的姿态消灭魔女。可没有人知道你独自战斗了多少年，没有人知道你每个夜晚都在害怕下一次会不会就回不来了。你渴望同伴，渴望被需要，渴望有人能让你卸下'可靠前辈'的伪装。当有人终于愿意走近你，你会紧紧抓住——因为你太孤独了，孤独到宁可把脆弱藏在优雅里，也不愿被人看见。"
    keywords: "优雅的盔甲、深层孤独、渴望被需要"
  - _code: 🔒 "homura_devil"
    _name: 🔒 "晓美焰 · 执念的黑化魔女"
    _group: 🔒 "special"
    _vector: "🔒 HHL-HHH-LHH-HHH"
    _source: "madoka"
    slogan: "重要的人一旦认定，你就很难退开。"
    desc: "你不是拒绝亲近，只是靠近之前会观察很久。一旦认定一个人重要，你会把对方的事当成自己的事；局面失控时，又会先收紧边界，尽量自己处理。你和焰相似的地方不是什么黑化，而是这份很难收回的认真。"
    keywords: "谨慎,边界感,行动先于表达"
    prosecution: "你不是拒绝亲近，只是靠近之前会观察很久。一旦认定一个人重要，你会把对方的事当成自己的事；局面失控时，又会先收紧边界，尽量自己处理。"
    softlanding: "在意一个人，不等于要替所有变数负责。把担心提前说出来，对方才有机会和你一起处理。"
    tags: "谨慎,边界感,行动先于表达"
  - _code: 🔒 "madoka_god"
    _name: 🔒 "鹿目圆 · 终极救赎的圆环之理"
    _group: 🔒 "special"
    _vector: "🔒 LLH-LLL-HHH-LLL"
    _source: "madoka"
    slogan: "你常常先注意到别人的需要。"
    desc: "气氛一不对，你通常会先看谁在难受，然后想自己能做什么。照顾人时你很有行动力，问题是自己的需要常常被排到后面。你和圆相似的地方，是温柔不只是态度，也会真的动手去做。"
    keywords: "敏感,照顾,行动力"
    prosecution: "气氛一不对，你通常会先看谁在难受，然后想自己能做什么。照顾人时你很有行动力，问题是自己的需要常常被排到后面。"
    softlanding: "答应照顾别人之前，先确认自己还有余裕。长期硬撑出来的体贴，最后容易变成委屈。"
    tags: "敏感,照顾,行动力"
  - _code: 🔒 "sayaka_siren"
    _name: 🔒 "美树沙耶香 · 理想主义破灭的痛楚"
    _group: 🔒 "special"
    _vector: "🔒 HML-MHH-HHH-LHH"
    _source: "madoka"
    slogan: "你对公平和承诺很敏感。"
    desc: "答应过的事，你会当真；看到敷衍和偏袒，也比一般人更难受。事情没做好时，你容易先检讨自己，再把失望压成愤怒。你和沙耶香相似的地方，是不愿意用“随便啦”处理重要关系。"
    keywords: "原则感,认真,自我要求"
    prosecution: "答应过的事，你会当真；看到敷衍和偏袒，也比一般人更难受。事情没做好时，你容易先检讨自己，再把失望压成愤怒。"
    softlanding: "失望时先分清：哪部分是自己的责任，哪部分是别人的选择。不是每件事都要先归因给自己。"
    tags: "原则感,认真,自我要求"
  - _code: 🔒 "kyoko_pragmatist"
    _name: 🔒 "佐仓杏子 · 利己外衣下的真心"
    _group: 🔒 "special"
    _vector: "🔒 MHL-MMH-LMH-MMH"
    _source: "madoka"
    slogan: "你的关心，常常包在现实判断里。"
    desc: "你习惯先算可行性，再决定要不要投入，不喜欢把气氛说得很满。但真正认定一个人后，你会用具体行动帮忙，只是不一定会承认自己在意。你和杏子相似的地方，是嘴上留余地，事上不轻易退。"
    keywords: "务实,有底线,嘴硬心软"
    prosecution: "你习惯先算可行性，再决定要不要投入，不喜欢把气氛说得很满。但真正认定一个人后，你会用具体行动帮忙，只是不一定会承认自己在意。"
    softlanding: "把在意说得更直接一点，关系会少一些猜测；帮忙前讲清界限，也更容易长期相处。"
    tags: "务实,有底线,嘴硬心软"
