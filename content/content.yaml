    questions: |-
      [
          { meta: "Q1 · 朝の光に込めた願い", text: "目覚ましが鳴る前に、カーテンの隙間から朝の光が差し込んでくる。目を開けると、天井の埃が光の中で舞っている。その瞬間、今日へのささやかな期待が心に浮かぶ——", options: ["きっといいことがあるはず。会った人みんなに笑顔で挨拶しよう。", "いつも通り、平穏に一日が終われば、それで十分だ。", "ちょっと疲れてる。でも気合を入れて、「大丈夫」の顔を着込む。"] },
          { meta: "Q2 · 小さな輪のぬくもり", text: "放課後の教室で、みんなが週末の集まりの話で盛り上がっている。誰かが振り返り、微笑みながら私の手を握る：「あなたも来るよね？あなたがいなきゃダメだよ。」その瞬間——", options: ["胸が温かくなる。力強く頷く。こんなに求められるのは、嬉しい。", "笑顔で頷いたけれど、心のどこかが締め付けられる——いつか自分が足りなくなって、この賑やかさが散ってしまわないかと。", "愛想よく合わせておく。こんな熱は、散るのも一瞬だって分かっている。"] },
          { meta: "Q3 · 雨夜の傘", text: "深秋の雨の夜。図書館が閉まり、私は入口に立つ。隣には、普段あまり話さず少し孤立気味の同級生がいる。彼女は雨を見つめて困り果てている。傘は持っていない。私の手には、ちょうど傘が一本。その瞬間——", options: ["傘を差し出して笑う：「一緒に行こう。」小さなことだけど、心が落ち着く。", "少し迷ってから声をかける。親友になることはないだろう。でも道の途中だから、やるだけやってみる。", "傘を渡す。心の中で借りを数えておく：次のグループ課題、彼女も手伝ってくれるだろう。"] },
          { meta: "Q4 · 託された使命", text: "先生や目上の人が皆の前で、大事な任務を私の手に預け、肩を叩いて言う：「あなたが一番頼りになる。」その瞬間——", options: ["背筋を伸ばす。こんなに信頼されるなら——絶対に失敗できない、と心に決める。", "肩が急に重くなる。笑顔で引き受けたけれど、その期待に息が詰まる。", "愛想よく受け取る。分かってる：うまい言葉は前だけ、これからは全部こっちの仕事だ。"] },
          { meta: "Q5 · 無言の妥協", text: "友人との食事。みんなが、私の好きでもない店に大賛成している。誰かが何気なく私の意見を聞いてくる——", options: ["即座に言う：「その店、すごく行きたかったんだ！」みんなが楽しいなら、私が何を食べたいかより大事。", "笑って「どこでもいいよ」と言い、言いたかった言葉を飲み込む。", "肩をすくめて「適当で」。少し冷たいかもしれない。でも、本当に私の意見を聞きたがっている人はいないようだ。"] },
          { meta: "Q6 · 鏡の中の変身", text: "深夜、洗面所の鏡の前に立つ。疲れて平凡な自分を見つめていると、子どもの頃の「魔法少女」への憧れがふと頭をよぎる。もし本当に何かの力が手に入るとしたら——", options: ["みんなを守る魔法が欲しい。誰の涙も消せるように。", "完璧になりたい。弱さや不完全さで、もう誰の前でも俯きたくない。", "透明になる力が欲しい。消えたとき、誰にも見つけられないように。"] },
          { meta: "Q7 · スポットライトの影", text: "ステージの中心で、すべての人に囲まれ、輝く友人。私は薄暗い客席の隅で、静かに拍手を送る。その瞬間——", options: ["心から嬉しい。彼女がこんなに輝いているなら、友達の私にも、その輝きが届く。", "力を込めて拍手する。掌が冷たい：なぜ光の中に立っているのは、永遠に私じゃないの？", "冷めた目で見ている。栄光なんて一時のもの——高く登るほど、落ちるのも深い。"] },
          { meta: "Q8 · 守りと自分", text: "天秤の一端は「自分の感情を押し殺して、みんなの幸せと引き換えに」。もう一端は「大切な人をがっかりさせても、自分の境界線を守り抜く」。あなたはどこに重りを置く——", options: ["自分を犠牲にしても、温もりと安らぎと引き換えにする。【純潔の犠牲】", "孤独と冷たい視線を被っても、境界線を守る。【漆黒の独占・自存】"] },
          { meta: "Q9 · 傷ついた時の居場所", text: "理不尽に傷ついた時、部屋の隅に丸まっている私。最初に頭をよぎるのは——", options: ["誰かに抱きしめてほしい。「大丈夫、きっと乗り越えられる」と聞かせてほしい。", "早く強くなりたい。これからは自分のことは自分で。誰の顔色もうかがわない。", "もう期待しない。元々、誰も本当に来てくれたことはないから。"] },
          { meta: "Q10 · 服従という名の規範", text: "目上の人が、反論を許さない命令と未来の設計図を示す。それが自分の内なる願いと反対の方向でも、私はたいてい——", options: ["善意だと信じて、敷かれたレールの上を歩く。", "表面上は素直に従い、こっそり自分だけの場所を取っておく。", "一晩中抵抗して眠れない。それでも次の朝には、素直に従ってしまう。"] },
          { meta: "Q11 · 完璧な嘘", text: "「最近どう？」と気遣われた時、私の最初の反応はたいてい——", options: ["誰よりも早く笑う：「私は元気だよ。」みんなが聞きたいのも、それだから。", "冗談でごまかす。自分の暗い気持ちを、誰かに迷惑をかけたくない。", "淡々と「まあまあ」と返す。喉まで出かかった言葉を、また飲み込む。"] },
          { meta: "Q12 · 理想主義の霜", text: "尊敬していた人が、実は裏でも嘘をつき、自分勝手で、見にくい面を見せる。最初に気づいた時の、その瞬間——", options: ["ショックで悲しい。それなのに、つい言い訳を探してしまう。", "少し幻滅した。やっぱりみんな同じなんだ。受け入れるしかない。", "心の中で冷笑する：ほら、本当に綺麗な人なんて、どこにもいない。"] },
          { meta: "Q13 · 軽く流された努力", text: "何日も徹夜して作り上げたものを、会議で上司や仲間に軽く流され、手柄さえ他人に取られる。その瞬間、私は——", options: ["深呼吸して自分を慰める：大丈夫、ちゃんと仕事はできた。次はもっと頑張ろう。", "爪が掌に食い込む。何夜徹夜したかは分かってる。この悔しさが行き場のないことも。", "心の中で冷笑する：なら、本気の想いが値しないなら、これからは形だけこなしてやる。"] },
          { meta: "Q14 · 崩壊の瞬間、残されたチップの配分", text: "誤解とプレッシャーが次々と押し寄せ、もう限界だ。手元に残ったたった 3 点の心のチップを、以下の三つの対処法に分けてください：", options: ["weight::2|1|0", "weight::2|0|1", "weight::1|2|0", "weight::0|2|1", "weight::1|0|2", "weight::0|1|2", "weight::1|1|1"] },
          { meta: "Q15 · 笑い話にされた秘密", text: "偶然、自分が入れていないグループチャットで、一番親しい友人が、私が一番深く隠している傷を軽い言葉で皆のネタにしているのを見てしまう。その瞬間——", options: ["静かに画面を閉じ、自分に言い聞かせる：裏で言うのは誰にでもある。悪気はない。私たちはまだ友達だ。", "手のひらが冷たくなっていく。私は「グループを退出」を押した。この関係は、ここまでだ。", "スクリーンショットを保存する。心の中で何かの扉が閉じた——これからは、彼女にも一線を引く。"] },
          { meta: "Q16 · 無言の傍観", text: "高校の時、クラスの皆が避けていた同級生が、黙って私の隣に座った。友達が袖を引いて言う：「行こう、面倒に巻き込まれないで。」私は、彼女が机の角の剥げたペンキをいじる手を見る。その瞬間——", options: ["立ち上がって離れる。理由は自分に課した：水を買いに行くだけ。この風は私が起こしたんじゃない。", "胃がきゅっと締まる。それでも小声で「先に行くね」と言った。分かってる——私も同罪だ。", "椅子を少しずらす。かわいそうな人には必ず理由がある。彼女の身にも、彼女自身の所為がある。"] },
          { meta: "Q17 · 愛という名の脅迫", text: "思わしくない成績を持って帰ると、両親が長いため息をつく：「私たちの一生の心血がすべて無駄になった。私たちに申し訳ないと思わないのか？」その瞬間——", options: ["すぐに謝り、次は絶対に良い点を取ると約束する。心配してくれているんだ。疲れているんだ。", "うつむいて黙ったまま。分かっている——彼らが欲しいのは私じゃない。成績表だ。", "白髪交じりの彼らを見て、なぜか胸がすっとする：いいよ、君たちが思うところのダメな奴、見せてやる。"] },
          { meta: "Q20 · 逃れられない劣等感", text: "賑やかな大通りを歩いていると、周囲の視線が自分をかすめていく。その時、体の一番正直な反応は——", options: ["背筋をぴんと伸ばし、大きく安定した歩幅で歩く——作った自信でも、とにかく演じる。", "背中が冷え、手のひらに汗が滲む。「自分は足りない」という感覚が、どこに行ってもついてくる。", "他人の粗探しを始める：あの人の髪型、あの人の服装……探しているうち、自分が少し良くなった気がする。"] },
          { meta: "Q21 · 支配と共依存の愛", text: "パートナーが、服装も投稿も言動も頻繁に批判し、「これもあなたのためなんだよ」と言う。その瞬間——", options: ["ぎこちなく、言われた通りに直す。こんなに細かいのは、きっと本気で大事に思ってるからだろう。", "もう疲れた。それでも「嫌だ」と言う。この一言で、この関係が終わるかもしれないと分かっていても。", "逆に相手の体型や収入を攻撃する。一突きされたら、一突きで返す。どちらも譲らない。"] },
          { meta: "Q22 · 究極の代償", text: "審判官があなたを隅まで追い詰める。天秤に乗せられた選択肢は二つだけ：「自分を犠牲にし、愛した人たちの幸せを取り戻す」か、「唯一の本物の想いを抱きしめたまま、世界ごと道連れにする」か——", options: ["自分を捧げ、他人の光と引き換えにする。【純潔の殉教】", "執念を手放すくらいなら、世界を滅ぼす。【漆黒の独占】"] },
          { meta: "Q23 · 秘めた悪意と嫉妬", text: "いつも自分を押さえつけてきた、完璧な人が、突然大失敗をしたと聞く。真っ先に頭をよぎる思いは——", options: ["慌ててその思いを押し殺し、自分を責める：「どうしてそんなことを考えるんだ」。そして、いつも通りに挨拶の一言を送る。", "認める——一瞬だけ、すっとした。すぐに罪悪感が来る：私はどういう人間なんだ。", "気持ちいい。本当に気持ちいい。この日をずっと待っていた——なぜいい思いを全部お前が持っていくんだ。"] },
          { meta: "Q24 · 搾り取られた後の廃棄", text: "かつては親身に気にかけてくれた集団や上司が、あなたに利用価値がなくなると、あっさりと隅に追いやる。そんな冷酷さに直面して——", options: ["いつも通り雑用を手伝い、彼らのために考えを巡らせる：皆ただ忙しいだけ。わざと無視しているんじゃない。", "黙って荷物をまとめて去る。使い切って捨てられた——このことは、忘れない。", "表面は穏やかにしているが、心の中では全員をブラックリストに入れた。また助けてほしいって？ごめん、私「忙しい」のよ。"] },
          { meta: "Q25 · 崖っぷちでの別れ", text: "もしすべての希望が消え去ったとして、道の終わりに立ち、ここまで傷だらけで歩いてきた自分を見つめて、あなたは彼女に何を言いたい——", options: ["「大丈夫。もう少しだけ頑張って。明日はきっと陽が差すから。」（自分でも本気で信じていなくても）", "「お疲れさま。ここまでずっと痛かったね。でも私がいる。もう逃げないよ。」", "「この痛みは全部覚えてる。これから誰かに傷つけられたら、倍にして返してやる。」"] },
          { meta: "Q26 · 審判の最終確認", text: "審判の声が、虚ろな精神世界に響き渡る：「分かったか？これがお前の皮の下に隠れた真実だ——臆病、妥協、暗さ、頑固さ。一つ残らず、お前そのものだ。さあ、この素顔を携えて、生存の契約に署名する覚悟はあるか？」", options: ["直視できずに目を閉じ、それでも自分を洗い清めてくれる聖なる光を願い続ける。【虚ろな祈り】", "目を開け、審判官をまっすぐに見つめて：「これが壊れた私です。この傷と醜さを連れたまま、生き続けます。」【清醒な受容】", "契約書を奪い取って破り捨てる：「あなたの審判なんて必要ない！私の闇は私の武器——私は自分自身の神になる！」【完全な黒化】"] },
        ]
