characters:
  - _code: 🔒 EMMA
    _name: 🔒 樱羽艾玛
    _group: 🔒 B
    _vector: 🔒 LHH-LLM-HHH-LLL
    _source: witch-trial
    slogan: 「仅仅是因为不想被讨厌。多么廉价又真实的借口呢。」
    desc: 为了不被讨厌而笨拙地讨好？真是可悲的生存方式。您把笑容当成廉价的防弹衣，宁可主动把事情搞砸，也不敢承受他人分毫的期待。那句卡在喉咙里的“住手”，成了您日夜咀嚼的毒药。满脑子只想着保全自己呢——可即便如此，这份至今还在作痛的悔恨，恰恰证明了您那颗心还没有彻底坏掉。您和樱羽艾玛一样，背负着旁观者的罪恶感，却还在滑稽又拼命地练习着，该如何为某个人挺身而出。
    keywords: 讨好面具,旁观之罪,滑稽的勇敢
  - _code: 🔒 SHERRY
    _name: 🔒 橘雪莉
    _group: 🔒 B
    _vector: 🔒 MHM-LMH-HHH-LHH
    _source: witch-trial
    slogan: 「与其在恐惧中哭泣，不如选个有趣的死法，对吧？」
    desc: 您的情绪构造，还真是让人毛骨悚然呢。别人在风暴中惊慌失措，您却像个局外人一样，兴致勃勃地寻找着“有趣”的细节。抛开常理的冷眼旁观，真让人不知道该说您是绝顶清醒，还是个彻头彻尾的疯子。但也正因为您不受那些无聊情绪的摆布，别人抛来的沉重托付，您总能轻描淡写地接下。如同橘雪莉那般，只要觉得“有意思”，即使是地狱的门，您也会毫不犹豫地推开吧。
    keywords: 狂热好奇,剥离常理,贯彻到底
  - _code: 🔒 MIRIA
    _name: 🔒 佐伯米莉亚
    _group: 🔒 B
    _vector: 🔒 LMH-LLM-HMH-MML
    _source: witch-trial
    slogan: 「一口一个‘普通人’，是想逃避被期待的重压吗？」
    desc: 把自己贬低成“随处可见的普通人”，不过是您给自己找的退路罢了。害怕被寄予厚望，所以干脆把自己踩进尘埃里，习惯性地迎合别人，心事只肯讲给老电影听。可到了真正要紧的关头，您那种近乎自我牺牲的温柔，真是傲慢得让人火大。您和佐伯米莉亚一样，明明已经被这个世界辜负得体无完肤，却还是固执地要用谎言去替别人挡刀。何等天真的伪善呢。
    keywords: 退路伪装,自贬式温柔,护人到底
  - _code: 🔒 HIRO
    _name: 🔒 二阶堂希罗
    _group: 🔒 F
    _vector: 🔒 HLL-HMH-LHH-HHM
    _source: witch-trial
    slogan: 「连自己的灵魂都要钉上‘正确’的十字架吗？」
    desc: 您对“正确”有着一种病态的洁癖呢。规矩、条理、消灭邪恶，把这些漂亮话挂在嘴边，是不是能让您觉得好受些？一旦外界的尺度崩塌，您才发现自己这双手也同样肮脏。可笑的是，您连犯错都要一丝不苟地推倒重来。纠正到满意为止，这种执拗的赎罪游戏，您打算玩到什么时候？您和二阶堂希罗一样，把正义当成十字架扛在肩上，连自己的灵魂也要一并送上断头台。
    keywords: 正义洁癖,执拗赎罪,绝对审判
  - _code: 🔒 NANOKA
    _name: 🔒 黑部奈叶香
    _group: 🔒 F
    _vector: 🔒 HHL-HMH-LLL-LLH
    _source: witch-trial
    slogan: 「把生死看得那么轻，您以为自己很帅气吗？」
    desc: 话这么少，是怕别人看穿您的软弱吗？您习惯独自咀嚼那些冰冷的信息，偏执地相信“只要查清真相，恐惧就会消失”。为了扒开那些发臭的黑幕，连命都可以随便摆上赌桌。偶尔触到旧物，别人的过往会在您眼前一闪而过——所以您比谁都清楚：秘密埋得再深，也有来处。和黑部奈叶香一样，您是个无药可救的追迹者。把要查清的真相看得比命还重——这种不管不顾的做派，真是让人厌烦。
    keywords: 冰冷防壁,偏执追迹,真相至上
  - _code: 🔒 HANNA
    _name: 🔒 远野汉娜
    _group: 🔒 S
    _vector: 🔒 MHH-LMM-MHM-HML
    _source: witch-trial
    slogan: 「那一针一线缝补出来的骄傲，轻轻一扯就会碎的。」
    desc: 还在做着光鲜亮丽的女主角美梦吗？您努力撑起的那副滴水不漏的千金派头，不过是虚张声势的易碎品。苦练着并不擅长的伎俩，妄想着有朝一日能拯救谁，可等您回过神来，重要的人早就从指缝里溜走了。哪怕被命运逼到泥地里，您也死死护着“自我”这块最后的遮羞布，绝不肯低下头。您和远野汉娜一样，只能用华丽的幻想，去兜住那颗支离破碎、无法原谅自己的心。既可悲，又美丽呢。
    keywords: 易碎骄傲,幻梦千金,华丽死撑
  - _code: 🔒 MERURU
    _name: 🔒 冰上梅露露
    _group: 🔒 S
    _vector: 🔒 HMH-LLH-HLH-HHL
    _source: witch-trial
    slogan: 「一直道歉的话，就没有人会来责怪您了吧。」
    desc: 您总是习惯性地先低头认错，眼泪廉价得像不要钱一样。您能耐心地修补好坏掉的物件，却任凭自己的心流着血，连喊一句痛都不敢，生怕给别人添麻烦。您把所有的筹码都押在所谓的“家人”身上，即便被亏待也舍不得放手。这种祈求被爱的方式，真是卑微到了极点。可您和冰上梅露露一样，明明是个胆怯到极点的爱哭鬼，却在守护重要之物时，露出了比谁都坚硬的獠牙。
    keywords: 卑微祈爱,修补伤痕,含泪咬牙
  - _code: 🔒 COCO
    _name: 🔒 泽渡可可
    _group: 🔒 S
    _vector: 🔒 HML-LMM-LHL-MMM
    _source: witch-trial
    slogan: 「除了那束光，这腐朽的世界根本不值得一看。」
    desc: 满嘴毒舌，看什么都不顺眼。您早就懒得对这虚伪的现实赔笑脸了，毕竟您见识过世界最恶心的一面。既然“期待”只会带来背叛，不如把所有的狂热都献给屏幕对面那个虚无缥缈的幻影。您把心门焊得死死的，只对唯一的信仰摇尾乞怜。您和泽渡可可一样，对着整个世界竖起中指冷眼旁观，却甘愿在仅剩的那点微光面前，毫无防备地交出自己的咽喉。
    keywords: 厌世毒舌,单向献祭,唯一软肋
  - _code: 🔒 NOAH
    _name: 🔒 城崎诺亚
    _group: 🔒 S
    _vector: 🔒 LHH-LLL-HLM-LLH
    _source: witch-trial
    slogan: 「不画画就会迷失自我？真是病入膏肓的艺术病呢。」
    desc: 像一阵风一样不守规矩，打着“表达自我”的旗号，肆意涂抹着人生。您讨厌被世俗的框框收编，遇到不满意的颜色，就自作主张地盖掉重来。连鲜血都要画成蝴蝶，这种近乎孩童般的无垢，说到底只是一种拒绝长大的残忍吧。城崎诺亚的灵魂在您身上作祟——您把人生当成一块永远未完成的画布，只要颜料还没干，谁也别想对您指手画脚。真是个任性的疯子。
    keywords: 拒绝定稿,无垢之残忍,狂热涂抹
  - _code: 🔒 MARGO
    _name: 🔒 宝生玛格
    _group: 🔒 W
    _vector: 🔒 MLM-LLM-LLM-MHL
    _source: witch-trial
    slogan: 「只要一开始就不抱期待，就永远不会品尝失望了呢。」
    desc: 您占卜看人准得吓人，还能把听过的任何声音模仿得以假乱真。这门以假乱真的手艺，是您在确认“根本没人爱我”后，给自己铸的铠甲。嘴上挂着“我从来不相信任何人”，用满不在乎来掩饰内心的极度干涸。可命运最喜欢嘲弄您这样的人：最不信爱的您，偏偏会在最后一刻，为了在乎的人连命都不要。您和宝生玛格一样，把心锁得密不透风，却把唯一的钥匙扔给了别人。
    keywords: 声线伪装,拒绝期待,致命软肋
  - _code: 🔒 ANAN
    _name: 🔒 夏目安安
    _group: 🔒 W
    _vector: 🔒 MHL-LMH-LHL-MHH
    _source: witch-trial
    slogan: 「躲在用文字砌成的堡垒里，就不会受伤了吗？」
    desc: 嫌门外的世界太吵，就干脆躲在自己的房间里装死。您太清楚语言的杀伤力了，所以总是用奇怪的腔调和厚厚的辞藻把自己包裹起来，仿佛不流露真心，别人就抓不住您的把柄。可越是抗拒靠近，您那颗心跳得就越是大声，简直是在祈求着有谁能强行破门而入。您就像夏目安安，缩在最阴暗的角落里，手里却死死攥着一支笔——一支她最渴望有人能像握朋友那样握住它的笔。真是别扭得可爱。
    keywords: 文字堡垒,社恐防壁,别扭的渴望
  - _code: 🔒 ALISA
    _name: 🔒 紫藤亚里沙
    _group: 🔒 mix
    _vector: 🔒 HLM-LLM-MMH-HLM
    _source: witch-trial
    slogan: 「明明最恨的是自己，却非要去刺痛别人，真是难看。」
    desc: 浑身长满了刺，见谁咬谁。但您心里比谁都清楚，您最想千刀万剐的人，其实是您自己。因为太缺爱了，所以发展出了这种惹人生厌的自毁逻辑：一次次把自己往火坑里推，一次次激怒别人，只想换来一句真切的责骂，好证明自己还是被在乎的。您坦荡得近乎固执，绝不说谎，却用尽了一切办法来恶心自己。您和紫藤亚里沙一样，嘴上讨着骂，心里却在流着血跪地求饶。
    keywords: 自毁逻辑,真实之刺,病态求证
  - _code: 🔒 LEIA
    _name: 🔒 莲见蕾雅
    _group: 🔒 mix
    _vector: 🔒 MHM-LMH-MHM-LMH
    _source: witch-trial
    slogan: 「没有观众的话，您连怎么呼吸都会忘记吧？」
    desc: 必须要站上舞台中央，姿态要无懈可击，连崩溃的瞬间都得挑个唯美的角度。对您来说，“被注视”就是救命的氧气。因为曾经最渴望的那道目光，从头到尾就没有落在您身上过，所以您发了疯似的要抓住全场的视线，仿佛一旦安静下来，自己就会彻底消失。您把这出孤独的独角戏演得华丽至极。莲见蕾雅的影子与您重叠——拼命想要全世界都看着您，其实只是在等那一个永远不会回头的人。
    keywords: 渴求视线,华丽独角戏,孤独成瘾
  - _code: 🔒 UNSET
    _name: 🔒 未定之魂
    _group: 🔒 fallback
    _vector: 🔒 MMM-MMM-MMM-MMM
    _source: witch-trial
    slogan: 「连自己究竟算个什么东西，都还没搞清楚吗？」
    desc: 您内心的声音还在互相撕咬，没有任何一种欲望敢于站出来主宰一切。这不是什么“无限的可能”，而是您在残酷的现实面前选择了退缩，拒绝给自己的灵魂定罪。在这个牢笼里，您的名字旁边还是一个滑稽的问号。审判尚未落锤，您就继续在这滩浑水里，悬而未决地挣扎下去吧。
    keywords: 悬而未决,拒绝定罪,浑水挣扎
  - _code: 🔒 YUKI
    _name: 🔒 月代雪
    _group: 🔒 special
    _vector: 🔒 HHH-LLL-LLL-LLL
    _subtitle: 🔒 大魔女
    _source: witch-trial
    slogan: 「连复仇的力气都生锈了，您还剩下什么？」
    desc: 您安静得像一句被遗忘了千年的判词。仇恨曾是支撑您活下去的唯一骨架，您坐上审判席，给这个肮脏的世界整体判下了死罪。可是，时间太长了。您眼睁睁看着那些脆弱的生命在泥泞中挣扎、犯错、然后成长，您突然发现，自己那停滞在原地的仇恨，不知何时已经变得索然无味。最后一刻，您亲手掐灭了黑暗。和月代雪一样，恨到了极致，反而生出了一种疲惫的宽容。
    keywords: 生锈之恨,疲惫的宽容,亲手终结
  - _code: 🔒 MADOKA
    _name: 🔒 鹿目圆
    _group: 🔒 B
    _vector: 🔒 LLH-LLH-HLH-LLH
    _subtitle: 🔒 终将成为神
    _source: witch-trial
    slogan: 「企图背负所有人的痛苦，您以为自己是神吗？」
    desc: 您拥有一种残忍到极点的温柔。一看到别人的痛苦，就完全顾不上自己，甚至甘愿为素不相识的人背负因果。这绝不是软弱，而是您在看清了世界的恶意后，依然傲慢地摊开掌心。当所有人都觉得死局已定时，只有您还在那里流着泪说“一定还有办法”。代价是抹消自己存在的痕迹？这种沉醉在自我牺牲里的温柔，最后只会把您自己逼上绝路罢了。
    keywords: 傲慢的善良,神之献祭,天真的信徒
  - _code: 🔒 HOMURA
    _name: 🔒 晓美焰
    _group: 🔒 F
    _vector: 🔒 HHL-HLH-LHH-HHH
    _subtitle: 🔒 时间掠夺者
    _source: witch-trial
    slogan: 「为了一个人把世界踩在脚下。您的执念，沉重得让人反胃。」
    desc: 外表看着冷酷不近人情，底下却翻滚着比谁都偏执的岩浆。您不信任任何人，因为没人能分担您在轮回里咽下的血泪；您也绝不原谅命运，因为它把您在乎的东西撕得粉碎。您的世界窄得可怜，只装得下那一个人。为了保住那个笑容，您根本不介意踩碎所有的规则，哪怕与全宇宙为敌，哪怕自己化身为魔。这份无可救药的执念，真是疯得彻底。
    keywords: 轮回狂魔,偏执冷焰,为一人敌世界
  - _code: 🔒 SAYAKA
    _name: 🔒 美树沙耶香
    _group: 🔒 mix
    _vector: 🔒 HML-MHH-HHH-LHH
    _subtitle: 🔒 正义的末路
    _source: witch-trial
    slogan: 「现实可不是正义必胜的过家家游戏啊，蠢货。」
    desc: 想做个正确的人？结果却变成了满身泥泞的怪物。您眼里容不下沙子，为了喜欢的人可以连命都不要，还自顾自地觉得“不求回报”很高尚。可现实偏偏最喜欢碾碎您这种纯粹的蠢货。付出被无视，信仰被摔碎，您最后的崩溃根本不是因为堕落，而是您那份太用力的洁癖，在肮脏的世界里找不到出口，最终只能发出凄厉的悲鸣。满盘皆输，满意了吗？
    keywords: 正义洁癖,信仰崩塌,悲鸣的怪物
  - _code: 🔒 KYOKO
    _name: 🔒 佐仓杏子
    _group: 🔒 mix
    _vector: 🔒 MHL-MMH-LMH-MMH
    _subtitle: 🔒 末路求生者
    _source: witch-trial
    slogan: 「披着利己主义的皮，内里却软弱得一塌糊涂呢。」
    desc: 您给自己裹上了一层厚厚的“实用主义”铠甲。曾经也信奉过无私奉献，直到现实狠狠扇了您一耳光。从那以后，您把“关我屁事”挂在嘴边，学会了冷眼旁观。可您终究骗不了自己，一旦真正在乎的人陷入死局，您那层硬壳瞬间就会碎成渣，哪怕陪着对方粉身碎骨也做不到见死不救。装什么冷酷无情？心软才是您永远治不好的绝症。
    keywords: 实用主义伪装,刺猬外壳,心软绝症
  - _code: 🔒 MAMI
    _name: 🔒 巴麻美
    _group: 🔒 B
    _vector: 🔒 HMM-LHM-HHL-HHL
    _subtitle: 🔒 孤独的前辈
    _source: witch-trial
    slogan: 「用优雅掩饰恐惧，您其实害怕得快要哭出来了吧？」
    desc: 习惯了做那个永远游刃有余的“可靠前辈”。哪怕天塌下来，也要泡好红茶、理好衣摆，用最优雅的姿态去解决问题。可谁知道您无数个深夜里其实害怕得发抖？您太渴望陪伴了，太害怕被抛弃了，以至于只要有人稍微向您伸出手，您就会像抓住救命稻草一样，高兴得忘记所有防备。您的强大，全都是用那种不敢诉说的、令人窒息的孤独换来的。
    keywords: 优雅死撑,窒息的孤独,渴求依赖
  - _code: 🔒 homura_devil
    _name: 🔒 晓美焰 · 执念的恶魔
    _group: 🔒 special
    _vector: 🔒 HHL-HHH-LHH-HHH
    _source: witch-trial
    slogan: 「一旦把谁划进圈子，您那占有欲简直让人喘不过气。」
    desc: 在交出真心前，您的审查期比谁都长。可一旦认定了某个人，对方的劫难就成了您的劫难。局面失控时，您的第一反应是筑起高墙，试图靠一己之力强行扭转乾坤，把对方死死锁在安全区。所谓的“黑化”，不过是您无法收回的、极其傲慢的认真。
    keywords: 漫长审查,绝对占有,孤立高墙
    prosecution: 考察期极长，可一旦认定，就会把对方的事全揽在自己身上。局面失控时，总是傲慢地筑起高墙，试图靠一己之力强行扭转。
    softlanding: 满脑子只想着自己承受，也是一种傲慢哦。试着把那份害怕失去的恐慌说出口，也许比强行干预更像个人类。
    tags: 漫长审查,绝对占有,孤立高墙
  - _code: 🔒 madoka_god
    _name: 🔒 鹿目圆 · 终极救赎的圆环之理
    _group: 🔒 special
    _vector: 🔒 LLH-LLL-HHH-LLL
    _source: witch-trial
    slogan: 「闻着别人身上绝望的气味去托底，您真是个无可救药的圣人。」
    desc: 只要空气稍微有点不对，您那过剩的同理心就会立刻发作。总能第一时间发现谁在难过，然后下意识地去当那个割肉喂鹰的托底者。您在照顾别人时果断得像个战士，却唯独把“自己”当成可以随时丢弃的消耗品。这种毫无底线的温柔，真是看得人火大。
    keywords: 过剩共情,圣人症候群,割肉托底
    prosecution: 情绪雷达敏锐得过头，总是下意识地去给别人托底。唯独把自己的需求，当成可以随时丢弃的废品。
    softlanding: 答应做那个撑伞的人之前，先看看自己是不是已经快被淹死了。靠燃烧自己换来的光，是照不长久的。
    tags: 过剩共情,圣人症候群,割肉托底
  - _code: 🔒 sayaka_siren
    _name: 🔒 美树沙耶香 · 理想主义破灭的痛楚
    _group: 🔒 special
    _vector: 🔒 HML-MHH-HHH-LHH
    _source: witch-trial
    slogan: 「对承诺有着致命的洁癖，难怪会被现实弄得遍体鳞伤。」
    desc: 答应过的事，您就敢拿命去填。所以当看到背叛或敷衍时，那种生理性的恶心会让您直接失控。事情脱轨时，您会先近乎自虐地反思自己，等憋到极限，再把所有的失望化作毁灭性的愤怒。完全不允许自己有半点妥协，真是一场华丽的自我毁灭呢。
    keywords: 承诺洁癖,道德自虐,零度妥协
    prosecution: 眼里容不下沙子，看到背叛就会产生生理性厌恶。事情一旦脱轨，会先自虐般地反思，最后把失望憋成毁灭性的愤怒。
    softlanding: 并不是世界上的每一点脏，都要算作您的错。偶尔学会说一句“那是别人的问题”，放过自己吧。
    tags: 承诺洁癖,道德自虐,零度妥协
  - _code: 🔒 kyoko_pragmatist
    _name: 🔒 佐仓杏子 · 利己外衣下的真心
    _group: 🔒 special
    _vector: 🔒 MHL-MMH-LMH-MMH
    _source: witch-trial
    slogan: 「嘴上说着现实的冷酷账本，手却还是很诚实地伸出去了呢。」
    desc: 遇到事情总喜欢在脑子里算计“投入产出比”，最烦情绪泛滥的场面。您看上去精明又无情，可如果真的在乎谁，哪怕嘴上骂得再难听，也会把对方需要的东西直接砸过去。把真心藏在硬邦邦的外壳底下，只是为了在退无可退时，显得没那么狼狈罢了。
    keywords: 现实账本,行动派,掩耳盗铃
    prosecution: 习惯先算投入产出比，极度厌恶情绪泛滥。可如果在乎谁，哪怕嘴上骂着，也会把对方需要的东西直接砸过去。
    softlanding: 既然手都已经伸出去了，嘴上承认一句“我在意你”有那么难吗？脱下那层多余的盔甲，别人才敢真正靠近。
    tags: 现实账本,行动派,掩耳盗铃
