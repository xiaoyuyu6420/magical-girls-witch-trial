      homura_devil:
        name: 曉美焰
        slogan: 重要的人一旦認定，你就很難退開。
        desc: 你不是拒絕親近，只是靠近之前會觀察很久。一旦認定一個人重要，你會把對方的事當成自己的事；局面失控時，又會先收緊邊界，盡量自己處理。你和焰相似的地方不是什麼黑化，而是這份很難收回的認真。
        keywords: 謹慎,邊界感,行動先於表達
      madoka_god:
        name: 鹿目圓
        slogan: 你常常先注意到別人的需要。
        desc: 氣氛一不對，你通常會先看誰在難受，然後想自己能做什麼。照顧人時你很有行動力，問題是自己的需要常常被排到後面。你和圓相似的地方，是溫柔不只是態度，也會真的動手去做。
        keywords: 敏感,照顧,行動力
      sayaka_siren:
        name: 美樹沙耶香
        slogan: 你對公平和承諾很敏感。
        desc: 答應過的事，你會當真；看到敷衍和偏袒，也比一般人更難受。事情沒做好時，你容易先檢討自己，再把失望壓成憤怒。你和沙耶香相似的地方，是不願意用「隨便啦」處理重要關係。
        keywords: 原則感,認真,自我要求
      kyoko_pragmatist:
        name: 佐倉杏子
        slogan: 你的關心，常常包在現實判斷裡。
        desc: 你習慣先算可行性，再決定要不要投入，不喜歡把氣氛說得很滿。但真正認定一個人後，你會用具體行動幫忙，只是不一定會承認自己在意。你和杏子相似的地方，是嘴上留餘地，事上不輕易退。
        keywords: 務實,有底線,嘴硬心軟
      emma_truth:
        name: 櫻羽艾瑪
        slogan: 你想弄清楚事情本來的樣子。
        desc: 你不擅長用「算了」糊過去。一句話前後對不上，或者有人在關係裡回避問題，你會注意到，也會想繼續問。答案讓人不舒服時，你仍寧願先知道事實，再決定怎麼處理。
        keywords: 求真,有邊界,不輕易自欺
