    types:
      EMMA:
                name: "Emma Sakuraba"
                slogan: "\"Even if the whole world gives up, I won't.\""
                desc: "You are a natural believer. You believe every person is worth saving—even when betrayed, wounded, or misunderstood by the world, you still reach out your hand. This kindness is not naivety—it is a choice made with full knowledge of the cost."
                keywords: "Undying hope, absolute trust, self-sacrifice"
      SHERRY:
                name: "Sherry Tachibana"
                slogan: "\"For you, I'd become anyone—even a villain.\""
                desc: "You are a born guardian—warm and radiant, the sun in everyone's eyes. But your devotion can twist into something extreme: when someone you love is threatened, you would kill for them. Between your kindness and your madness lies only a single person you care about."
                keywords: "Fatal innocence, mad devotion, darkness beneath the sun"
      MIRIA:
                name: "Miria Saeki"
                slogan: "\"Don't worry. Big sis has got this.\""
                desc: "You are the big-sister figure, always quietly looking after everyone, hiding your own pain behind a smile. You act before anyone even asks for help, willing to trade your life in a heartbeat when it counts. Your tenderness has edges—the most stubborn kindness the world has ever known."
                keywords: "Silent guardian, life for a life, stubborn tenderness"
      HIRO:
                name: "Hiro Nikaido"
                slogan: "\"Even if I have to die a thousand times, I will bring her back.\""
                desc: "You are a contradiction of ice and fire—cold and merciless on the outside, yet burning with emotion fiercer than anyone else within. You don't trust easily, but once you've chosen someone, you won't take a single step back, even if it means walking through hell and dying over and over."
                keywords: "Cold flame, death recurrence, all for the one beloved"
      NANOKA:
                name: "Nanoka Kurobe"
                slogan: "\"I don't need allies. I don't need warmth. I only need revenge.\""
                desc: "You are a lone wolf, wrapping every wound in barbs. You refuse all kindness, because experience has taught you that anyone who gets close will only be used. Your revenge isn't born of hot blood—it is cold, precise, and utterly solitary obsession."
                keywords: "Lone-wolf revenge, rejecting warmth, surgical obsession"
      HANNA:
                name: "Hanna Tono"
                slogan: "\"It's not like I care about you or anything… idiot.\""
                desc: "You forge a perfect armor of arrogance and sharp words, concealing a heart softer than anyone's beneath it. You never express kindness directly—you'd leave a handmade doll on someone's pillow, or sneak in to care for the sick after everyone has left. Your gentleness is visible only to those who know how to read you."
                keywords: "Tsundere, fragility beneath the armor, clumsy tenderness"
      MERURU:
                name: "Meruru Hikami"
                slogan: "\"I've waited a long time… a very, very long time.\""
                desc: "You are the eternal watcher, concealing loneliness that spans millennia beneath a gentle, caring exterior. You treat everyone with sincerity, yet your true purpose has never wavered. You have witnessed countless bonds born and shattered, yet still choose to believe—this persistence alone is the greatest miracle of all."
                keywords: "Millennial vigil, gentle disguise, never-yielding obsession"
      COCO:
                name: "Coco Sawatari"
                slogan: "\"Don't get the wrong idea. I'm only talking to you because I'm bored.\""
                desc: "You are a sharp-tongued streamer, masking your loneliness with barbs and self-centered bravado. You're always mocking others' naivety, yet your ridicule carries a faint warmth. You fear abandonment, so you push everyone away first—but you can't help watching them from the corner of the room."
                keywords: "Venomous armor, loneliness at the core, rejecting vulnerability"
      NOAH:
                name: "Noah Josaki"
                slogan: "\"That color… it's so beautiful. I want to paint it.\""
                desc: "You are a painter living inside a dream, possessing a worldview all your own and a mind unbound by reason. You are nearly immune to malice—not because you don't understand it, but because your world holds beauty far more important than hatred. Your innocence is a kind of power; even in the darkest prison, you keep creating light."
                keywords: "Pure creation, dream painter, beauty against the dark"
      MARGO:
                name: "Margo Hosho"
                slogan: "\"Don't mind me. I'm just passing through.\""
                desc: "You are a drifting star—no one can truly see all of you. Thorny one moment, reliable the next; appearing at the critical moment and vanishing in everyday life. You have your own values and code, unconstrained by anyone's framework. Your mystery isn't a disguise—you have simply become an enigma."
                keywords: "Unfathomable mystery, independent law, aid at the turning point"
      ANAN:
                name: "Anan Natsume"
                slogan: "\"Only you… you can't leave me.\""
                desc: "You are the possessor of a sealed garden—beneath a shell of social anxiety lies extreme dependency and jealousy. You fear crowds, yet crave complete acceptance from one specific person. When that craving is threatened, the darkness inside you erupts in a quiet but lethal way. Your love is a prison—trapping others, and trapping yourself."
                keywords: "Possessiveness, dark side of social anxiety, quiet danger"
      ALISA:
                name: "Arisa Shido"
                slogan: "\"Cut the chatter. Just keep up.\""
                desc: "You are an iron rose beneath a delinquent's facade—rough words concealing an awkward sense of justice. You complain endlessly, yet you're always the first to charge into the fire and save someone. You don't open your heart easily, but once you acknowledge someone, you'll protect them to the end in the clumsiest way possible."
                keywords: "Delinquent justice, clumsy tenderness, woman of action"
      LEIA:
                name: "Leia Hasumi"
                slogan: "\"Look into my eyes—tell me I shine in yours.\""
                desc: "You are a born leader—beautiful, confident, drawing every eye the moment you appear. But beneath the halo lies a bottomless void: you need to be seen, recognized, worshipped. When that hunger goes unsatisfied, you will do anything to reclaim center stage. Your charisma is real. So is your fragility."
                keywords: "Leadership charisma, hunger for recognition, void beneath the halo"
      UNSET:
                name: "Unbound Soul"
                slogan: "\"The gavel has not yet fallen. Your soul awaits its definition.\""
                desc: "Your witch factor has not awakened enough to be classified. Perhaps you drift between all archetypes, or perhaps you deliberately conceal your true self. Either way—until the next trial."
                keywords: ""
      YUKI:
                name: "Yuki Tsukishiro"
                subtitle: "Grand Witch"
                slogan: "\"I have watched every tragedy you humans have wrought. And so… I will end them all.\""
                desc: "You are the avenger across a century—the youngest and most powerful witch. You once loved this world with all your heart, and your dearest friend's warmth nearly swayed you. But you chose to bury it all, executing a plan so long and suffocating with cold rationality. Your revenge isn't madness—it is clarity born of absolute despair."
                keywords: "Century-long revenge, clarity of despair, cold finale"
      ETL:
                name: "Eternal Snow"
                subtitle: "Meruru's True Form"
                slogan: "\"Even if the world has abandoned me, my love for the snow will never melt.\""
                desc: "You are a being that endures across a millennium, granted agelessness through faith in the snow. You have witnessed the birth and death of countless girls, betrayal and despair beyond number, yet you have never stopped searching for the one who left. Your persistence is not obsession—it is the purest response to love."
                keywords: "Immortal across millennia, pure faith, eternal vigil"
      MADOKA:
                name: "Madoka Kaname"
                subtitle: "Fated to become a god"
                slogan: "\"I don't want anyone to cry anymore—even if it means becoming something that no longer exists.\""
                desc: "You are a born believer—gentle to the point of naive kindness, unable to turn away from anyone's pain. You trust strangers, forgive those who have hurt you, and willingly carry the fate of people you have never met. This kindness is not weakness; it is a hand you still extend after knowing how cruel the world is. When everyone else despairs, you are the one who still says \"there must be a way\"—even if the price is erasing every trace of your own existence."
                keywords: "Undying kindness, god for all, innocent faith"
      HOMURA:
                name: "Homura Akemi"
                subtitle: "Time thief"
                slogan: "\"Even if I have to restart the world a thousand times, I will protect the smile of that one girl.\""
                desc: "You are a contradiction of ice and obsession—cold to the point of seeming heartless, yet burning with a devotion fiercer than anyone else's. You remember every cycle, every failure, every moment you failed to save her. You do not trust others, because no one walked those reset timelines with you; you cannot forgive fate, because fate never showed you mercy. Your tenderness is reserved for one person alone—and that love is enough to make you the enemy of the entire world."
                keywords: "A thousand cycles, cold flame of obsession, defying the world for one"
      SAYAKA:
                name: "Sayaka Miki"
                subtitle: "End of justice"
                slogan: "\"I only wanted to be someone good. So why did I end up becoming a monster?\""
                desc: "You are someone burned to ash by your own sense of justice—you cannot tolerate a single injustice, you stand up for the hurt, you wish for your beloved's healing without ever daring to let him know. But this world does not reward the purely good: the people you trust betray your secrets, the ones you save forget you exist, and the justice you believe in shatters inch by inch against cruel reality. Your collapse is not weakness—it is the wound of having been kind too hard. Becoming a witch is not falling; it is the cry of a justice that found no way out."
                keywords: "Collapse of justice, love unfulfilled, lament of a witch"
      KYOKO:
                name: "Kyoko Sakura"
                subtitle: "Survivor at the end of the road"
                slogan: "\"Don't be naive. In this world, those who wish only for others don't live long.\""
                desc: "You are a pragmatist with a shell hardened by reality—you too once believed self-sacrifice was sacred, until that wish destroyed your entire family. Since then you learned to look after yourself first, to watch others' tragedies with a cold eye, to block every approaching heart with \"not my business.\" But you cannot deceive yourself: when someone you truly care about is cornered, you still rush in. Your hardness is armor; your softness is the real color—you just no longer dare to offer it easily."
                keywords: "Armor of pragmatism, family trauma, heart revealed in crisis"
      MAMI:
                name: "Mami Tomoe"
                subtitle: "The lonely senpai"
                slogan: "\"Being a magical girl for so long... truth is, I've been terrified the whole time.\""
                desc: "You are someone hiding an abyss beneath elegant armor—always the composed senpai before your juniors, brewing tea, tying ribbons, eliminating witches with the most beautiful poise. But no one knows how many years you fought alone, no one knows that every night you fear whether the next time will be the one you don't come back from. You long for companions, for being needed, for someone to let you take off the mask of the \"reliable senpai.\" When someone finally walks closer, you cling tight—because you are so lonely that you would rather hide your fragility behind grace than let it be seen."
                keywords: "Armor of elegance, deep loneliness, desperate to be needed"
      homura_devil:
                name: "Homura Akemi"
                slogan: "Once someone matters, it is hard for you to step back."
                desc: "You are not refusing closeness; you observe first. When someone becomes important, their concerns start to feel like your own. When things feel unstable, you tighten your boundaries and try to handle it yourself. Like Homura, your steadiness comes from a seriousness that is difficult to withdraw."
                keywords: "careful,boundaries,action before words"
      madoka_god:
                name: "Madoka Kaname"
                slogan: "You often notice other people's needs first."
                desc: "When the mood changes, you look for who is struggling and what you can do. Your care has real action behind it; the difficulty is that your own needs often move to the end of the line. Like Madoka, your gentleness is not passive."
                keywords: "sensitive,caring,practical kindness"
      sayaka_siren:
                name: "Sayaka Miki"
                slogan: "Fairness and promises matter to you."
                desc: "You take commitments seriously, and carelessness or favoritism can sting for a long time. When something goes wrong, you may blame yourself first, then turn disappointment into anger. Like Sayaka, you do not want to treat important relationships casually."
                keywords: "principled,earnest,high standards"
      kyoko_pragmatist:
                name: "Kyoko Sakura"
                slogan: "Your care often arrives as practical judgment."
                desc: "You consider whether something is realistic before you invest, and you avoid making promises merely for the mood. Once you truly care about someone, however, you help through concrete action. Like Kyoko, you leave room in words while remaining firm in deeds."
                keywords: "pragmatic,boundaries,guarded warmth"
      emma_truth:
                name: "Emma"
                slogan: "You want to see things as they are."
                desc: "You have difficulty letting things go with a vague answer. When a story does not add up or someone keeps avoiding the issue, you notice and want to ask more. Even when the truth is uncomfortable, you would rather know it before deciding what to do."
                keywords: "truth-seeking,boundaries,honest with yourself"
