name: Debug:Inspect Server Reverse Proxy

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Append 443 block and reload
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: false
          script: |

            set -e
            CONF=/opt/1panel/www/conf.d/magical.jadeai.icu.conf
            OR_C=1Panel-openresty-ykQi
            sudo -n chown "$(whoami)" "$CONF"
            if ! grep -q "listen 443" "$CONF"; then
              {
                echo ""
                echo "server {"
                echo "  listen 443 ssl;"
                echo "  http2 on;"
                echo "  server_name magical.jadeai.icu;"
                echo "  ssl_certificate /www/sites/magical.jadeai.icu/ssl/fullchain.pem;"
                echo "  ssl_certificate_key /www/sites/magical.jadeai.icu/ssl/privkey.pem;"
                echo "  ssl_protocols TLSv1.2 TLSv1.3;"
                sed -e "/listen 80/d" -e "/server_name/d" -e "/^server {/d" -e "/^}/d" "$CONF" | sed "/^[[:space:]]*$/d"
                echo "}"
              } >> "$CONF"
            fi
            echo "=== new conf ==="; cat "$CONF"
            docker exec "$OR_C" nginx -t || { echo TEST_FAILED; exit 1; }
            docker exec "$OR_C" nginx -s reload
            sleep 2
            echo "=== verify https local ==="
            curl -sk -o /dev/null -w "%{http_code}\n" https://127.0.0.1/ -H "Host: magical.jadeai.icu"
