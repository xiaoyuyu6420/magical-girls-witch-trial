name: Tmp HTTPS Fix

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/tmp-inspect.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect image files
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: false
          script: |
            echo "=== image ls ==="
            docker run --rm xiaoyuyu123/magical-girls-witch-trial:latest ls /app/src/ 2>&1 | head -10
            echo "=== image content dir ==="
            docker run --rm xiaoyuyu123/magical-girls-witch-trial:latest sh -c "ls /app/src/content/packs/witch-trial/ 2>&1 | head -5; ls /app/prisma/ 2>&1 | head -6"
