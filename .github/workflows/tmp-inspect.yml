name: Tmp HTTPS Fix

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/tmp-inspect.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Verify DB content
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: false
          script: |
            docker ps --format "{{.Names}} {{.Status}}" | grep magical
            echo "=== DB slogan check ==="
            docker exec magical-girls-witch-trial sqlite3 /app/data/witch-trial.db "SELECT code, substr(slogan,1,30) FROM PersonalityType WHERE code IN ('HIRO','NOAH','MARGO','HANNA');"
            echo "=== DB Q26 label check ==="
            docker exec magical-girls-witch-trial sqlite3 /app/data/witch-trial.db "SELECT substr(label,1,40) FROM Option WHERE label LIKE '%生死%' OR label LIKE '%圣光%';"
