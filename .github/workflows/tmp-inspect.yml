name: Tmp HTTPS Fix

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/tmp-inspect.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Container logs
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: false
          script: |
            docker ps -a --format "{{.Names}} {{.Status}}" | grep magical
            echo "=== logs ==="
            docker logs --tail 30 magical-girls-witch-trial 2>&1 | tail -30
