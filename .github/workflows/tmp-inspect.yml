name: Tmp HTTPS Fix

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/tmp-inspect.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Rewrite conf (single 443 block)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: false
          script: |
            set -e
            CONF=/opt/1panel/www/conf.d/magical.jadeai.icu.conf
            OR_C=1Panel-openresty-ykQi
            B64=""
            echo "$B64" | tr -d '\n' | base64 -d > /tmp/new-conf
            echo "=== decoded conf head ==="; head -6 /tmp/new-conf
            sudo -n chown "$(whoami)" "$CONF"
            sudo -n cp "$CONF" "$CONF.bak.$(date +%s)" && sudo -n cp /tmp/new-conf "$CONF"
            docker exec "$OR_C" nginx -t || { echo TEST_FAILED; exit 1; }
            docker exec "$OR_C" nginx -s reload
            sleep 2
            echo "=== verify https local ==="
            curl -sk -o /dev/null -w "%{http_code}\n" https://127.0.0.1/ -H "Host: magical.jadeai.icu"
            curl -sk -o /dev/null -w "%{http_code}\n" https://127.0.0.1/api/count -H "Host: magical.jadeai.icu"
