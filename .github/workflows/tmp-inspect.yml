name: Debug:Inspect Server Reverse Proxy

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect nginx/caddy & ports
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: false
          script: |
            echo "=== whoami/host ==="; whoami; hostname
            echo "=== listening ports ==="; (sudo -n ss -tlnp 2>/dev/null || ss -tlnp 2>/dev/null || netstat -tlnp 2>/dev/null) | head -30
            echo "=== nginx sites ==="; (sudo -n ls /etc/nginx/sites-enabled/ 2>/dev/null; ls /etc/nginx/sites-enabled/ 2>/dev/null) | head -10
            echo "=== nginx server_name ==="; (sudo -n grep -r "server_name" /etc/nginx/sites-enabled/ /etc/nginx/conf.d/ 2>/dev/null || grep -r "server_name" /etc/nginx/sites-enabled/ /etc/nginx/conf.d/ 2>/dev/null) | head -20
            echo "=== caddy ==="; (sudo -n cat /etc/caddy/Caddyfile 2>/dev/null || cat /etc/caddy/Caddyfile 2>/dev/null) | head -30
            echo "=== cert files ==="; sudo -n ls /etc/letsencrypt/live/ 2>/dev/null || ls /etc/letsencrypt/live/ 2>/dev/null || echo "no letsencrypt dir"
