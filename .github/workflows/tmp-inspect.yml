name: Tmp HTTPS Fix

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/tmp-inspect.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check image content
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: false
          script: |
            docker ps --format "{{.Names}} {{.Image}} {{.Status}}" | grep magical
            echo "=== image files ==="
            docker exec magical-girls-witch-trial ls /app/src/content 2>&1 | head -5
            docker exec magical-girls-witch-trial ls /app/src/data 2>&1 | head -5
