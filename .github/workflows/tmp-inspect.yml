name: Debug:Inspect Server Reverse Proxy

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Verify app container healthy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: false
          script: |
            docker ps --format "{{.Names}} {{.Status}}" | head -5
            echo "=== health ==="; curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://127.0.0.1:8091/api/count; echo
            docker logs --tail 6 magical-girls-witch-trial 2>&1 | tail -6
