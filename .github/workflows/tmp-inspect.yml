name: Tmp HTTPS Fix

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/tmp-inspect.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Fix perms and diagnose handshake
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: false
          script: |
            set -e
            OR_C=1Panel-openresty-ykQi
            SSL_DIR=/opt/1panel/www/sites/magical.jadeai.icu/ssl
            echo "=== api site ssl perms (reference) ==="
            grep -E "ssl_certificate" /opt/1panel/www/conf.d/api.jadeai.icu.conf | head -4
            ls -la /opt/1panel/www/sites/api.jadeai.icu/ssl/ 2>/dev/null | head -6
            echo "=== our ssl perms before ==="
            ls -la "$SSL_DIR"
            chmod 644 "$SSL_DIR/privkey.pem" "$SSL_DIR/fullchain.pem"
            echo "=== curl -v handshake ==="
            curl -skv https://127.0.0.1/ -H "Host: magical.jadeai.icu" 2>&1 | grep -E "SSL|error|subject|HTTP|schem" | head -10
            echo "=== openresty logs ==="
            docker logs --tail 12 "$OR_C" 2>&1 | tail -12
            echo "=== final code ==="
            curl -sk -o /dev/null -w "%{http_code}\n" https://127.0.0.1/ -H "Host: magical.jadeai.icu" || true
            curl -sk -o /dev/null -w "%{http_code}\n" https://127.0.0.1/api/count -H "Host: magical.jadeai.icu" || true
