name: Build & Push to Docker Hub

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DOCKER_IMAGE: xiaoyuyu123/magical-girls-witch-trial

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    # 服务器 secrets 缺失时跳过部署（fork/PR 场景不会报错）
    if: ${{ vars.DOCKER_IMAGE_NAME != 'disabled' }}

    steps:
      - name: Deploy to server (update.sh)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: true
          script: |
            whoami
            ls -ld /home/magical-girls || true
            # 部署目录若为 root 所有，SSH 用户写不进（备份/下载 compose 均需写权限）
            sudo -n chown -R "$(whoami)":"$(whoami)" /home/magical-girls || echo "[warn] sudo -n 不可用，继续尝试"
            cd /home/magical-girls
            # 磁盘急救（内联，不依赖 raw CDN 缓存——2026-09-02 No space 事故）：
            # 清 compose 备份（留最近1份）+ 未被运行容器使用的镜像/构建缓存。
            # 数据库在 bind mount 数据卷里，不受影响。
            ls -t docker-compose.yml.backup.* 2>/dev/null | tail -n +2 | xargs -r rm -f
            docker image prune -af >/dev/null 2>&1 || true
            docker builder prune -af >/dev/null 2>&1 || true
            docker system prune -f >/dev/null 2>&1 || true
            echo "磁盘清理后：$(df -h / | tail -1 | awk '{print $4 " 可用"}')"
            curl -sSL https://raw.githubusercontent.com/xiaoyuyu6420/magical-girls-witch-trial/main/scripts/update.sh | bash
            docker compose ps
